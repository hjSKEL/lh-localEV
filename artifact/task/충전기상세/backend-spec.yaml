backend:
  description: >
    충전기(ChargingStation) 상세 관리 서버 명세.
    충전소(ChargePoint)에 속한 충전기 CRUD.
    충전기 등록 시 ChargePoint의 highCsCount/lowCsCount/electSupplyCapability 자동 집계.
    ChargerStatusInfo 채널 수(csCableCount)만큼 초기 상태 레코드 자동 생성.
    삭제 시 역집계, 하드 삭제(물리 삭제).

  module_structure:
    controller: adminweb → resource/charger/ChargingStationInfoResource.java
    service_interface: charger-process → ChargingStationService.java
    service_impl: charger-process → logic/ChargingStationServiceImpl.java
    entity_interface: charger-entity → ChargingStationProvider.java, ChargePointProvider.java, ChargerStatusProvider.java
    entity_impl: charger-entity → logic/ChargingStationProviderImpl.java, ChargePointProviderImpl.java
    mapper: charger-entity → dao/ChargingStationMapper.java, ChargePointMapper.java
    domain: charger-domain → domain/ChargingStation.java, ChargingStationCsm.java
    search_cond: charger-domain → shared/ChargingStationSearchCond.java (존재 시)

  base_url: /ws/charger


# ──────────────────────────────────────────────
# Endpoints
# ──────────────────────────────────────────────
endpoints:

  - id: LIST_FINDER
    method: GET
    url: /ws/charger/finder
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargingStationList
    description: 충전기 목록 조회 (모니터링/검색용)
    request_params:
      - name: pageNumber
        type: int (0-based)
        default: 0
      - name: pageItemSize
        type: int
        default: 20
      - name: cpId
        type: String
        note: 6자리 충전소ID 필터
      - name: csId
        type: String
        note: 2자리 충전기ID 필터
      - name: csUniqId
        type: String
        note: 충전기 고유ID (cpId+csId 8자리) LIKE 검색
    response_type: "Page<ChargingStationCsm>"
    response_fields:
      criteria:
        totalItemCount: int
        pageNumber: int
        pageItemSize: int
      result:
        - cpId: String
        - csId: String
        - csUniqId: String (cpId+csId 8자리)
        - cpName: String
        - makerType: String (commonCode CHMK00)
        - csType: String (commonCode CHKT00)
        - csCableCount: int (커넥터 수)
        - useYn: String (Y|N)
        - ocppVersion: String
        - writer.registrationDate: Date
    service_call: chargingStationService.retrieveChargingStationList(searchCond)

  - id: DETAIL
    method: GET
    url: /ws/charger/chargingStation/{cpId}/{csId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargingStationDetail
    description: 충전기 단건 조회
    path_params:
      - name: cpId
        type: String (6자리)
      - name: csId
        type: String (2자리)
    response_type: ChargingStationCsm
    response_fields:
      - cpId, csId, csUniqId
      - cpName (충전소명)
      - makerType (제조사, CHMK00)
      - csType (충전기유형, CHKT00)
      - csCableCount (케이블 수)
      - csCatCode (커넥터유형, CHRA00)
      - electCapacity (전력용량 kW)
      - useYn
      - ocppVersion
      - fmwVer (펌웨어 버전)
      - fwUpdateDate
      - memo
      - writer: { regUserId, registrationDate, updUserId, updateDate }
    service_call: chargingStationService.retrieveChargingStationByCpIdAndCsId(cpId, csId)

  - id: GET_MAX_CS_ID
    method: GET
    url: /ws/charger/maxCpId/{cpId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchMaxCsId
    description: 충전소 내 최대 csId 조회 (신규 등록 시 자동 채번 힌트)
    path_params:
      - name: cpId
        type: String (6자리)
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: int (최대 csId 번호, 없으면 0)
    service_call: chargingStationService.retrieveMaxCsId(cpId)

  - id: GET_CP_LIST
    method: GET
    url: /ws/charger/{cpId}/list
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargingStationListByCpId
    description: 충전소별 충전기 목록 조회 (고장접수 등 팝업용)
    path_params:
      - name: cpId
        type: String (6자리)
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: List<ChargingStation>
        - csId: String
        - csUniqId: String
    service_call: chargingStationService.retrieveChargingStationListByCpId(cpId)

  - id: GET_INFO
    method: GET
    url: /ws/charger/{cpId}/{csId}/info
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargingStationInfo
    description: 충전기 OCPP 버전 정보 조회 (충전기 제어 진입점에서 버전 확인용)
    path_params:
      - name: cpId
        type: String (6자리)
      - name: csId
        type: String (2자리)
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result:
        ocppVersion: "ocpp1.6 | ocpp2.0.1"
        csUniqId: String
        cpId: String
        csId: String
    service_call: chargingStationService.retrieveChargingStationByCpIdAndCsId(cpId, csId)
    note: "null 반환 시 FAIL — 존재하지 않는 충전기"

  - id: REGISTER
    method: POST
    url: /ws/charger/chargingStation
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: registerChargingStation
    description: 충전기 신규 등록
    request_body: ChargingStationCsm
      required:
        - cpId: String (6자리, 등록된 충전소)
        - csId: String (2자리, 해당 충전소 내 유일)
        - makerType: String (CHMK00 코드)
        - csType: String (CHKT00 코드)
        - csCableCount: int (1 이상)
        - csCatCode: String (CHRA00 코드)
        - electCapacity: int (kW)
        - useYn: String (Y|N)
        - ocppVersion: String
      optional:
        - fmwVer: String
        - memo: String
    server_processing:
      - writer.regUserId = 세션 로그인 사용자 ID 자동 설정
      - "충전소 cpUseYn=N 이면 useYn=Y 등록 시 KEVITException 발생 (충전소 미사용 상태)"
      - "ChargePoint.highCsCount / lowCsCount / electSupplyCapability 자동 집계 업데이트"
      - "ChargerStatusInfo 레코드 csCableCount 수만큼 생성 (evseId 1~N)"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: ChargingStationCsm (등록된 객체)
    service_call: chargingStationService.registerChargingStation(chargingStation)
    db_operation: INSERT TB_CHCS001 + UPDATE TB_CHCP001 카운트 + INSERT TB_CHST001 × csCableCount

  - id: UPDATE
    method: PUT
    url: /ws/charger/chargingStation/{cpId}/{csId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: updateChargingStation
    description: 충전기 정보 수정
    path_params:
      - name: cpId
        type: String
      - name: csId
        type: String
    request_body: ChargingStationCsm
      - makerType, csType, csCableCount, csCatCode
      - electCapacity, useYn, fmwVer, memo
    server_processing:
      - cpId/csId는 PathVariable로 덮어씀
      - writer.updUserId = 세션 로그인 사용자 ID
      - "충전소 cpUseYn=N 이고 useYn=Y 로 변경 시 KEVITException (충전소 미사용)"
      - "csCableCount 변경 시 ChargePoint.electSupplyCapability 재집계"
      - "충전기유형(csType) 변경 시 ChargePoint.highCsCount/lowCsCount 재집계"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
    service_call: chargingStationService.modifyChargingStation(chargingStation)
    db_operation: UPDATE TB_CHCS001 + UPDATE TB_CHCP001 카운트 재집계

  - id: DELETE
    method: DELETE
    url: /ws/charger/chargingStation/{cpId}/{csId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: deleteChargingStation
    description: 충전기 삭제 (물리 삭제, ChargePoint 카운트 역집계)
    path_params:
      - name: cpId
        type: String
      - name: csId
        type: String
    server_processing:
      - "ChargePoint.highCsCount / lowCsCount / electSupplyCapability 역집계 업데이트"
      - "ChargerStatusInfo 레코드 삭제"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
    service_call: chargingStationService.removeChargingStation(cpId, csId)
    db_operation: DELETE TB_CHCS001 + UPDATE TB_CHCP001 카운트 + DELETE TB_CHST001

  - id: DOWNLOAD_EXCEL
    method: GET
    url: /ws/charger/chargingStation/download/list
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: downloadChargingStationList
    description: 충전기 목록 엑셀 다운로드
    request_params: LIST_FINDER 와 동일
    server_processing:
      - pageNumber=0, pageItemSize=Integer.MAX_VALUE 로 전체 조회
      - ExcelDownloadView 사용
      - 템플릿: CS_001.xlsx
      - "파일명: \"충전기목록(YYYYMMDD).xlsx\""
    response_type: View (ExcelDownloadView)
    excel_columns: [seq, csUniqId, cpName, makerType, csType, csCableCount, electCapacity, useYn, ocppVersion, registrationDate]


# ──────────────────────────────────────────────
# Service Layer
# ──────────────────────────────────────────────
service:
  class: ChargingStationServiceImpl
  dependencies:
    - ChargingStationProvider (충전기 DB CRUD)
    - ChargePointProvider (충전소 카운트 업데이트)
    - ChargerStatusProvider (상태 초기 레코드 생성/삭제)

  business_rules:
    - "등록 시 충전소 cpUseYn=N → useYn=Y 등록 불가 (KEVITException)"
    - "csType=급속(highCs) → ChargePoint.highCsCount +1, 완속 → lowCsCount +1"
    - "electCapacity → ChargePoint.electSupplyCapability 합산 업데이트"
    - "등록 시 ChargerStatusInfo csCableCount 개수만큼 evseId 1~N 레코드 생성"
    - "삭제 시 위 집계 역연산, ChargerStatusInfo 해당 레코드 삭제"
    - "수정 시 csType/csCableCount/electCapacity 변경 감지 후 ChargePoint 재집계"


# ──────────────────────────────────────────────
# DB Tables
# ──────────────────────────────────────────────
db_tables:
  - table: TB_CHCS001
    description: 충전기 정보
    key_columns:
      - CP_ID: VARCHAR(6) PK
      - CS_ID: VARCHAR(2) PK
    main_columns:
      - CS_UNIQ_ID: VARCHAR(8) (cpId+csId 합성)
      - MAKER_TYPE: VARCHAR(10) (CHMK00)
      - CS_TYPE: VARCHAR(10) (CHKT00 — 급속/완속 구분)
      - CS_CABLE_COUNT: INT (커넥터/케이블 수)
      - CS_CAT_CODE: VARCHAR(10) (CHRA00)
      - ELECT_CAPACITY: INT (kW)
      - USE_YN: CHAR(1) Y|N
      - OCPP_VERSION: VARCHAR(20)
      - FMW_VER: VARCHAR(50)
      - FW_UPDATE_DATE: DATETIME
      - MEMO: VARCHAR(300)
      - REG_USER_ID: VARCHAR(20)
      - REG_DATE: DATETIME
      - UPD_USER_ID: VARCHAR(20)
      - UPD_DATE: DATETIME

  - table: TB_CHST001
    description: 충전기 상태 정보 (채널별)
    key_columns:
      - CP_ID: VARCHAR(6) PK
      - CS_ID: VARCHAR(2) PK
      - EVSE_ID: INT PK (채널번호 1~N)
    main_columns:
      - CS_STAT_CODE: VARCHAR(20)
      - CS_CABLE_STATUS: VARCHAR(10)
      - USE_YN: CHAR(1)
      - UPD_DATE: DATETIME

  - table: TB_CHCP001
    description: 충전소 정보 (카운트 집계 참조)
    note: 충전기 등록/삭제 시 HIGH_CS_COUNT, LOW_CS_COUNT, ELECT_SUPPLY_CAPABILITY 업데이트됨


# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
security:
  session: Spring Security SessionManager.getLoginUser()
  logging: >
    [REQ] USER ID, ACCESS_IP, URL, METHOD, DATA 로그
    [RES] USER ID, ACCESS_IP, URL, METHOD, SUCCESS/FAIL 로그
  access_log: AbstractResource.getAccessIp(request)
