backend:
  description: >
    충전기 제어(CsControl) 서버 명세.
    OCPP 1.6 프로토콜을 통한 충전기 원격 제어 명령 전달.
    Ocpp16CmdResource — 관리 웹의 명령 요청을 TCP 소켓(127.0.0.1:22012)의
    OCPP 1.6 Daemon으로 포워딩.
    ChargerStatusLogResource — 충전기 상태 이력 조회 (커서 기반 페이징).

  module_structure:
    controllers:
      - adminweb → resource/cmd/Ocpp16CmdResource.java
      - adminweb → resource/charger/ChargerStatusLogResource.java
    service_interface: charger-process → ChargerStatusInfoHisService.java
    service_impl: charger-process → logic/ChargerStatusInfoHisServiceImpl.java
    entity_interface: charger-entity → ChargerStatusInfoHisProvider.java
    mapper: charger-entity → dao/ChargerStatusHisMapper.java
    domain: charger-domain → domain/ChargerStatusInfoHis.java
    ocpp_daemon:
      protocol: TCP Socket
      host: 127.0.0.1
      port: 22012
      message_format: JSON (param1=명령타입, param2=명령파라미터JSON)


# ──────────────────────────────────────────────
# Endpoints
# ──────────────────────────────────────────────
endpoints:

  - id: SEND_OCPP16_COMMAND
    method: PUT
    url: /ws/cmd/ocpp16/{csId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: sendOcpp16Command
    controller_class: Ocpp16CmdResource
    description: OCPP 1.6 명령 전송 (TCP 소켓으로 Daemon에 포워딩)
    path_params:
      - name: csId
        type: String ("{cpId}-{csId}" 형식, ex "AABBCC-01")
        note: "프론트엔드에서 {cpId}-{csId} 조합으로 전달"
    request_body: CmdVo (JSON)
      - param1: String (명령 타입)
          values:
            - Reset
            - RemoteStartTransaction
            - RemoteStopTransaction
            - SetChargingProfile
            - ChangeAvailability
            - GetConfiguration
            - ChangeConfiguration
            - ClearChargingProfile
            - GetDiagnostics
            - UpdateFirmware
            - TriggerMessage
            - UnlockConnector
      - param2: String (명령 파라미터 JSON 문자열, ocpp16Command.js 가 생성)
    server_processing:
      - TCP Socket 연결 → 127.0.0.1:22012
      - "JSON 포맷: {csId, param1, param2} 직렬화 후 소켓 전송"
      - 소켓 응답 대기 후 결과 반환
      - "소켓 연결 실패 또는 타임아웃 시 FAIL 반환"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: String (Daemon 응답 메시지, 있을 경우)
    note: >
      Daemon(ocpp16-daemon)은 별도 프로세스로 실행되며
      실제 충전기와 OCPP WebSocket 통신을 담당.
      이 엔드포인트는 단순 프록시 역할.

  - id: GET_STATUS_LOG
    method: GET
    url: /ws/charger/logList
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargerStatusLogList
    controller_class: ChargerStatusLogResource
    description: 충전기 상태 이력 목록 조회 (커서 기반 페이징)
    request_params:
      - name: pageNumber
        type: int (0-based)
        default: 0
      - name: pageItemSize
        type: int
        default: 20
        max: 40
        note: "최대 40건 강제 제한 (maxPageItemSize=40)"
      - name: cpId
        type: String (6자리)
      - name: csId
        type: String (2자리)
      - name: evseId
        type: String
        note: "채널 필터 (0=전체, 1=CH1, 2=CH2)"
        default: "0"
      - name: fromDate
        type: String (YYYYMMDD)
        note: 첫 페이지 조회 시 기준 날짜 시작
      - name: toDate
        type: String (YYYYMMDD)
        note: 첫 페이지 조회 시 기준 날짜 종료
      - name: csStatusId
        type: Long
        note: "커서 기반 다음 페이지 조회 시 사용 (idxArr/seqArr 방식)"
    response_type: "Page<ChargerStatusInfoHis>"
    response_fields:
      criteria:
        totalItemCount: int
        pageNumber: int
        pageItemSize: int
      result:
        - csStatusId: Long (커서 ID)
        - updateDate: DateTime (서버 수집 시각)
        - infoCollDate: DateTime (단말 수집 시각)
        - rechargingId: Long (충전 트랜잭션 ID, null 가능)
        - cpId: String
        - csId: String
        - evseId: int (채널번호)
        - csStatCode: String (충전기 상태, commonCode)
        - csCableStatus: String (케이블 상태)
        - csErrorStatus: String (오류 상태)
        - cuEleEnerge: BigDecimal (사용 전력량)
        - caEleEnerge: BigDecimal (계량기 전력량)
        - instChAmont: BigDecimal (순간 충전 금액)
        - instChSum: BigDecimal (순간 누적 금액)
        - chSum: BigDecimal (총 충전 금액)
        - chStartDate: DateTime (충전 시작 시각)
        - chEndDate: DateTime (충전 종료 시각)
        - eventCode: String (이벤트 코드)
        - cutCardNo: String (카드번호 마스킹)
    service_call: chargerStatusInfoHisService.retrieveChargerStatusInfoHisList(searchCond)

  - id: GET_CHARGER_INFO
    method: GET
    url: /ws/charger/chargingStation/{cpId}/{csId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargingStationDetail
    controller_class: ChargingStationInfoResource
    description: 충전기 기본 정보 조회 (제어 페이지 상단 표시용)
    path_params:
      - name: cpId
        type: String (6자리)
      - name: csId
        type: String (2자리)
    response_type: ChargingStationCsm
    response_fields:
      - csUniqId, cpId, csId
      - cpName (충전소명)
      - makerType (제조사, CHMK00)
      - fmwVer (펌웨어 버전)
      - ocppVersion ("ocpp1.6" | "ocpp2.0.1")
    note: ocppVersion != "ocpp1.6" 이면 프론트에서 OCPP20/control 로 리다이렉트
    service_call: chargingStationService.retrieveChargingStationByCpIdAndCsId(cpId, csId)


# ──────────────────────────────────────────────
# OCPP 1.6 Commands (param1 값별 param2 포맷)
# ──────────────────────────────────────────────
ocpp16_commands:

  - type: Reset
    param2_schema:
      type: String ("Hard" | "Soft")

  - type: RemoteStartTransaction
    param2_schema:
      idTag: String (카드번호 16자리, 하이픈 제거)
      connectorId: int (1~3)

  - type: RemoteStopTransaction
    param2_schema:
      transactionId: long (22자리 충전 트랜잭션 ID)

  - type: SetChargingProfile
    param2_schema:
      connectorId: int
      csChargingProfiles:
        chargingProfileId: int
        stackLevel: int
        chargingProfilePurpose: String
        chargingProfileKind: String
        validFrom: String (ISO8601)
        validTo: String (ISO8601)
        chargingSchedule:
          chargingRateUnit: String ("W" | "A")
          chargingSchedulePeriod:
            - startPeriod: int (0 고정 for 첫 항목)
              limit: int (kW)

  - type: ChangeAvailability
    param2_schema:
      connectorId: int
      type: String ("Operative" | "Inoperative")

  - type: GetConfiguration
    param2_schema:
      key: [String] (조회할 설정 키 목록)

  - type: ChangeConfiguration
    param2_schema:
      key: String
      value: String

  - type: UnlockConnector
    param2_schema:
      connectorId: int

  - type: TriggerMessage
    param2_schema:
      requestedMessage: String
      connectorId: int (선택)


# ──────────────────────────────────────────────
# Service Layer
# ──────────────────────────────────────────────
service:
  class: ChargerStatusInfoHisServiceImpl
  dependencies:
    - ChargerStatusInfoHisProvider (상태 이력 DB 조회)

  business_rules:
    - "pageItemSize 최대 40건 강제 제한"
    - "커서 기반 페이징: csStatusId(PK) 기준 이전/이후 조회"
    - "fromDate/toDate 있으면 날짜 범위 필터 (첫 페이지), csStatusId 있으면 커서 이동"
    - "evseId=0 이면 전체 채널 조회"

  ocpp_proxy:
    description: "Ocpp16CmdResource는 서비스 레이어 없이 직접 TCP 소켓 통신"
    socket_target: "127.0.0.1:22012 (ocpp16-daemon)"
    timeout: "소켓 타임아웃 설정 (기본값 확인 필요)"


# ──────────────────────────────────────────────
# DB Tables
# ──────────────────────────────────────────────
db_tables:
  - table: TB_CHSTH001
    description: 충전기 상태 이력 (상태 로그)
    key_columns:
      - CS_STATUS_ID: BIGINT PK AUTO_INCREMENT (커서 기반 페이징 키)
    main_columns:
      - CP_ID: VARCHAR(6)
      - CS_ID: VARCHAR(2)
      - EVSE_ID: INT (채널번호)
      - CS_STAT_CODE: VARCHAR(20)
      - CS_CABLE_STATUS: VARCHAR(10)
      - CS_ERROR_STATUS: VARCHAR(20)
      - CU_ELE_ENERGE: DECIMAL
      - CA_ELE_ENERGE: DECIMAL
      - INST_CH_AMONT: DECIMAL
      - INST_CH_SUM: DECIMAL
      - CH_SUM: DECIMAL
      - CH_START_DATE: DATETIME
      - CH_END_DATE: DATETIME
      - EVENT_CODE: VARCHAR(20)
      - CUT_CARD_NO: VARCHAR(50)
      - RECHARGING_ID: BIGINT (충전 트랜잭션 ID, nullable)
      - INFO_COLL_DATE: DATETIME (단말 수집 시각)
      - UPD_DATE: DATETIME (서버 수집 시각)


# ──────────────────────────────────────────────
# Infrastructure
# ──────────────────────────────────────────────
infrastructure:
  ocpp16_daemon:
    type: 별도 Java 프로세스
    socket_port: 22012
    location: localcsms/daemon/ocpp16-daemon/
    role: >
      OCPP 1.6 WebSocket 서버 역할.
      충전기로부터 메시지 수신 및 관리 웹에서 전달한 명령을 충전기에 전달.

# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
security:
  session: Spring Security SessionManager.getLoginUser()
  logging: >
    [REQ] USER ID, ACCESS_IP, URL, METHOD, DATA 로그
    [RES] USER ID, ACCESS_IP, URL, METHOD, SUCCESS/FAIL 로그
  access_log: AbstractResource.getAccessIp(request)
