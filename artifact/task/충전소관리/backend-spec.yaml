backend:
  description: >
    충전소(ChargePoint) 관리 서버 명세.
    충전기들이 설치되는 물리적 충전소 CRUD.
    충전소 사용여부 N 설정 시 연결된 모든 충전기 useYn 동기화.
    소프트 삭제(deleteYn/deleteDate) 방식.

  module_structure:
    controller: adminweb → resource/charger/ChargePointResource.java
    service_interface: charger-process → ChargePointService.java
    service_impl: charger-process → logic/ChargePointServiceImpl.java
    entity_interface: charger-entity → ChargePointProvider.java
    entity_impl: charger-entity → logic/ChargePointProviderImpl.java
    mapper: charger-entity → dao/ChargePointMapper.java
    domain: charger-domain → domain/ChargePoint.java
    search_cond: charger-domain → shared/ChargePointSearchCond.java

  base_url: /ws/charger/chargePoint


# ──────────────────────────────────────────────
# Endpoints
# ──────────────────────────────────────────────
endpoints:

  - id: LIST_MONITORING
    method: GET
    url: /ws/charger/chargePoint/allChargePointList4Monitoring
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchAllChargePointList4Monitoring
    description: 충전소 목록 조회 (모니터링용, 급속/완속 필터 포함)
    request_params:
      - name: pageNumber
        type: int (0-based)
        default: 0
      - name: pageItemSize
        type: int
        default: 20
      - name: cpName
        type: String
        note: URI 디코딩 후 LIKE 검색
      - name: csType
        type: String
        values: [hiCs, loCs, ""]
        note: "hiCs → highCsCount > 0 / loCs → lowCsCount > 0 / '' → 전체"
    response_type: "Page<ChargePoint>"
    response_fields:
      criteria:
        totalItemCount: int
        pageNumber: int
        pageItemSize: int
      result:
        - cpId: String
        - cpName: String
        - cpLocation: String
        - highCsCount: int
        - lowCsCount: int
        - electSupplyCapability: int
        - cpUseYn: String (Y|N)
        - deleteYn: String (Y|N)
        - writer.registrationDate: Date
    service_call: chargePointService.retrieveChargePointBySearchCond(searchCond)

  - id: DETAIL
    method: GET
    url: /ws/charger/chargePoint/{cpId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: searchChargePointDetail
    description: 충전소 단건 조회
    path_params:
      - name: cpId
        type: String (6자리)
    response_type: ChargePoint
    response_fields:
      - cpId, cpName, cpLocation
      - highCsCount, lowCsCount, electSupplyCapability
      - cpUseYn, deleteYn, deleteDate
      - memo
      - writer: { regUserId, registrationDate, updUserId, updateDate }
    service_call: chargePointService.retrieveChargePointBySpotId(cpId)

  - id: REGISTER
    method: POST
    url: /ws/charger/chargePoint
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: registerChargePointForm
    description: 충전소 신규 등록
    request_body: ChargePoint
      required:
        - cpId: String (6자리, 앞자리 '0' 불가)
        - cpName: String (max 60)
        - cpLocation: String (max 200)
        - cpUseYn: String (Y|N)
      optional:
        - highCsCount: int (초기값 0)
        - lowCsCount: int (초기값 0)
        - electSupplyCapability: int (초기값 0)
        - memo: String (max 300)
    server_processing:
      - writer.regUserId = 세션 로그인 사용자 ID 자동 설정
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: ChargePoint (등록된 객체, cpId 포함)
    service_call: chargePointService.registerChargePoint(chargePoint)
    db_operation: INSERT TB_CHCP001

  - id: UPDATE
    method: PUT
    url: /ws/charger/chargePoint/{cpId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: updateChargePoint
    description: 충전소 정보 수정
    path_params:
      - name: cpId
        type: String
    request_body: ChargePoint
      - cpName, cpLocation, cpUseYn, memo
    server_processing:
      - cpId는 PathVariable로 덮어씀 (body.cpId 무시)
      - writer.updUserId = 세션 로그인 사용자 ID
      - "cpUseYn=N 이면 provider.retrieveChargingStationCsmByCpId(cpId) 로 연결 충전기 조회 후 전체 useYn=N 업데이트"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
    service_call: chargePointService.modifyChargePoint(chargePoint)
    db_operation: UPDATE TB_CHCP001 + (조건부) UPDATE TB_CHCS001 전체

  - id: DELETE
    method: PUT
    url: /ws/charger/chargePoint/delete/{cpId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: deleteSpot
    description: 충전소 소프트 삭제 (deleteYn=Y, deleteDate 설정)
    path_params:
      - name: cpId
        type: String
    server_processing:
      - writer.updUserId = 세션 로그인 사용자 ID
      - note: 연결 충전기 잔여 확인은 클라이언트 책임 (서버는 단순 삭제)
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
    service_call: chargePointService.removeChargePoint(chargePoint)
    db_operation: UPDATE TB_CHCP001 SET DELETE_YN='Y', DELETE_DATE=NOW()

  - id: DOWNLOAD_EXCEL
    method: GET
    url: /ws/charger/chargePoint/download/list
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: downloadCharePointList
    description: 충전소 목록 엑셀 다운로드
    request_params: LIST_MONITORING 과 동일
    server_processing:
      - pageNumber=0, pageItemSize=Integer.MAX_VALUE 로 전체 조회
      - ExcelDownloadView 사용
      - 템플릿: CP_001.xlsx
      - 파일명: "충전소목록(YYYYMMDD).xlsx"
    response_type: View (ExcelDownloadView)
    excel_columns: [seq, cpId, cpName, placeName(cpLocation), lowCsCount, highCsCount, electSupplyCapability, cpUseYn, deleteYn, registrationDate]

  - id: CHECK_DUPLICATE_ID
    method: GET
    url: /ws/charger/chargePoint/checkDupleChargePointId/{cpId}
    roles: [ROLE_ADMIN, ROLE_OPER]
    controller_method: checkDupleChargePointId
    description: 충전소 ID 중복 확인
    path_params:
      - name: cpId
        type: String (6자리)
    server_processing:
      - chargePointService.retrieveChargePointBySpotId(cpId)
      - "null 반환 → SUCCESS (사용 가능)"
      - "null 아님 → FAIL (이미 등록)"
    response_type: JsonResultSet
    response_fields:
      status: SUCCESS | FAIL
      result: String (메시지)


# ──────────────────────────────────────────────
# Service Layer
# ──────────────────────────────────────────────
service:
  class: ChargePointServiceImpl
  dependencies:
    - ChargePointProvider (DB)
    - ChargingStationProvider (연결 충전기 조회/수정)

  business_rules:
    - "cpUseYn=N 수정 시: 해당 cpId의 모든 ChargingStationCsm.useYn = N 강제 업데이트"
    - "소프트 삭제: deleteYn/deleteDate 컬럼 업데이트 (물리 삭제 아님)"
    - "highCsCount·lowCsCount·electSupplyCapability: 충전기 등록/삭제 시 자동 집계 (ChargingStationService 담당)"


# ──────────────────────────────────────────────
# DB Tables
# ──────────────────────────────────────────────
db_tables:
  - table: TB_CHCP001
    description: 충전소 정보
    key_columns:
      - CP_ID: VARCHAR(6) PK
    main_columns:
      - CP_NAME: VARCHAR(60)
      - CP_LOCATION: VARCHAR(200)
      - HIGH_CS_COUNT: INT (급속 충전기 수, 충전기 등록/삭제 시 자동 집계)
      - LOW_CS_COUNT: INT (완속 충전기 수)
      - ELECT_SUPPLY_CAPABILITY: INT (총 전력량 kW)
      - CP_USE_YN: CHAR(1) Y|N
      - DELETE_YN: CHAR(1) Y|N
      - DELETE_DATE: DATETIME
      - MEMO: VARCHAR(300)
      - REG_USER_ID: VARCHAR(20)
      - REG_DATE: DATETIME
      - UPD_USER_ID: VARCHAR(20)
      - UPD_DATE: DATETIME


# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
security:
  session: Spring Security SessionManager.getLoginUser()
  logging: >
    [REQ] USER ID, ACCESS_IP, URL, METHOD, DATA 로그
    [RES] USER ID, ACCESS_IP, URL, METHOD, SUCCESS/FAIL 로그
  access_log: AbstractResource.getAccessIp(request)
