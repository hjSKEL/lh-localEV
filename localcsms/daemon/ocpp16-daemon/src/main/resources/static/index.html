<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCPP 1.6 Command Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.12); border-radius: 8px; }
        .card-header { background: #fff; border-bottom: 1px solid #e9ecef; font-weight: 600; border-radius: 8px 8px 0 0 !important; }

        /* 충전기 목록 */
        .cp-item { cursor: pointer; border-radius: 0; border-left: none; border-right: none; border-top: none; }
        .cp-item:last-child { border-bottom: none; }
        .cp-item.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }
        .cp-item .badge { font-size: 0.7rem; }
        .cp-item:hover:not(.active) { background: #f8f9fa; }

        /* 로그 패널 */
        #logPanel { height: 580px; overflow-y: auto; font-size: 0.82rem; font-family: 'Consolas', monospace; }
        .log-entry { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
        .log-entry:last-child { border-bottom: none; }
        .log-entry .log-time { color: #888; font-size: 0.75rem; }
        .log-success .log-badge { background: #198754; }
        .log-fail    .log-badge { background: #dc3545; }
        .log-info    .log-badge { background: #0dcaf0; color: #000; }
        .log-badge { color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }

        /* 결과 박스 */
        #resultBox { background: #1e1e1e; color: #d4d4d4; border-radius: 6px; font-size: 0.82rem;
                     font-family: 'Consolas', monospace; white-space: pre-wrap; word-break: break-all;
                     max-height: 200px; overflow-y: auto; padding: 10px; display: none; }
        .result-success { border-left: 4px solid #198754; }
        .result-fail    { border-left: 4px solid #dc3545; }

        /* 자동갱신 표시 */
        #autoRefreshBadge { font-size: 0.72rem; }

        /* 파라미터 폼 */
        .param-label { font-size: 0.82rem; font-weight: 500; color: #495057; margin-bottom: 2px; }
        .param-required::after { content: ' *'; color: #dc3545; }

        /* JSON 에디터 */
        #jsonPayload { font-family: 'Consolas', monospace; font-size: 0.82rem; resize: vertical; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-2">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>OCPP 1.6 Command Console</span>
        <div class="d-flex align-items-center gap-3">
            <span id="autoRefreshBadge" class="badge bg-success">
                <i class="bi bi-arrow-repeat me-1"></i>자동갱신 ON
            </span>
            <span class="text-secondary small">localhost:9000</span>
        </div>
    </div>
</nav>

<div class="container-fluid mt-3 mb-4">
    <div class="row g-3">

        <!-- ① 충전기 목록 -->
        <div class="col-md-3 col-lg-2">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center py-2">
                    <span>연결된 충전기</span>
                    <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="loadSessions()" title="새로고침">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div class="card-body p-0" style="overflow-y:auto; max-height:600px;">
                    <div id="sessionList">
                        <div class="text-center text-muted p-3 small">연결된 충전기 없음</div>
                    </div>
                </div>
                <div class="card-footer py-1 text-center">
                    <small class="text-muted" id="sessionCount">0개 연결</small>
                </div>
            </div>
        </div>

        <!-- ② 명령 입력 -->
        <div class="col-md-5 col-lg-6">
            <div class="card">
                <div class="card-header py-2">명령 전송</div>
                <div class="card-body">

                    <!-- 충전기 ID -->
                    <div class="mb-3">
                        <label class="form-label param-label param-required">충전기 ID (cpId)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-plug-fill"></i></span>
                            <input type="text" id="selectedCpId" class="form-control" placeholder="좌측 목록에서 선택하거나 직접 입력">
                        </div>
                    </div>

                    <!-- 명령 선택 -->
                    <div class="mb-3">
                        <label class="form-label param-label param-required">명령 (Action)</label>
                        <select id="actionSelect" class="form-select" onchange="onActionChange()">
                            <option value="">-- 명령 선택 --</option>
                            <optgroup label="충전 제어">
                                <option value="RemoteStartTransaction">RemoteStartTransaction</option>
                                <option value="RemoteStopTransaction">RemoteStopTransaction</option>
                                <option value="UnlockConnector">UnlockConnector</option>
                            </optgroup>
                            <optgroup label="가용성 / 설정">
                                <option value="Reset">Reset</option>
                                <option value="ClearCache">ClearCache</option>
                                <option value="ChangeAvailability">ChangeAvailability</option>
                                <option value="ChangeConfiguration">ChangeConfiguration</option>
                                <option value="GetConfiguration">GetConfiguration</option>
                            </optgroup>
                            <optgroup label="예약">
                                <option value="ReserveNow">ReserveNow</option>
                                <option value="CancelReservation">CancelReservation</option>
                            </optgroup>
                            <optgroup label="충전 프로파일">
                                <option value="SetChargingProfile">SetChargingProfile</option>
                                <option value="ClearChargingProfile">ClearChargingProfile</option>
                                <option value="GetCompositeSchedule">GetCompositeSchedule</option>
                            </optgroup>
                            <optgroup label="로컬 인증">
                                <option value="GetLocalListVersion">GetLocalListVersion</option>
                                <option value="SendLocalList">SendLocalList</option>
                            </optgroup>
                            <optgroup label="진단 / 펌웨어">
                                <option value="GetDiagnostics">GetDiagnostics</option>
                                <option value="UpdateFirmware">UpdateFirmware</option>
                                <option value="GetLog">GetLog</option>
                            </optgroup>
                            <optgroup label="기타">
                                <option value="TriggerMessage">TriggerMessage</option>
                                <option value="DataTransfer">DataTransfer</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- 파라미터 폼 (동적) -->
                    <div id="paramForm"></div>

                    <!-- JSON 직접 편집 토글 -->
                    <div id="jsonToggleArea" class="mb-3" style="display:none;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label param-label mb-0">Payload (JSON)</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="jsonModeToggle" onchange="toggleJsonMode()">
                                <label class="form-check-label small" for="jsonModeToggle">JSON 직접 편집</label>
                            </div>
                        </div>
                        <div id="jsonPayloadArea" style="display:none;">
                            <textarea id="jsonPayload" class="form-control" rows="7" placeholder='{"key": "value"}'></textarea>
                        </div>
                    </div>

                    <!-- 전송 버튼 -->
                    <button class="btn btn-primary w-100" onclick="sendCommand()" id="sendBtn">
                        <i class="bi bi-send-fill me-2"></i>명령 전송
                    </button>

                    <!-- 결과 표시 -->
                    <div class="mt-3">
                        <div id="resultHeader" class="d-flex justify-content-between align-items-center mb-1" style="display:none !important;">
                            <span class="small fw-bold text-muted">응답 결과</span>
                            <button class="btn btn-sm btn-link p-0 text-muted" onclick="copyResult()">
                                <i class="bi bi-clipboard"></i> 복사
                            </button>
                        </div>
                        <div id="resultBox"></div>
                    </div>

                </div>
            </div>
        </div>

        <!-- ③ 로그 패널 -->
        <div class="col-md-4 col-lg-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center py-2">
                    <span>명령 로그</span>
                    <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="clearLog()">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="logPanel">
                        <div class="text-center text-muted p-3 small">명령 기록이 없습니다</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/command.js"></script>
</body>
</html>
