# 실행 시 포트를 인자로 지정하세요:
#   java -jar api-eai.jar --server.port=8082

spring:
  application:
    name: api-eai
  datasource:
    url: jdbc:mysql://localhost:3306/LOCAL_CSMS?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: oper
    password: kevit!@#

# ── API EAI 설정 ───────────────────────────────────────────────────────────────
api-eai:
  auth-token:
    # OCPP 1.6  : ocpp1.6:ocakey1234567890
    ocpp16: "Basic b2NwcDEuNjpvY2FrZXkxMjM0NTY3ODkw"
    # OCPP 2.0.1: ocpp2.0.1:ocakey1234567890
    ocpp2x: "Basic b2NwcDIuMC4xOm9jYWtleTEyMzQ1Njc4OTA="

# Smart Charging — Dynamic 자동 push 정책
# 운영: enabled=false (외부 EMS 가 직접 트리거)
# OCTT 테스트(Q_109, Q_117): enabled=true (CSMS 자체 스케줄로 push)
smartcharging:
  dynamic:
    auto-push:
      enabled: true
      interval-ms: 5000

mybatis:
  mapper-locations: classpath*:kr/co/kevit/localcsms/**/dao/mr/*_sql.xml
  type-handlers-package: kr.co.kevit.localcsms.common.util.typehandler
  type-aliases-package: >
    kr.co.kevit.localcsms.common.util.typehandler,
    kr.co.kevit.localcsms.common.domain,
    kr.co.kevit.localcsms.common.shared,
    kr.co.kevit.localcsms.system.entity.domain,
    kr.co.kevit.localcsms.system.entity.shared,
    kr.co.kevit.localcsms.organization.entity.domain,
    kr.co.kevit.localcsms.organization.entity.shared,
    kr.co.kevit.localcsms.charger.entity.domain,
    kr.co.kevit.localcsms.charger.entity.shared,
    kr.co.kevit.localcsms.smartcharging.entity.domain,
    kr.co.kevit.localcsms.smartcharging.entity.shared,
    kr.co.kevit.localcsms.customer.entity.domain,
    kr.co.kevit.localcsms.customer.entity.shared,
    kr.co.kevit.localcsms.authority.entity.domain,
    kr.co.kevit.localcsms.authority.entity.shared
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    kr.co.kevit.localcsms.eai.api: DEBUG
