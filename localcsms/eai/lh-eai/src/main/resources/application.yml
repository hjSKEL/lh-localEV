# 실행 시 포트를 인자로 지정하세요:
#   java -jar lh-eai.jar --server.port=1207

spring:
  application:
    name: lh-eai
  # 잘못된 접속 주소를 NoHandlerFoundException 으로 던져 전역 핸들러로 처리한다.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8091

# 외부 WSS 엔드포인트 (예: wss://lh.example.com/socket). 미설정 시 접속 시도하지 않음.
lh:
  wss:
    url: ""
    # OCPP 1.6 Subprotocol — Sec-WebSocket-Protocol 헤더로 협상
    subprotocol: "ocpp1.6"
    # 클라이언트 인증서 (mTLS) — PKCS12 권장
    keystore:
      path: ""
      password: ""
      type: "PKCS12"
    # 서버 인증서 검증용 (생략 시 JVM 기본 TrustManager 사용)
    truststore:
      path: ""
      password: ""
      type: "PKCS12"

logging:
  level:
    kr.co.kevit.localcsms.eai.lh: DEBUG
