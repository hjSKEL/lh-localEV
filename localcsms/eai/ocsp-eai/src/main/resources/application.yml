# server.port 는 기동 인자로 결정됩니다.
# java -jar ocsp-eai.jar --server.port=8080
# 로컬 테스트용 fallback: IDE 에서 args 없이 실행 시에만 아래 주석을 해제하세요.
# server:
#   port: 8080

spring:
  application:
    name: ocsp-eai

# ── OCSP CA 체인 경로 설정 ────────────────────────────────────────────────────
#
# RSA  체인: SHA256withRSA  서명
# ECDSA 체인: SHA256withECDSA 서명
#
# 사용하지 않는 체인은 경로를 비워두면 자동으로 비활성화된다.
# ─────────────────────────────────────────────────────────────────────────────
ocsp:
  rsa:
    # RSA Root CA 인증서 (PEM) — 중간 CA 인증서의 issuer
    root-cert: /root/ca.rsa/certs/rootca.cert.pem
    # RSA 중간 CA 인증서 (PEM)
    ca-cert: /root/ca.rsa/intermediate/certs/intermediate.cert.pem
    # OCSP 서명 인증서 (CA 와 동일하거나 위임 인증서)
    responder-cert: /root/ca.rsa/intermediate/certs/intermediate.cert.pem
    # OCSP 서명 개인키 (PEM, 암호화된 경우 key-password 설정)
    responder-key: /root/ca.rsa/intermediate/private/intermediate.key.pem
    key-password: "acbaltivek"

  ec:
    # ECDSA Root CA 인증서 (PEM) — 중간 CA 인증서의 issuer
    root-cert: /root/ca.ecdsa/certs/rootca.cert.pem
    # ECDSA 중간 CA 인증서 (PEM)
    ca-cert: /root/ca.ecdsa/intermediate/certs/intermediate.cert.pem
    # OCSP 서명 인증서
    responder-cert: /root/ca.ecdsa/intermediate/certs/intermediate.cert.pem
    # OCSP 서명 개인키 (PEM)
    responder-key: /root/ca.ecdsa/intermediate/private/intermediate.key.pem
    key-password: "acbaltivek"

logging:
  level:
    kr.co.kevit.localcsms.eai.ocsp: DEBUG
