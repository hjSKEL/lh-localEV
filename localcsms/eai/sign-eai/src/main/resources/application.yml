# ── Sign EAI 설정 ──────────────────────────────────────────────────────────────
#
# RSA  체인: SHA256withRSA  서명
# ECDSA 체인: SHA256withECDSA 서명
#
# 사용하지 않는 체인은 경로를 비워두면 자동으로 비활성화된다.
# ──────────────────────────────────────────────────────────────────────────────
sign-eai:
  rsa:
    # RSA 중간 CA 인증서 (PEM)
    ca-cert: /root/ca.rsa/intermediate/certs/intermediate.cert.pem
    # RSA CA 서명 개인키 (PEM)
    ca-key:  /root/ca.rsa/intermediate/private/intermediate.key.pem
    key-password: "acbaltivek"

  ec:
    # ECDSA 중간 CA 인증서 (PEM)
    ca-cert: /root/ca.ecdsa/intermediate/certs/intermediate.cert.pem
    # ECDSA CA 서명 개인키 (PEM)
    ca-key:  /root/ca.ecdsa/intermediate/private/intermediate.key.pem
    key-password: "acbaltivek"

  # CSR 저장 경로
  csr-save-path:  /root/ca/intermediate/csr/
  # 서명된 인증서 저장 경로
  cert-save-path: /root/ca/intermediate/cert/
  # 인증서 유효 기간 (일) — openssl.cnf default_days = 375
  cert-validity-days: 375
  # OCSP URI — openssl.cnf authorityInfoAccess
  ocsp-url: "http://ocsp.test.co.kr:8080"

logging:
  level:
    kr.co.kevit.localcsms.eai.sign: DEBUG
