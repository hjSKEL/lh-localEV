# ── V2G Sign EAI 설정 ──────────────────────────────────────────────────────────
#
# V2G PKI (ISO 15118) ECDSA 전용.
# ──────────────────────────────────────────────────────────────────────────────
v2g-sign-eai:
  ec:
    # V2G ECDSA 중간 CA 인증서 (PEM)
    ca-cert: /root/ca.v2g/subca1/subca2/certs/subca2.cert.pem
    # V2G ECDSA CA 서명 개인키 (PEM)
    ca-key:  /root/ca.v2g/subca1/subca2/private/subca2.key.pem
    key-password: "acbaltivek"

  # CSR 저장 경로
  csr-save-path:  /root/ca.v2g/subca1/subca2/csr/
  # 서명된 인증서 저장 경로
  cert-save-path: /root/ca.v2g/subca1/subca2/cert/
  # 인증서 유효 기간 (일)
  cert-validity-days: 375
  # OCSP URI
  ocsp-url: "http://ocsp.test.co.kr:3012"

logging:
  level:
    kr.co.kevit.localcsms.eai.v2gsign: DEBUG
