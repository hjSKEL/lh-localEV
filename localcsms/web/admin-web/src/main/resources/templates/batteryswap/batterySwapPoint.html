<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _cpId = /*[[${cpId}]]*/ '';
var _msg = {
    pointMgmt:        /*[[#{js.batteryswap.point.mgmt}]]*/ '',
    stationMgmt:      /*[[#{js.batteryswap.station.mgmt}]]*/ '',
    operating:        /*[[#{js.batteryswap.point.operating}]]*/ '',
    closed:           /*[[#{js.batteryswap.point.closed}]]*/ '',
    inputCpId:        /*[[#{js.batteryswap.point.input.cp.id}]]*/ '',
    inputCpName:      /*[[#{js.batteryswap.point.input.cp.name}]]*/ '',
    cpIdDigit6:       /*[[#{js.batteryswap.point.cp.id.digit6}]]*/ '',
    duplicateCpId:    /*[[#{js.batteryswap.point.duplicate.cp.id}]]*/ '',
    invalidCoord:     /*[[#{js.batteryswap.point.invalid.coord}]]*/ '',
    confirmDelete:    /*[[#{js.batteryswap.point.confirm.delete}]]*/ '',
    confirmDeleteStation: /*[[#{js.batteryswap.station.confirm.delete}]]*/ '',
    successSave:      /*[[#{js.batteryswap.point.success.save}]]*/ '',
    failSave:         /*[[#{js.batteryswap.point.fail.save}]]*/ '',
    successDelete:    /*[[#{js.batteryswap.point.success.delete}]]*/ '',
    failDelete:       /*[[#{js.batteryswap.point.fail.delete}]]*/ '',
    successSaveStation:/*[[#{js.batteryswap.station.success.save}]]*/ '',
    failSaveStation:  /*[[#{js.batteryswap.station.fail.save}]]*/ '',
    successDeleteStation:/*[[#{js.batteryswap.station.success.delete}]]*/ '',
    failDeleteStation:/*[[#{js.batteryswap.station.fail.delete}]]*/ '',
    inputCsId:        /*[[#{js.batteryswap.station.input.cs.id}]]*/ '',
    csIdDigit2:       /*[[#{js.batteryswap.station.cs.id.digit2}]]*/ '',
    invalidSlot:      /*[[#{js.batteryswap.station.invalid.slot}]]*/ '',
    invalidPercent:   /*[[#{js.batteryswap.station.invalid.percent}]]*/ '',
    confirm:          /*[[#{common.btn.confirm}]]*/ '',
    cancel:           /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/batteryswap/batterySwapPoint.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span id="pageTitle" th:text="#{batteryswap.point.detail.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 기본정보 -->
                            <fieldset>
                                <legend style="font-size:14px;" th:text="#{batteryswap.point.legend.basic}"></legend>
                                <table class="table table-bordered" style="background-color: white;">
                                    <tr>
                                        <th style="width:15%;"><span th:text="#{batteryswap.point.label.cp.id}"></span> *</th>
                                        <td style="width:35%;"><input type="text" id="cpId" class="form-control input-sm" maxlength="6"></td>
                                        <th style="width:15%;"><span th:text="#{batteryswap.point.label.cp.name}"></span> *</th>
                                        <td style="width:35%;"><input type="text" id="cpName" class="form-control input-sm" maxlength="60"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.point.label.opened.from}"></span></th>
                                        <td><input type="text" id="openedFrom" class="form-control input-sm" readonly></td>
                                        <th><span th:text="#{batteryswap.point.label.closed.date}"></span></th>
                                        <td><input type="text" id="closedDate" class="form-control input-sm" readonly></td>
                                    </tr>
                                </table>
                            </fieldset>

                            <!-- 위치 -->
                            <fieldset style="margin-top:10px;">
                                <legend style="font-size:14px;" th:text="#{batteryswap.point.legend.location}"></legend>
                                <table class="table table-bordered" style="background-color: white;">
                                    <tr>
                                        <th style="width:15%;"><span th:text="#{batteryswap.point.label.latitude}"></span></th>
                                        <td style="width:35%;"><input type="number" step="0.0000001" id="latitude" class="form-control input-sm"></td>
                                        <th style="width:15%;"><span th:text="#{batteryswap.point.label.longitude}"></span></th>
                                        <td style="width:35%;"><input type="number" step="0.0000001" id="longitude" class="form-control input-sm"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.point.label.basic.address}"></span></th>
                                        <td colspan="3"><input type="text" id="basicAddress" class="form-control input-sm" maxlength="200"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.point.label.detail.address}"></span></th>
                                        <td colspan="3"><input type="text" id="detailAddress" class="form-control input-sm" maxlength="200"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.point.label.detail.location}"></span></th>
                                        <td colspan="3"><input type="text" id="detailLocation" class="form-control input-sm" maxlength="200"></td>
                                    </tr>
                                </table>
                            </fieldset>

                            <!-- 보유 교환 충전기 (수정 모드에서만) -->
                            <fieldset id="stationsBlock" style="display:none; margin-top:10px;">
                                <legend style="font-size:14px;">
                                    <span th:text="#{batteryswap.point.legend.stations}"></span>
                                    <button type="button" id="btnAddStation" class="btn btn-xs btn-primary" style="float:right; margin-top:-2px;">
                                        <i class="fa fa-plus"></i> <span th:text="#{batteryswap.station.btn.create}"></span>
                                    </button>
                                </legend>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover" style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{batteryswap.station.label.cs.id}"></th>
                                            <th th:text="#{batteryswap.station.label.oper.status}"></th>
                                            <th th:text="#{batteryswap.station.label.enabled}"></th>
                                            <th th:text="#{batteryswap.station.label.slot}"></th>
                                            <th th:text="#{batteryswap.station.label.battery.model}"></th>
                                            <th th:text="#{batteryswap.point.label.action}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyStations"></tbody>
                                    </table>
                                </div>
                            </fieldset>

                            <div class="row" style="padding-top:15px; text-align:right;">
                                <div class="col-sm-12">
                                    <button type="button" id="btnList" class="btn btn-sm btn-white"><span th:text="#{common.btn.list}"></span></button>
                                    <button type="button" id="btnSave" class="btn btn-sm btn-primary"><span th:text="#{common.btn.save}"></span></button>
                                    <button type="button" id="btnDelete" class="btn btn-sm btn-danger" style="display:none;"><span th:text="#{common.btn.delete}"></span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 충전기 상세 모달 -->
<div class="modal inmodal fade" id="Popup_Station" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{batteryswap.station.popup.title}"></span></h4>
            </div>
            <div class="modal-body">
                <fieldset>
                    <legend style="font-size:13px;" th:text="#{batteryswap.station.legend.ident}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:20%;"><span th:text="#{batteryswap.point.label.cp.id}"></span> *</th>
                            <td style="width:30%;"><input type="text" id="st_cpId" class="form-control input-sm" readonly></td>
                            <th style="width:20%;"><span th:text="#{batteryswap.station.label.cs.id}"></span> *</th>
                            <td style="width:30%;"><input type="text" id="st_csId" class="form-control input-sm" maxlength="2"></td>
                        </tr>
                    </table>
                </fieldset>
                <fieldset style="margin-top:10px;">
                    <legend style="font-size:13px;" th:text="#{batteryswap.station.legend.operation}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:20%;"><span th:text="#{batteryswap.station.label.enabled}"></span></th>
                            <td style="width:30%;">
                                <label><input type="radio" name="st_enabled" value="Y" checked> Y</label>
                                &nbsp;&nbsp;
                                <label><input type="radio" name="st_enabled" value="N"> N</label>
                            </td>
                            <th style="width:20%;"><span th:text="#{batteryswap.station.label.oper.status}"></span></th>
                            <td style="width:30%;">
                                <select id="st_operationalStatus" class="form-control input-sm"></select>
                            </td>
                        </tr>
                        <tr>
                            <th><span th:text="#{batteryswap.station.label.total.slot}"></span></th>
                            <td><input type="number" id="st_totalSlotCount" class="form-control input-sm" min="0" value="0"></td>
                            <th><span th:text="#{batteryswap.station.label.reserved.slot}"></span></th>
                            <td><input type="number" id="st_reservedSlotCount" class="form-control input-sm" min="0" value="0"></td>
                        </tr>
                    </table>
                </fieldset>
                <fieldset style="margin-top:10px;">
                    <legend style="font-size:13px;" th:text="#{batteryswap.station.legend.policy}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:20%;"><span th:text="#{batteryswap.station.label.battery.model}"></span></th>
                            <td colspan="3"><input type="text" id="st_supportedBatteryModel" class="form-control input-sm" maxlength="60"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{batteryswap.station.label.min.soh}"></span></th>
                            <td><input type="number" id="st_minSoHThreshold" class="form-control input-sm" min="0" max="100" step="0.01"></td>
                            <th><span th:text="#{batteryswap.station.label.min.soc}"></span></th>
                            <td><input type="number" id="st_minSoCForDispatch" class="form-control input-sm" min="0" max="100" step="0.01"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{batteryswap.station.label.swap.timeout}"></span></th>
                            <td colspan="3"><input type="number" id="st_swapTimeoutSec" class="form-control input-sm" min="1" value="600"></td>
                        </tr>
                    </table>
                </fieldset>
                <fieldset style="margin-top:10px;">
                    <legend style="font-size:13px;" th:text="#{batteryswap.station.legend.ocpp}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:20%;"><span th:text="#{batteryswap.station.label.id.token}"></span></th>
                            <td colspan="3"><input type="text" id="st_defaultIdToken" class="form-control input-sm" maxlength="255"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{batteryswap.station.label.id.token.type}"></span></th>
                            <td colspan="3"><input type="text" id="st_defaultIdTokenType" class="form-control input-sm" maxlength="20" placeholder="Central, ISO14443, ..."></td>
                        </tr>
                    </table>
                </fieldset>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnStationSave"><span th:text="#{common.btn.save}"></span></button>
                <button type="button" class="btn btn-danger" id="btnStationDelete" style="display:none;"><span th:text="#{common.btn.delete}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    jQuery(document).ready(function () {
        batterySwapPointJs.init(_cpId);
    });
</script>
</body>
</html>
