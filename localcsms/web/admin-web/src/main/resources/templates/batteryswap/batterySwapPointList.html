<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    pointMgmt:        /*[[#{js.batteryswap.point.mgmt}]]*/ '',
    operatingAll:     /*[[#{js.batteryswap.point.operating.all}]]*/ '',
    operating:        /*[[#{js.batteryswap.point.operating}]]*/ '',
    closed:           /*[[#{js.batteryswap.point.closed}]]*/ '',
    confirmDelete:    /*[[#{js.batteryswap.point.confirm.delete}]]*/ '',
    successDelete:    /*[[#{js.batteryswap.point.success.delete}]]*/ '',
    failDelete:       /*[[#{js.batteryswap.point.fail.delete}]]*/ '',
    confirm:          /*[[#{common.btn.confirm}]]*/ '',
    cancel:           /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/batteryswap/batterySwapPointList.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{batteryswap.point.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" style="width:30%" id="operatingYn"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:25%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="CP_NAME" selected><span th:text="#{batteryswap.point.label.cp.name}"></span></option>
                                                <option value="CP_ID"><span th:text="#{batteryswap.point.label.cp.id}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnCreate" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span th:text="#{batteryswap.point.btn.create}"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.id}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.name}"></th>
                                                <th th:text="#{batteryswap.point.label.station.count}"></th>
                                                <th th:text="#{batteryswap.point.label.address}"></th>
                                                <th th:text="#{batteryswap.point.label.coord}"></th>
                                                <th th:text="#{batteryswap.point.label.opened.from}"></th>
                                                <th th:text="#{batteryswap.point.label.status}"></th>
                                                <th th:text="#{batteryswap.point.label.action}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        batterySwapPointListJs.init();
    });
</script>
</body>
</html>
