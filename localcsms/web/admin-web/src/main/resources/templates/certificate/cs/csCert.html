<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/js/certificate/csCert.js(v=20240101002)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">

            <!-- List Section -->
            <div id="listSection">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span th:text="#{cert.cs.list.title}"></span></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-12 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;" th:text="#{cert.cs.label.csId}"></span>
                                            <input type="text" id="csId" class="form-control input-sm" style="max-width:180px;" th:placeholder="#{cert.cs.label.csId}">
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;" th:text="#{common.label.status}"></span>
                                            <select id="certStatus" class="form-control input-sm" style="max-width:140px;">
                                                <option value="" th:text="#{common.label.all}"></option>
                                                <option value="CAST01" th:text="#{cert.cs.status.installed}"></option>
                                                <option value="CAST02" th:text="#{cert.cs.status.expired}"></option>
                                                <option value="CAST03" th:text="#{cert.cs.status.revoked}"></option>
                                            </select>
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;" th:text="#{cert.cs.label.caType}"></span>
                                            <select id="caType" class="form-control input-sm" style="max-width:140px;">
                                                <option value="" th:text="#{common.label.all}"></option>
                                                <option value="R">ROOT</option>
                                                <option value="S">SubCA</option>
                                            </select>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x: auto;">
                                            <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                   style="white-space:nowrap; text-align:center;">
                                                <thead>
                                                <tr>
                                                    <th><span th:text="#{common.label.no}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.csId}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.commonName}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.caType}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.certStatus}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.expiredDate}"></span></th>
                                                    <th><span th:text="#{cert.cs.label.regDate}"></span></th>
                                                </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot></tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl"></ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Detail Section (hidden by default) -->
            <div id="detailSection" style="display:none;">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span th:text="#{cert.cs.detail.title}"></span></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped">
                                        <tbody>
                                        <colgroup>
                                            <col width="15%">
                                            <col width="35%">
                                            <col width="15%">
                                            <col width="35%">
                                        </colgroup>
                                        <tr>
                                            <th th:text="#{cert.cs.label.certId}"></th>
                                            <td id="detail_certId"></td>
                                            <th th:text="#{cert.cs.label.csId}"></th>
                                            <td id="detail_csId"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{cert.cs.label.commonName}"></th>
                                            <td id="detail_commonName"></td>
                                            <th th:text="#{cert.cs.label.caType}"></th>
                                            <td id="detail_caType"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{cert.cs.label.certStatus}"></th>
                                            <td id="detail_certStatus"></td>
                                            <th th:text="#{cert.cs.label.expiredDate}"></th>
                                            <td id="detail_expiredDate"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{cert.cs.label.fileLocation}"></th>
                                            <td colspan="3" id="detail_fileLocation"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{cert.cs.label.regDate}"></th>
                                            <td id="detail_regDate"></td>
                                            <th th:text="#{cert.cs.label.updDate}"></th>
                                            <td id="detail_updDate"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                    <div class="ibox-content">
                                        <button class="btn btn-white pull-right" id="btnBackToList"><span th:text="#{common.btn.list}"></span></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        csCertJs.init();
    });
</script>
</body>
</html>
