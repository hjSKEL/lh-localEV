<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/js/charger/cert/csCert.js(v=20240101002)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">

            <!-- List Section -->
            <div id="listSection">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span>충전소 인증서 목록</span></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-12 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;">충전소 ID</span>
                                            <input type="text" id="csId" class="form-control input-sm" style="max-width:180px;" placeholder="충전소 ID">
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;">상태</span>
                                            <select id="certStatus" class="form-control input-sm" style="max-width:140px;">
                                                <option value="">전체</option>
                                                <option value="CAST01">설치</option>
                                                <option value="CAST02">만료</option>
                                                <option value="CAST03">폐기</option>
                                            </select>
                                            <span class="input-group-addon" style="width:auto; padding:6px 10px;">CA 유형</span>
                                            <select id="caType" class="form-control input-sm" style="max-width:140px;">
                                                <option value="">전체</option>
                                                <option value="R">ROOT</option>
                                                <option value="S">SubCA</option>
                                            </select>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span>검색</span></button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span>초기화</span></button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x: auto;">
                                            <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                   style="white-space:nowrap; text-align:center;">
                                                <thead>
                                                <tr>
                                                    <th><span>번호</span></th>
                                                    <th><span>충전소 ID</span></th>
                                                    <th><span>Common Name</span></th>
                                                    <th><span>CA 유형</span></th>
                                                    <th><span>인증서 상태</span></th>
                                                    <th><span>만료일시</span></th>
                                                    <th><span>등록일시</span></th>
                                                </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot></tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl"></ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Detail Section (hidden by default) -->
            <div id="detailSection" style="display:none;">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span>충전소 인증서 상세</span></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped">
                                        <tbody>
                                        <colgroup>
                                            <col width="15%">
                                            <col width="35%">
                                            <col width="15%">
                                            <col width="35%">
                                        </colgroup>
                                        <tr>
                                            <th>인증서 ID</th>
                                            <td id="detail_certId"></td>
                                            <th>충전소 ID</th>
                                            <td id="detail_csId"></td>
                                        </tr>
                                        <tr>
                                            <th>Common Name</th>
                                            <td id="detail_commonName"></td>
                                            <th>CA 유형</th>
                                            <td id="detail_caType"></td>
                                        </tr>
                                        <tr>
                                            <th>인증서 상태</th>
                                            <td id="detail_certStatus"></td>
                                            <th>만료일시</th>
                                            <td id="detail_expiredDate"></td>
                                        </tr>
                                        <tr>
                                            <th>파일 경로</th>
                                            <td colspan="3" id="detail_fileLocation"></td>
                                        </tr>
                                        <tr>
                                            <th>등록일시</th>
                                            <td id="detail_regDate"></td>
                                            <th>수정일시</th>
                                            <td id="detail_updDate"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                    <div class="ibox-content">
                                        <button class="btn btn-white pull-right" id="btnBackToList"><span>목록</span></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        csCertJs.init();
    });
</script>
</body>
</html>
