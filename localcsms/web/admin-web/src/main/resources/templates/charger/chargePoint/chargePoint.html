<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script>
    var _msg = {
        title:                      '충전소관리',
        checkDuplicate:             '* 중복확인 필요',
        inputCpId6:                 '충전소ID 6자리를 입력해 주세요.',
        inputCpName:                '충전소명을 입력해 주세요.',
        inputCpLocation:            '충전소 위치를 입력해 주세요.',
        checkDuplicateFirst:        '충전소ID 중복확인을 해주세요.',
        confirmChange:              '변경하시겠습니까?',
        confirmDeleteWithChargers:  '충전소와 충전기를 삭제하시겠습니까?',
        checkingRemainingChargers:  '충전기 잔여 여부를 확인 중입니다.',
        btnConfirm:                 '확인',
        btnModify:                  '수정',
        btnDelete:                  '삭제',
        btnCancel:                  '취소',
        cpIdAvailable:              '사용 가능한 충전소ID 입니다.',
        cpIdAvailableLabel:         '* 사용가능',
        cpIdAlreadyExists:          '* 이미 등록된 ID',
        cpIdDuplicate:              '이미 등록된 충전소ID 입니다.',
        cpIdNoLeadingZero:          '충전소ID는 0으로 시작할 수 없습니다.'
    };
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/chargePoint/chargePoint.js(v=20230801001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <th:block th:if="${cpId == null or cpId == ''}">
                                <h5>충전소 등록</h5>
                            </th:block>
                            <th:block th:unless="${cpId == null or cpId == ''}">
                                <h5>충전소 상세</h5>
                            </th:block>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
                                    <tr>
                                        <th><span>충전소명</span><span style="color:red;">*</span></th>
                                        <td><input type="text" id="cpName" maxlength="60" class="form-control"></td>
                                        <th><span>충전소ID</span><span style="color:red;">*</span></th>
                                        <td>
                                            <div class="input-group" style="display:flex;">
                                                <input type="text" id="cpId" style="width:150px;" maxlength="6" placeholder="ex)111111" class="form-control"
                                                       th:readonly="${cpId != null and cpId != ''}" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');"/>
                                                <button type="button" id="btnCpIdChecker" class="btn btn-primary"
                                                        th:style="${cpId == null or cpId == ''} ? '' : 'display:none;'">중복체크</button>
                                                <label id="cpIdCheckLabel" class="col-sm-2 control-label"
                                                       style="width:100%; margin-top: 8px;"></label>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>급속 충전기 수</th>
                                        <td>
                                            <input type="number" id="highCsCount" value="0" class="form-control" readOnly>
                                        </td>
                                        <th>완속 충전기 수</th>
                                        <td>
                                            <input type="number" id="lowCsCount" value="0" class="form-control" readOnly>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span>충전소 위치</span><span style="color:red;">*</span></th>
                                        <td colspan="3"><input type="text" id="cpLocation" maxlength="200" placeholder="ex)지하차2층B13기둥" class="form-control"></td>
                                    </tr>
                                    <tr>
                                        <th>전력량</th>
                                        <td>
                                            <input type="number" id="electSupplyCapability" value="0" class="form-control" readOnly>
                                        </td>
                                        <th>사용 여부</th>
                                        <td>
                                            <select id="cpUseYn" class="form-control">
                                                <option value="Y">사용</option>
                                                <option value="N">미사용</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>메모</th>
                                        <td colspan="3">
                                            <textarea class="form-control" placeholder="300자 이내로 입력해 주세요" maxlength="300"
                                                      rows="6" id="memo" style="resize: none"></textarea>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="ibox-content">
                                    <button class="btn btn-white pull-right" id="btnList">목록</button>
                                    <th:block th:if="${cpId == null or cpId == ''}">
                                        <button id="btnRegister" class="btn btn-success pull-right">등록</button>
                                    </th:block>
                                    <th:block th:unless="${cpId == null or cpId == ''}">
                                        <button id="btnUpdate" class="btn btn-warning pull-right">수정</button>
                                    </th:block>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    var cpId = /*[[${cpId != null && cpId != '' ? cpId : 'null'}]]*/ null;
    jQuery(document).ready(function () {
        //
        chargePointJs.init();
    });
</script>
</body>
</html>
