<script>

</script>
<script type="text/javascript" th:src="@{/resources/js/charger/chargePoint/chargePointList.js(v=20230802001)}"></script>
<div id="wrapper">

            <div class="row">

                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
