<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/typehead/bootstrap3-typeahead.min.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
    var _msg = {
        title:              /*[[#{js.chargingStation.title}]]*/              '',
        selectProduct:      /*[[#{js.chargingStation.select.product}]]*/     '',
        selectCsKindType:   /*[[#{js.chargingStation.select.csKindType}]]*/  '',
        selectMaker:        /*[[#{js.chargingStation.select.maker}]]*/       '',
        selectConnector:    /*[[#{js.chargingStation.select.connector}]]*/   '',
        selectChargePoint:  /*[[#{js.chargingStation.select.chargePoint}]]*/ '',
        inputCsId:          /*[[#{js.chargingStation.input.csId}]]*/         '',
        selectUseYn:        /*[[#{js.chargingStation.select.useYn}]]*/       '',
        selectCapacity:     /*[[#{js.chargingStation.select.capacity}]]*/    '',
        yearNoNegative:     /*[[#{js.chargingStation.year.noNegative}]]*/    '',
        yearMustBe2000s:    /*[[#{js.chargingStation.year.mustBe2000s}]]*/   '',
        selectMonth:        /*[[#{js.chargingStation.select.month}]]*/       '',
        inputPassword:      /*[[#{js.chargingStation.input.password}]]*/     '',
        confirmChange:      /*[[#{js.confirm.change}]]*/                     '',
        confirmDelete:      /*[[#{js.confirm.delete}]]*/                     '',
        btnModify:          /*[[#{js.btn.modify}]]*/                         '',
        btnDelete:          /*[[#{js.btn.delete}]]*/                         '',
        btnCancel:          /*[[#{js.btn.cancel}]]*/                         '',
        btnConfirm:         /*[[#{js.btn.confirm}]]*/                        '',
        cannotDeleteInUse:  /*[[#{js.chargingStation.cannotDelete.inUse}]]*/ '',
        deleteComplete:     /*[[#{js.chargingStation.delete.complete}]]*/    '',
        menuBreakdown:      /*[[#{js.menu.breakdown}]]*/                     ''
    };
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/chargingStation/chargingStation.js(v=20230803003)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <th:block th:if="${csId == null or csId == ''}">
                                <h5 th:text="#{charger.station.register.title}"></h5>
                            </th:block>
                            <th:block th:unless="${csId == null or csId == ''}">
                                <h5 th:text="#{charger.station.detail.title}"></h5>
                            </th:block>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
                                    <tr>
                                        <th><span th:text="#{charger.station.id.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <th:block th:if="${csId == null or csId == ''}">
                                                <div class="input-group">
                                                    <span class="input-group-addon">
                                                        <input type="text" th:placeholder="#{charger.station.id.autoGenerate}" id="csId" class="form-control" readOnly>
                                                    </span>
                                                </div>
                                            </th:block>
                                            <th:block th:unless="${csId == null or csId == ''}">
                                                <input type="text" class="form-control" id="cpCsId" readonly>
                                                <input type="hidden" id="csUniqId">
                                                <input type="hidden" id="csId">
                                            </th:block>
                                        </td>
                                        <th><span th:text="#{charger.station.id}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <input type="hidden" id="cpId"/>
                                            <div class="input-group">
                                                <th:block th:if="${csId == null or csId == ''}">
                                                    <input type="text" id="cpName" class="form-control">
                                                    <span class="input-group-btn">
                                                        <button type="button" id="btnSearchChargePoint" class="btn btn-primary" th:text="#{charger.point.search.btn}"></button>
                                                    </span>
                                                </th:block>
                                                <th:block th:unless="${csId == null or csId == ''}">
                                                    <input type="text" id="cpName" class="form-control" disabled>
                                                </th:block>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{common.label.manufacturer}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="makerType" class="form-control"></select>
                                        </td>
                                        <th><span th:text="#{charger.station.charger.type.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="csKindType" class="form-control"></select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.station.charger.capacity}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="electronicSupplyCapability" class="form-control">
                                                <option selected value="0" th:text="#{charger.station.capacity.select}"></option>
                                                <option value="3">3</option>
                                                <option value="7">7</option>
                                                <option value="11">11</option>
                                                <option value="14">14</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                                <option value="200">200</option>
                                                <option value="250">250</option>
                                                <option value="400">400</option>
                                            </select>
                                        </td>
                                        <th><span th:text="#{charger.station.priceType.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="prodType" class="form-control">
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.station.channel.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <div class="input-group">
                                                <th:block th:if="${csId == null or csId == ''}">
                                                    <select id="csChanelCount" class="form-control">
                                                        <option value="1" selected>1</option>
                                                        <option value="2">2</option>
                                                        <option value="3">3</option>
                                                        <option value="4">4</option>
                                                        <option value="5">5</option>
                                                    </select>
                                                </th:block>
                                                <th:block th:unless="${csId == null or csId == ''}">
                                                    <select id="csChanelCount" class="form-control" disabled>
                                                        <option value="1">1</option>
                                                        <option value="2">2</option>
                                                        <option value="3">3</option>
                                                        <option value="4">4</option>
                                                        <option value="5">5</option>
                                                    </select>
                                                </th:block>
                                            </div>
                                        </td>
                                        <th>Password<span style="color:red;">*</span></th>
                                        <td><input type="text" class="form-control" maxlength="16" id="csPassword" value="A123456789012345" /></td>
                                    </tr>
                                    <tr th:unless="${csId == null or csId == ''}">
                                        <th>Last Password</th>
                                        <td><input type="text" class="form-control" id="lastCsPassword" readonly /></td>
                                        <th></th>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.station.connector.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="csCatCode" class="form-control"></select>
                                        </td>
                                        <th><span th:text="#{charger.station.useYn.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="useYn" class="form-control">
                                                <option value="" th:text="#{charger.station.useYn.select}"></option>
                                                <option value="Y">Y</option>
                                                <option value="N">N</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th th:text="#{charger.station.installCompany.label}"></th>
                                        <td>
                                            <input type="text" maxlength="50" class="form-control" id="csInstallCo"/>
                                        </td>
                                        <th><span th:text="#{charger.station.installDate}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <div class="input-group">
                                                <span class="input-group-addon">
                                                    <input type="text" class="form-control" id="year" maxLength="4"/>
                                                </span>
                                                <span class="input-group-addon" style="text-align: left;">
                                                    <select id="month" class="form-control">
                                                        <option value="00" th:text="#{charger.station.installMonth.select}"></option>
                                                        <option value="01" th:text="#{charger.station.month.jan}"></option>
                                                        <option value="02" th:text="#{charger.station.month.feb}"></option>
                                                        <option value="03" th:text="#{charger.station.month.mar}"></option>
                                                        <option value="04" th:text="#{charger.station.month.apr}"></option>
                                                        <option value="05" th:text="#{charger.station.month.may}"></option>
                                                        <option value="06" th:text="#{charger.station.month.jun}"></option>
                                                        <option value="07" th:text="#{charger.station.month.jul}"></option>
                                                        <option value="08" th:text="#{charger.station.month.aug}"></option>
                                                        <option value="09" th:text="#{charger.station.month.sep}"></option>
                                                        <option value="10" th:text="#{charger.station.month.oct}"></option>
                                                        <option value="11" th:text="#{charger.station.month.nov}"></option>
                                                        <option value="12" th:text="#{charger.station.month.dec}"></option>
                                                    </select>
                                                </span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.station.protocol.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="ocppVersion" class="form-control">
                                                <option value="ocpp1.6" selected>OCPP_1.6</option>
                                                <option value="ocpp2.0.1">OCPP_2.0.1</option>
                                            </select>
                                        </td>
                                        <th th:text="#{charger.status.breakdown}"></th>
                                        <td>
                                            <select id="brkdownYn" class="form-control">
                                                <option value="N" selected>N</option>
                                                <option value="Y">Y</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.station.v2xType.label}"></span><span style="color:red;">*</span></th>
                                        <td>
                                            <select id="v2xType" class="form-control"></select>
                                        </td>
                                        <th></th>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th th:text="#{charger.station.fw.version}"></th>
                                        <td id="fwVer"></td>
                                        <th th:text="#{charger.station.model.name}"></th>
                                        <td id="modelName"></td>
                                    </tr>
                                    <tr>
                                        <th th:text="#{charger.station.serial.number}"></th>
                                        <td id="serialNumber"></td>
                                        <th th:text="#{charger.station.lastBoot.date}"></th>
                                        <td id="lastBootDate"></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="ibox-content">
                                    <button class="btn btn-white pull-right" id="btnList" th:text="#{common.btn.list}"></button>
                                    <th:block th:if="${csId == null or csId == ''}">
                                        <button id="btnRegister" class="btn btn-success pull-right" th:text="#{common.btn.register}"></button>
                                    </th:block>
                                    <th:block th:unless="${csId == null or csId == ''}">
                                        <button id="btnUpdate" class="btn btn-warning pull-right" th:text="#{common.btn.edit}"></button>
                                        <button id="btnDelete" class="btn btn-danger pull-right" th:text="#{common.btn.delete}"></button>
                                    </th:block>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <th:block th:unless="${csId == null or csId == ''}">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5 th:text="#{charger.status.breakdown.history}"></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-6" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                    <div class="col-sm-6" style="text-align: right;">
                                        <button class="btn btn-white pull-right" id="btnBreakdownList" style="display:none;" th:text="#{common.btn.more}"></button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{charger.breakdown.id}"></th>
                                                <th th:text="#{charger.status.info.chargerId}"></th>
                                                <th th:text="#{charger.status.breakdown.receiptDate}"></th>
                                                <th th:text="#{charger.status.breakdown.receiptTime}"></th>
                                                <th th:text="#{charger.status.breakdown.actionDate}"></th>
                                                <th th:text="#{charger.status.breakdown.actionTime}"></th>
                                                <th th:text="#{charger.status.breakdown.status}"></th>
                                                <th th:text="#{common.label.registration.date}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList">
                                            </tbody>
                                            <tfoot>
                                            </tfoot>
                                        </table>
                                        <div class="dataTables_paginate paging_simple_numbers"
                                             id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl">
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</div>
<!-- chargePointSearch popup include -->
<div th:replace="~{common/popup/chargePointSearch :: chargePointSearch}"></div>
</body>
<script type="text/javascript">
    var cpId = "[[${cpId != null ? cpId : ''}]]";
    var csId = "[[${csId != null ? csId : ''}]]";
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        chargingStationJs.init();
    });
</script>
</html>
