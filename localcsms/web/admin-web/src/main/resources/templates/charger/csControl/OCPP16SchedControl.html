<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
    var _msg = {
        title:              /*[[#{js.chargerControl.title}]]*/              '',
        csIdLength8:        /*[[#{js.csId.length8}]]*/                      '',
        csIdLabel:          /*[[#{js.csId.label}]]*/                        '',
        chargerNotFound:    /*[[#{js.charger.notFound}]]*/                  '',
        confirmSendCommand: /*[[#{js.chargerControl.confirmSendCommand}]]*/ '',
        btnConfirm:         /*[[#{js.btn.confirm}]]*/                       '',
        btnCancel:          /*[[#{js.btn.cancel}]]*/                        ''
    };
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/csControl/ocpp16SchedControl.js(v=20230808001)}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/ocpp/ocpp16Command.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.title}"></span></h5>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
		    							<span class="input-group-btn" style="width:20%">
											<select class="input-sm form-control input-s-sm inline" id="searchType" name="sType">
												<option value="CHAID"><span th:text="#{charger.control.chargerId}"></span></option>
											</select>
										</span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
	                                        <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
	                                    </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
                                    <tr>
                                        <th><span th:text="#{charger.control.point}"></span></th>
                                        <td id="cpNametr"></td>
                                        <th><span th:text="#{charger.control.chargerId}"></span></th>
                                        <td id="csUniqIdtr"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.control.maker}"></span></th>
                                        <td>
                                            <select name="makerType" id="makerType" class="form-control input-sm" disabled></select>
                                        </td>
                                        <th><span th:text="#{charger.control.protocol}"></span></th>
                                        <td>
                                            <input type="text" class="form-control input-sm" value="ocpp1.6" name="protocolType" id="protocolType" readonly/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.control.fwVersion}"></span></th>
                                        <td>
                                            <input type="text" class="form-control input-sm" name="fmwVer" id="fmwVer" readonly/>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.timeSettings.title}"></span></h5>
                            <div class="ibox-tools">
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-4 m-b-xs">
                                    <div class="input-group">
		    								<span class="input-group-addon" style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{charger.control.duration.label}"></span></span>
		    								<span class="input-group-btn" style="width:20%">
												<select class="input-sm form-control input-s-sm inline" id="drDuration" name="sType">
												<option value="10" selected><span th:text="#{charger.control.duration.10sec}"></span></option>
												<option value="30"><span th:text="#{charger.control.duration.30sec}"></span></option>
												<option value="60"><span th:text="#{charger.control.duration.60sec}"></span></option>
												</select>
											</span>
                                    </div>
                                </div>
                                <div class="col-sm-4 m-b-xs">
                                    <div class="input-group">
		    								<span class="input-group-addon" style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{charger.control.capacity.label}"></span></span>
		    								<span class="input-group-btn" style="width:20%">
												<select class="input-sm form-control input-s-sm inline" id="limitKW" name="sType">
												<option value="2" selected><span th:text="#{charger.control.capacity.2kw}"></span></option>
												<option value="3"><span th:text="#{charger.control.capacity.3kw}"></span></option>
												<option value="4"><span th:text="#{charger.control.capacity.4kw}"></span></option>
												<option value="5"><span th:text="#{charger.control.capacity.5kw}"></span></option>
												<option value="6"><span th:text="#{charger.control.capacity.6kw}"></span></option>
												</select>
											</span>
                                    </div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="input-group">
											<span class="input-group-btn">
	                                        	<button type="button" id="btnCommand" class="btn btn-sm btn-primary"
                                                        style="background-color:#FF4D27"><span th:text="#{charger.control.execute.btn}"></span></button>
	                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.history.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"> <i class="fa fa-chevron-up"></i></a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#"></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x: auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space: nowrap; text-align: center;" id="KEVITLog">
                                            <thead>
                                            <tr>
                                                <th><span th:text="#{common.label.no}"></span></th>
                                                <th><span th:text="#{charger.control.history.startTime}"></span></th>
                                                <th><span th:text="#{charger.control.history.endTime}"></span></th>
                                                <th><span th:text="#{charger.control.history.duration}"></span></th>
                                                <th><span th:text="#{charger.control.history.power}"></span></th>
                                            </tr>
                                            </thead>
                                            <tbody id="KEVITtBodyList">
                                            <tr style="text-align:center;">
                                                <td colspan="5"><span th:text="#{charger.control.history.searchHint}"></span></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        ocpp16ControlJs.init();
    });
</script>
</html>
