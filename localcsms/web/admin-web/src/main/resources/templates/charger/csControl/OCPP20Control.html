<!DOCTYPE html>

        chargerNotFound:    /*[[#{js.charger.notFound}]]*/                  '',
        inputTransactionId: /*[[#{js.ocpp20.input.transactionId}]]*/        '',

        confirmSendCommand: /*[[#{js.chargerControl.confirmSendCommand}]]*/ '',
        btnConfirm:         /*[[#{js.btn.confirm}]]*/                       '',
        btnCancel:          /*[[#{js.btn.cancel}]]*/                        ''

<script type="text/javascript" th:src="@{/resources/js/charger/csControl/ocpp20Control.js(v=20230808001)}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/ocpp/ocpp20Command.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.title}"></span></h5>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
		    							<span class="input-group-btn" style="width:20%">
											<select class="input-sm form-control input-s-sm inline" id="searchType" name="sType">
												<option value="CHAID"><span th:text="#{charger.control.chargerId}"></span></option>
											</select>
										</span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
	                                        <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
	                                    </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
                                    <tr>
                                        <th><span th:text="#{charger.control.point}"></span></th>
                                        <td id="cpNametr"></td>
                                        <th><span th:text="#{charger.control.chargerId}"></span></th>
                                        <td id="csUniqIdtr"></td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.control.maker}"></span></th>
                                        <td>
                                            <select name="makerType" id="makerType" class="form-control input-sm" disabled></select>
                                        </td>
                                        <th><span th:text="#{charger.control.protocol}"></span></th>
                                        <td>
                                            <input type="text" class="form-control input-sm" value="ocpp1.6" name="protocolType" id="protocolType" readonly/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{charger.control.fwVersion}"></span></th>
                                        <td>
                                            <input type="text" class="form-control input-sm" name="fmwVer" id="fmwVer" readonly/>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.ocpp20.commands}"></span></h5>
                            <div class="ibox-tools">
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
		    								<span class="input-group-btn" style="width:20%">
												<select class="input-sm form-control input-s-sm inline"
                                                        id="ocppCommandType" name="sType"></select>
											</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
											<span class="input-group-btn">
	                                        	<button type="button" id="btnCommand" class="btn btn-sm btn-primary"
                                                        style="background-color:#FF4D27"><span th:text="#{charger.control.execute.btn}"></span></button>
	                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-content" id="Reset" name="OCPPCommand">
	                         <div class="table-responsive">
	                         	<table class="table table-bordered table-striped">
	                            	<tbody>
	                              	  <colgroup>
							                <col width="15%">
							                <col width="35%">
							                <col width="15%">
							                <col width="35%">
						              </colgroup>
	                                  <tr>
	                                  	<th><span th:text="#{charger.control.reset.label}"></span></th>
	                                  	<td colspan="3">
			                             	<div class="input-group">
				    							<span class="input-group-btn" style="width:20%">
													<select class="input-sm form-control input-s-sm inline" id="ResetValue1">
														<option value="Immediate" selected><span th:text="#{charger.control.reset.immediate}"></span></option>
														<option value="OnIdle"><span th:text="#{charger.control.reset.onIdle}"></span></option>
													</select>
												</span>
			                                </div>
	                                  	</td>
	                                  </tr>
                              		</tbody>
                              	</table>
	                         </div>
	                    </div>
                        <div class="ibox-content" id="RequestStartTransaction" name="OCPPCommand" style="display:none;">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
	                                  <tr>
	                                  	<th><span th:text="#{charger.control.remoteStart.connectorNumber}"></span></th>
	                                  	<td><input type="number" min="1" class="form-control input-sm" value="1" id="RequestStartTransactionValue1" maxLength="20"/></td>
	                                  	<th><span th:text="#{charger.control.remoteStart.cardNumber}"></span></th>
	                                  	<td><input type="text" class="form-control input-sm" value="" id="RequestStartTransactionValue3" maxLength="20"/></td>
	                                  </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="ibox-content" id="RequestStopTransaction" name="OCPPCommand" style="display:none;">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="30%">
                                        <col width="70%">
                                    </colgroup>
                                    <tr>
                                        <th><span th:text="#{charger.control.remoteStop.chargingId}"></span></th>
                                        <td><input type="text" class="form-control input-sm" value="0" id="RequestStopTransactionValue"/></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.control.history.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"> <i class="fa fa-chevron-up"></i></a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#"></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon" style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{charger.status.log.queryDate}"></span></span>
                                        <div class="input-daterange input-group" id="datepicker">
                                            <input type="text" class="input-sm form-control" id="date1" style="max-width: 150px;" readonly>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div style="display: flex; float: right;">
                                        <span class="input-group-addon"
                                              style="border: 0;padding-left: 0;font-weight: 700;width: 70px;"><span th:text="#{common.label.content.count}"></span></span>
                                        <span class="input-group-btn" style="width: 70px;">
											<select class="input-sm form-control input-s-sm inline" id="pagingNum"
                                                    name="pagingNum">
												<option value="20" selected>20</option>
												<option value="30">30</option>
												<option value="40">40</option>
											</select>
										</span>
                                        <select class="input-sm form-control input-s-sm inline" id="csCableChn" style="width: 80px;">
                                            <option value="0"><span th:text="#{common.label.all}"></span></option>
                                            <option value="1"><span th:text="#{charger.status.log.channel.ch1}"></span></option>
                                            <option value="2"><span th:text="#{charger.status.log.channel.ch2}"></span></option>
                                        </select>
                                        <button type="button" id="btnLogSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x: auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space: nowrap; text-align: center;" id="KEVITLog">
                                            <thead>
                                            <tr>
                                                <th><span th:text="#{common.label.no}"></span></th>
                                                <th><span th:text="#{charger.status.log.serverCollectionTime}"></span></th>
                                                <th><span th:text="#{charger.status.log.terminalCollectionTime}"></span></th>
                                                <th><span th:text="#{charger.status.log.chargingNumber}"></span></th>
                                                <th><span th:text="#{charger.status.log.chargerId}"></span></th>
                                                <th><span th:text="#{charger.status.log.channel}"></span></th>
                                                <th><span th:text="#{charger.status.log.chargerStatus}"></span></th>
                                                <th><span th:text="#{charger.status.log.cableStatus}"></span></th>
                                                <th><span th:text="#{charger.status.log.abnormalStatus}"></span></th>
                                                <th><span th:text="#{charger.status.log.usedPower}"></span></th>
                                                <th><span th:text="#{charger.status.log.meterPower}"></span></th>
                                                <th><span th:text="#{charger.status.log.instantPower}"></span></th>
                                                <th><span th:text="#{charger.status.log.instantAmount}"></span></th>
                                                <th><span th:text="#{charger.status.log.totalAmount}"></span></th>
                                                <th><span th:text="#{charger.status.log.startTime}"></span></th>
                                                <th><span th:text="#{charger.status.log.lastTime}"></span></th>
                                                <th><span th:text="#{charger.status.log.eventCode}"></span></th>
                                                <th><span th:text="#{charger.status.log.tagCardNumber}"></span></th>
                                            </tr>
                                            </thead>
                                            <tbody id="KEVITtBodyList">
                                            <tr style="text-align:center;">
                                                <td colspan="18"><span th:text="#{charger.control.history.searchHint}"></span></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
