<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script th:inline="javascript">
var _msg = {
    confirmDeleteWithTokens: /*[[#{js.localCust.confirmDeleteWithTokens}]]*/ '',
    dataNotFound: /*[[#{js.localCust.dataNotFound}]]*/ '',
    noTokenData: /*[[#{js.localCust.noTokens}]]*/ '',
    inputTokenValue: /*[[#{js.localCust.enterToken}]]*/ '',
    tokenAdded: /*[[#{js.localCust.tokenAdded}]]*/ '',
    tokenAddFail: /*[[#{js.localCust.tokenAddFailed}]]*/ '',
    confirmDeleteToken: /*[[#{js.localCust.confirmDeleteToken}]]*/ '',
    tokenDeleted: /*[[#{js.localCust.tokenDeleted}]]*/ '',
    tokenDeleteFail: /*[[#{js.localCust.tokenDeleteFailed}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/localCustomer/localCustomerDetail.js(v=20260323001)}"></script>
<input type="hidden" id="paramCpId" th:value="${cpId}"/>
<input type="hidden" id="paramCsId" th:value="${csId}"/>

<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">

                    <!-- 헤더 정보 -->
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.localAuth.detail.headerInfo}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered" style="text-align:left;">
                                    <colgroup>
                                        <col style="width:15%">
                                        <col style="width:35%">
                                        <col style="width:15%">
                                        <col style="width:35%">
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th th:text="#{charger.localAuth.label.cpId}"></th>
                                            <td><span id="infoCpId" style="font-family:monospace;"></span></td>
                                            <th th:text="#{charger.localAuth.label.csId}"></th>
                                            <td><span id="infoCsId" style="font-family:monospace;"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{charger.localAuth.label.version}"></th>
                                            <td><span id="infoVersion"></span></td>
                                            <th th:text="#{charger.localAuth.label.updateType}"></th>
                                            <td><span id="infoUpdateType"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{charger.localAuth.label.lastSendDate}"></th>
                                            <td><span id="infoLastSendDate"></span></td>
                                            <th th:text="#{common.label.status}"></th>
                                            <td><span id="infoStatus"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{common.label.regDate}"></th>
                                            <td><span id="infoRegDate"></span></td>
                                            <th th:text="#{common.label.updDate}"></th>
                                            <td><span id="infoUpdDate"></span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div style="text-align:right;">
                                <button type="button" id="btnList" class="btn btn-white btn-sm"><span th:text="#{common.btn.list}"></span></button>
                                <button type="button" id="btnDelete" class="btn btn-danger btn-sm"><span th:text="#{common.btn.delete}"></span></button>
                            </div>
                        </div>
                    </div>

                    <!-- 토큰 목록 -->
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.localAuth.tokenList.title}"></span> <small id="tokenTotalCount" style="margin-left:8px; color:#999;"></small></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 토큰 추가 폼 -->
                            <div style="margin-bottom:10px; padding:10px; background:#f8f9fa; border:1px solid #e7eaec; border-radius:3px;">
                                <div class="row">
                                    <div class="col-sm-2">
                                        <input type="text" id="inputToken" class="form-control input-sm" th:placeholder="#{charger.localAuth.label.token}" maxlength="36">
                                    </div>
                                    <div class="col-sm-2">
                                        <select id="inputTokenType" class="form-control input-sm">
                                            <option value="ISO14443">ISO14443</option>
                                            <option value="eMAID">eMAID</option>
                                            <option value="EVCCID">EVCCID</option>
                                            <option value="Local">Local</option>
                                            <option value="MacAddress">MacAddress</option>
                                            <option value="NoAuthorization">NoAuthorization</option>
                                            <option value="Central">Central</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-2">
                                        <select id="inputTokenStatus" class="form-control input-sm">
                                            <option value="Accepted">Accepted</option>
                                            <option value="Blocked">Blocked</option>
                                            <option value="Expired">Expired</option>
                                            <option value="Invalid">Invalid</option>
                                            <option value="NoCredit">NoCredit</option>
                                            <option value="ConcurrentTx">ConcurrentTx</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="datetime-local" id="inputCacheExpireDate" class="form-control input-sm">
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="text" id="inputParentIdToken" class="form-control input-sm" th:placeholder="#{charger.localAuth.label.parentToken}" maxlength="36">
                                    </div>
                                    <div class="col-sm-2">
                                        <button type="button" id="btnAddToken" class="btn btn-sm btn-primary btn-block">
                                            <i class="fa fa-plus"></i> <span th:text="#{charger.localAuth.btn.addToken}"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="row" style="margin-top:4px;">
                                    <div class="col-sm-2 col-sm-offset-4">
                                        <select id="inputParentTokenType" class="form-control input-sm">
                                            <option value="">-- <span th:text="#{charger.localAuth.label.parentTokenType}"></span> --</option>
                                            <option value="ISO14443">ISO14443</option>
                                            <option value="eMAID">eMAID</option>
                                            <option value="EVCCID">EVCCID</option>
                                            <option value="Local">Local</option>
                                            <option value="MacAddress">MacAddress</option>
                                            <option value="NoAuthorization">NoAuthorization</option>
                                            <option value="Central">Central</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 토큰 테이블 -->
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover"
                                       style="white-space:nowrap; text-align:center;">
                                    <thead>
                                        <tr>
                                            <th><span th:text="#{common.label.no}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.token}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.tokenType}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.tokenStatus}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.cacheExpireDate}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.parentToken}"></span></th>
                                            <th><span th:text="#{charger.localAuth.label.parentTokenType}"></span></th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tBodyTokens"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    jQuery(document).ready(function () {
        localCustomerDetailJs.init();
    });
</script>
</body>
</html>
