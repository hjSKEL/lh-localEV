<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script>
var _msg = {
    confirmDeleteWithTokens: '삭제하시겠습니까? 토큰 목록도 함께 삭제됩니다.',
    dataNotFound: '데이터를 찾을 수 없습니다.',
    noTokenData: '토큰 정보가 없습니다.',
    inputTokenValue: '토큰값을 입력해주세요.',
    tokenAdded: '토큰이 추가되었습니다.',
    tokenAddFail: '토큰 추가에 실패하였습니다.',
    confirmDeleteToken: '토큰을 삭제하시겠습니까?',
    tokenDeleted: '토큰이 삭제되었습니다.',
    tokenDeleteFail: '토큰 삭제에 실패하였습니다.'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/localCustomer/localCustomerDetail.js(v=20260323001)}"></script>
<input type="hidden" id="paramCpId" th:value="${cpId}"/>
<input type="hidden" id="paramCsId" th:value="${csId}"/>

<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">

                    <!-- 헤더 정보 -->
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>로컬 인증 정보</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered" style="text-align:left;">
                                    <colgroup>
                                        <col style="width:15%">
                                        <col style="width:35%">
                                        <col style="width:15%">
                                        <col style="width:35%">
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th>충전소ID</th>
                                            <td><span id="infoCpId" style="font-family:monospace;"></span></td>
                                            <th>충전기ID</th>
                                            <td><span id="infoCsId" style="font-family:monospace;"></span></td>
                                        </tr>
                                        <tr>
                                            <th>버전</th>
                                            <td><span id="infoVersion"></span></td>
                                            <th>업데이트타입</th>
                                            <td><span id="infoUpdateType"></span></td>
                                        </tr>
                                        <tr>
                                            <th>마지막전송일시</th>
                                            <td><span id="infoLastSendDate"></span></td>
                                            <th>상태</th>
                                            <td><span id="infoStatus"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{common.label.regDate}"></th>
                                            <td><span id="infoRegDate"></span></td>
                                            <th th:text="#{common.label.updDate}"></th>
                                            <td><span id="infoUpdDate"></span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div style="text-align:right;">
                                <button type="button" id="btnList" class="btn btn-white btn-sm"><span>목록</span></button>
                                <button type="button" id="btnDelete" class="btn btn-danger btn-sm"><span>삭제</span></button>
                            </div>
                        </div>
                    </div>

                    <!-- 토큰 목록 -->
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>토큰 목록</span> <small id="tokenTotalCount" style="margin-left:8px; color:#999;"></small></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 토큰 추가 폼 -->
                            <div style="margin-bottom:10px; padding:10px; background:#f8f9fa; border:1px solid #e7eaec; border-radius:3px;">
                                <div class="row">
                                    <div class="col-sm-2">
                                        <input type="text" id="inputToken" class="form-control input-sm" placeholder="토큰값" maxlength="36">
                                    </div>
                                    <div class="col-sm-2">
                                        <select id="inputTokenType" class="form-control input-sm">
                                            <option value="ISO14443">ISO14443</option>
                                            <option value="eMAID">eMAID</option>
                                            <option value="EVCCID">EVCCID</option>
                                            <option value="Local">Local</option>
                                            <option value="MacAddress">MacAddress</option>
                                            <option value="NoAuthorization">NoAuthorization</option>
                                            <option value="Central">Central</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-2">
                                        <select id="inputTokenStatus" class="form-control input-sm">
                                            <option value="Accepted">Accepted</option>
                                            <option value="Blocked">Blocked</option>
                                            <option value="Expired">Expired</option>
                                            <option value="Invalid">Invalid</option>
                                            <option value="NoCredit">NoCredit</option>
                                            <option value="ConcurrentTx">ConcurrentTx</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="datetime-local" id="inputCacheExpireDate" class="form-control input-sm">
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="text" id="inputParentIdToken" class="form-control input-sm" placeholder="부모토큰" maxlength="36">
                                    </div>
                                    <div class="col-sm-2">
                                        <button type="button" id="btnAddToken" class="btn btn-sm btn-primary btn-block">
                                            <i class="fa fa-plus"></i> <span>토큰 추가</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="row" style="margin-top:4px;">
                                    <div class="col-sm-2 col-sm-offset-4">
                                        <select id="inputParentTokenType" class="form-control input-sm">
                                            <option value="">-- <span>부모토큰타입</span> --</option>
                                            <option value="ISO14443">ISO14443</option>
                                            <option value="eMAID">eMAID</option>
                                            <option value="EVCCID">EVCCID</option>
                                            <option value="Local">Local</option>
                                            <option value="MacAddress">MacAddress</option>
                                            <option value="NoAuthorization">NoAuthorization</option>
                                            <option value="Central">Central</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 토큰 테이블 -->
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover"
                                       style="white-space:nowrap; text-align:center;">
                                    <thead>
                                        <tr>
                                            <th><span>번호</span></th>
                                            <th><span>토큰값</span></th>
                                            <th><span>토큰타입</span></th>
                                            <th><span>인증상태</span></th>
                                            <th><span>캐시만료일시</span></th>
                                            <th><span>부모토큰</span></th>
                                            <th><span>부모토큰타입</span></th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tBodyTokens"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    jQuery(document).ready(function () {
        localCustomerDetailJs.init();
    });
</script>
</body>
</html>
