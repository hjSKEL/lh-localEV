<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script th:inline="javascript">
var _msg = {
    inputError: /*[[#{js.localCust.inputError}]]*/ '',
    inputCpId6: /*[[#{js.localCust.cpId6}]]*/ '',
    inputCsId2: /*[[#{js.localCust.csId2}]]*/ '',
    processing: /*[[#{js.localCust.processing}]]*/ '',
    localAuthRegistered: /*[[#{js.localCust.registered}]]*/ '',
    registerFail: /*[[#{js.localCust.regFailed}]]*/ '',
    alreadyRegistered: /*[[#{js.localCust.mayAlreadyRegistered}]]*/ '',
    btnRegister: /*[[#{js.localCust.register}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/localCustomer/localCustomer.js(v=20260323001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{charger.localAuth.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 검색 -->
                            <div class="row m-b-sm">
                                <div class="col-sm-12">
                                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                        <span style="font-weight:700; white-space:nowrap;" th:text="#{common.label.status}+' '"></span>
                                        <label style="margin:0;"><input type="radio" name="searchStatus" value="" checked>&nbsp;<span th:text="#{common.label.all}"></span></label>
                                        <label style="margin:0;"><input type="radio" name="searchStatus" value="Accepted">&nbsp;Accepted</label>
                                        <label style="margin:0;"><input type="radio" name="searchStatus" value="Failed">&nbsp;Failed</label>
                                        <label style="margin:0;"><input type="radio" name="searchStatus" value="NotSupported">&nbsp;NotSupported</label>
                                        <label style="margin:0;"><input type="radio" name="searchStatus" value="VersionMismatch">&nbsp;VersionMismatch</label>
                                        <input type="text" id="searchCpId" th:placeholder="#{charger.localAuth.placeholder.cpId}" class="form-control input-sm" maxlength="6" style="width:100px;">
                                        <input type="text" id="searchCsId" th:placeholder="#{charger.localAuth.placeholder.csId}" class="form-control input-sm" maxlength="2" style="width:70px;">
                                        <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6" style="padding-top:11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align:right;">
                                    <button type="button" id="btnGoRegister" class="btn btn-sm btn-primary" data-toggle="modal" data-target="#registerModal"><span th:text="#{charger.localAuth.btn.newRegister}"></span></button>
                                </div>
                            </div>
                            <!-- 목록 테이블 -->
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                                <tr>
                                                    <th><span th:text="#{common.label.no}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.cpId}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.csId}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.version}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.updateType}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.lastSendDate}"></span></th>
                                                    <th><span th:text="#{common.label.status}"></span></th>
                                                    <th><span th:text="#{charger.localAuth.label.tokenCount}"></span></th>
                                                    <th><span th:text="#{common.label.regDate}"></span></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 신규 등록 Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title" th:text="#{charger.localAuth.register.title}"></h4>
            </div>
            <div class="modal-body">
                <div id="alertRegister" class="alert" style="display:none;">
                    <strong id="alertTitle"></strong>
                    <span id="alertMessage" style="margin-left:8px;"></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered" style="text-align:left;">
                        <colgroup>
                            <col style="width:35%">
                            <col style="width:65%">
                        </colgroup>
                        <tbody>
                            <tr>
                                <th><span th:text="#{charger.localAuth.label.cpId}"></span> <span class="text-danger">*</span></th>
                                <td><input type="text" id="regCpId" class="form-control input-sm" maxlength="6" th:placeholder="#{charger.localAuth.label.placeholder6}"></td>
                            </tr>
                            <tr>
                                <th><span th:text="#{charger.localAuth.label.csId}"></span> <span class="text-danger">*</span></th>
                                <td><input type="text" id="regCsId" class="form-control input-sm" maxlength="2" th:placeholder="#{charger.localAuth.label.placeholder2}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.cancel}"></span></button>
                <button type="button" id="btnRegister" class="btn btn-primary"><span th:text="#{common.btn.register}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        localCustomerJs.init();
    });
</script>
</body>
</html>
