<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{common/header :: head}"></head>

<body class="pace-done mini-navbar">

    <script th:inline="javascript">
        var _msg = {
            cpIdLength6:          /*[[#{js.cpId.length6}]]*/                          '',
            cpIdLabel:            /*[[#{js.cpId.label}]]*/                            '',
            inUse:                /*[[#{js.statusInfo.inUse}]]*/                      '',
            notInUse:             /*[[#{js.statusInfo.notInUse}]]*/                   '',
            broken:               /*[[#{js.statusInfo.broken}]]*/                     '',
            normal:               /*[[#{js.statusInfo.normal}]]*/                     '',
            pleaseWait:           /*[[#{js.please.wait}]]*/                           '',
            excelDownload:        /*[[#{js.excel.download}]]*/                        '',
            noBreakdownHistory:   /*[[#{js.statusInfo.noBreakdownHistory}]]*/         '',
            breakdownHistory:     /*[[#{js.statusInfo.breakdownHistory}]]*/           '',
            menuCsControl:        /*[[#{js.menu.csControl}]]*/                        '',
            menuBreakdownReceipt: /*[[#{js.menu.breakdownReceipt}]]*/                 ''
        };
    </script>
    <script type="text/javascript"
        th:src="@{/resources/js/charger/statusInfo/statusInfoList.js(v=20260810001)}"></script>
    <script type="text/javascript" th:src="@{/resources/js/util/commonCode.js}"></script>
    <div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
            <div class="wrapper wrapper-content">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5 th:text="#{charger.status.info.title}"></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-8 m-b-xs">
                                        <div class="input-group" style="width: 100%;">
                                            <select id="selChaStatus" class="form-control input-sm"
                                                style="max-width: 150px;">
                                                <option value="" th:text="#{charger.status.info.allStatus}"></option>
                                                <option value="A" th:text="#{charger.status.waiting}"></option>
                                                <option value="B" th:text="#{charger.status.available}"></option>
                                                <option value="C" th:text="#{charger.status.charging}"></option>
                                                <option value="D" th:text="#{charger.status.completed}"></option>
                                                <option value="E" th:text="#{charger.status.inspection}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-sm-4 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-btn" style="width:30%">
                                                <select id="searchType" class="form-control input-sm">
                                                    <option value="cpId" th:text="#{charger.status.info.pointId}">
                                                    </option>
                                                    <option value="cpName" selected
                                                        th:text="#{charger.status.info.pointName}"></option>
                                                </select>
                                            </span>
                                            <input type="text" id="searchKey"
                                                th:placeholder="#{common.placeholder.search.input}"
                                                class="form-control input-sm">
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary"
                                                    th:text="#{common.btn.search}"></button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning"
                                                    th:text="#{common.btn.reset}"></button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-6" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                    <div class="col-sm-6" style="text-align: right;">
                                        <!-- <button type="button" id="saveExcelcs" class="btn btn-sm btn-default">엑셀다운로드</button> -->
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x: auto;">
                                            <table
                                                class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                style="white-space:nowrap; text-align:center;">
                                                <thead>
                                                    <tr>
                                                        <th th:text="#{common.label.no}"></th>
                                                        <th th:text="#{charger.status.info.complexName}"></th>
                                                        <th th:text="#{charger.status.info.pointNameId}"></th>
                                                        <th th:text="#{charger.status.info.chargerId}"></th>
                                                        <th th:text="#{charger.status.info.channel}"></th>
                                                        <th th:text="#{charger.status.info.chargerStatus}"></th>
                                                        <th th:text="#{charger.status.info.alarmCode}"></th>
                                                        <th th:text="#{charger.status.info.collectionDate}"></th>
                                                        <th th:text="#{charger.status.info.custName}"></th>
                                                        <th th:text="#{charger.status.info.dongHo}"></th>
                                                        <th th:text="#{charger.status.info.meterPower}"></th>
                                                        <th th:text="#{charger.status.info.usedPower}"></th>
                                                        <th th:text="#{charger.status.info.instantRate}"></th>
                                                        <th th:text="#{charger.status.info.totalAmount}"></th>
                                                        <th th:text="#{charger.status.info.chargingId}"></th>
                                                    </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot>
                                                </tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers"
                                            id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl">
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- chargerInfo popup include -->
    <div th:replace="~{common/popup/chargerInfo :: chargerInfo}"></div>
    <!-- breakdownInfo popup include -->
    <div th:replace="~{common/popup/breakdownInfo :: breakdownInfo}"></div>
    <!-- csAlarmInfo popup include -->
    <div th:replace="~{common/popup/csAlarmInfo :: csAlarmInfo}"></div>
</body>
<script type="text/javascript">
    var UserRole = parent.UserRole;
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        statusInfoListJs.init();
    });
</script>

</html>
