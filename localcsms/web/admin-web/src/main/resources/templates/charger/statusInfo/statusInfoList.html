<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{common/header :: head}"></head>

<body class="pace-done mini-navbar">

    <script>
        var _msg = {
            cpIdLength6:          '충전소ID 6자리를 입력해주세요.',
            cpIdLabel:            '충전소ID',
            cpCsIdFormat:         '충전기ID 형식이 올바르지 않습니다. (예: 000000-01)',
            inUse:                '사용',
            notInUse:             '미사용',
            broken:               '고장',
            normal:               '정상',
            pleaseWait:           '잠시만 기다려 주세요.',
            excelDownload:        '엑셀 다운로드',
            noBreakdownHistory:   '고장이력이 없습니다.',
            breakdownHistory:     '고장이력',
            menuCsControl:        '충전기제어',
            menuBreakdownReceipt: '고장접수내역'
        };
    </script>
    <script type="text/javascript"
        th:src="@{/resources/js/charger/statusInfo/statusInfoList.js(v=20260830001)}"></script>
    <script type="text/javascript" th:src="@{/resources/js/util/commonCode.js}"></script>
    <div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
            <div class="wrapper wrapper-content">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5>충전기 상태정보</h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-8 m-b-xs">
                                        <label><span>충전기 상태</span> : &nbsp;</label>
                                        <select id="selChaStatus" class="form-control input-sm" style="display: inline-block; width: auto">
                                            <option value="" selected>전체</option>
                                            <option value="A">충전대기</option>
                                            <option value="B">대기(이용대기)</option>
                                            <option value="C">충전중</option>
                                            <option value="D">충전완료</option>
                                            <option value="E">점검중</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-4 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-btn" style="width:30%">
                                                <select id="searchType" class="input-sm form-control input-sm inline">
                                                    <option value="cpName" selected>충전소명</option>
                                                    <option value="cpId">충전소ID</option>
                                                    <option value="cpCsId">충전기ID</option>
                                                </select>
                                            </span>
                                            <input type="text" id="searchKey" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary">검색</button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning">초기화</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x: auto;">
                                            <table
                                                class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                style="white-space:nowrap; text-align:center;">
                                                <thead>
                                                    <tr>
                                                        <th>번호</th>
                                                        <th>충전소명(충전소ID)
                                                            <a href="javascript:void(0)" class="sortBtn" data-asc="C" data-desc="D" data-state="asc" title="정렬" style="font-size:1em;">▲</a>
                                                        </th>
                                                        <th>충전기ID
                                                            <a href="javascript:void(0)" class="sortBtn" data-asc="E" data-desc="F" data-state="desc" title="정렬" style="font-size:1em;">▼</a>
                                                        </th>
                                                        <th>채널</th>
                                                        <th>충전기상태</th>
                                                        <th>알람코드</th>
                                                        <th>수집날짜</th>
                                                        <th>고객명</th>
                                                        <th>동</th>
                                                        <th>호</th>
                                                        <th>계량기값(kWh)</th>
                                                        <th>충전량(kWh)</th>
                                                        <th>충전단가(원)</th>
                                                        <th>충전금액(원)</th>
                                                        <th>충전ID</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot>
                                                </tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers"
                                            id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl">
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- chargerInfo popup include -->
    <div th:replace="~{common/popup/chargerInfo :: chargerInfo}"></div>
    <!-- breakdownInfo popup include -->
    <div th:replace="~{common/popup/breakdownInfo :: breakdownInfo}"></div>
    <!-- csAlarmInfo popup include -->
    <div th:replace="~{common/popup/csAlarmInfo :: csAlarmInfo}"></div>
</body>
<script type="text/javascript">
    var UserRole = parent.UserRole;
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        statusInfoListJs.init();
    });
</script>

</html>
