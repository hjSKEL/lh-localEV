<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
    var _msg = {
        title:       /*[[#{js.statusLog.title}]]*/       '',
        csIdLength8: /*[[#{js.csId.length8}]]*/          '',
        csIdLabel:   /*[[#{js.csId.label}]]*/            ''
    };
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/statusLog/statusLogList.js(v=20230808001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:text="#{charger.status.log.title}"></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"> <i class="fa fa-chevron-up"></i></a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#"></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;" th:text="#{charger.status.log.queryDate}"></span>
                                        <div class="input-daterange input-group" id="datepicker">
                                            <input type="text" class="input-sm form-control" id="date1"
                                                   name="start" style="max-width: 150px;" readonly>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;" th:text="#{common.label.content.count}"></span>
                                        <span class="input-group-btn" style="width: 70px;">
                                            <select class="input-sm form-control input-s-sm inline" id="pagingNum"
                                                    name="pagingNum">
                                                <option value="20" selected>20</option>
                                                <option value="30">30</option>
                                                <option value="40">40</option>
                                            </select>
                                        </span>
                                        <span class="input-group-btn" style="width: 120px;">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType" name="sType">
                                                <option value="CHAID" th:text="#{charger.status.log.chargerId}"></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm"
                                               style="width: calc(100% - 80px);">
                                        <select class="input-sm form-control input-s-sm inline" id="csCableChn" style="width: 80px;">
                                            <option value="0" th:text="#{common.label.all}"></option>
                                            <option value="1" th:text="#{charger.status.log.channel.ch1}"></option>
                                            <option value="2" th:text="#{charger.status.log.channel.ch2}"></option>
                                        </select>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch"
                                                    class="btn btn-sm btn-primary" th:text="#{common.btn.search}"></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset"
                                                    class="btn btn-sm btn-warning" th:text="#{common.btn.reset}"></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x: auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space: nowrap; text-align: center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{charger.status.log.serverCollectionTime}"></th>
                                                <th th:text="#{charger.status.log.terminalCollectionTime}"></th>
                                                <th th:text="#{charger.status.log.chargingId}"></th>
                                                <th th:text="#{charger.status.log.chargerId}"></th>
                                                <th th:text="#{charger.status.log.channel}"></th>
                                                <th th:text="#{charger.status.log.chargerStatus}"></th>
                                                <th th:text="#{charger.status.log.cableStatus}"></th>
                                                <th th:text="#{charger.status.log.abnormalStatus}"></th>
                                                <th th:text="#{charger.status.log.usedPower}"></th>
                                                <th th:text="#{charger.status.log.meterPower}"></th>
                                                <th th:text="#{charger.status.log.instantPower}"></th>
                                                <th th:text="#{charger.status.log.instantAmount}"></th>
                                                <th th:text="#{charger.status.log.totalAmount}"></th>
                                                <th th:text="#{charger.status.log.startTime}"></th>
                                                <th th:text="#{charger.status.log.lastTime}"></th>
                                                <th th:text="#{charger.status.log.eventCode}"></th>
                                                <th th:text="#{charger.status.log.tagCardNumber}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList">
                                            <tr style="text-align: center;">
                                                <td colspan="19" th:text="#{charger.status.log.searchHint}"></td>
                                            </tr>
                                            </tbody>
                                            <tfoot>
                                            </tfoot>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers"
                                         id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    var pageInfo2Js;
    jQuery(document).ready(function () {
        //
        pageInfo2Js = new PageInfo2Js();
        statusLogListJs.init();
    });
</script>
</html>
