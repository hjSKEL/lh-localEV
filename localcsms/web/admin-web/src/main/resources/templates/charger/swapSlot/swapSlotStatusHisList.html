<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _msg = {
    slotHisMgmt:     /*[[#{js.batteryswap.slot.his.mgmt}]]*/ '',
    pointAll:        /*[[#{js.batteryswap.slot.point.all}]]*/ '',
    stationAll:      /*[[#{js.batteryswap.slot.station.all}]]*/ '',
    slotAll:         /*[[#{js.batteryswap.slot.evse.all}]]*/ '',
    eventAll:        /*[[#{js.batteryswap.slot.his.event.all}]]*/ '',
    newStateAll:     /*[[#{js.batteryswap.slot.state.all}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/swapSlot/swapSlotStatusHisList.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{batteryswap.slot.his.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-daterange input-group" style="display:inline-flex; width:100%;">
                                        <input type="text" class="input-sm form-control" id="date1" style="max-width:150px;" readonly>
                                        <span class="input-group-addon">~</span>
                                        <input type="text" class="input-sm form-control" id="date2" style="max-width:150px;" readonly>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <select id="cpSelect"   class="input-sm form-control input-s-sm inline" style="width:30%;"></select>
                                    &nbsp;
                                    <select id="csSelect"   class="input-sm form-control input-s-sm inline" style="width:20%;"></select>
                                    &nbsp;
                                    <select id="evseSelect" class="input-sm form-control input-s-sm inline" style="width:18%;"></select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <select id="eventType" class="input-sm form-control input-s-sm inline" style="width:45%;"></select>
                                    &nbsp;
                                    <select id="newState"  class="input-sm form-control input-s-sm inline" style="width:45%;"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="BAT_SN" selected><span th:text="#{batteryswap.slot.label.battery.sn}"></span></option>
                                                <option value="REF_ID"><span th:text="#{batteryswap.slot.his.label.event.ref.id}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 15px;">
                                <div class="col-sm-12" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.event.date}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.id}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.name}"></th>
                                                <th th:text="#{batteryswap.station.label.cs.id}"></th>
                                                <th th:text="#{batteryswap.slot.label.evse.id}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.event.type}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.event.ref.id}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.prev}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.next}"></th>
                                                <th th:text="#{batteryswap.slot.label.battery.sn}"></th>
                                                <th th:text="#{batteryswap.slot.label.soc}"></th>
                                                <th th:text="#{batteryswap.slot.label.soh}"></th>
                                                <th th:text="#{batteryswap.slot.his.label.reg.user}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        swapSlotStatusHisListJs.init();
    });
</script>
</body>
</html>
