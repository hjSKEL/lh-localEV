<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    slotMgmt:           /*[[#{js.batteryswap.slot.mgmt}]]*/ '',
    pointAll:           /*[[#{js.batteryswap.slot.point.all}]]*/ '',
    stationAll:         /*[[#{js.batteryswap.slot.station.all}]]*/ '',
    slotStateAll:       /*[[#{js.batteryswap.slot.state.all}]]*/ '',
    totalSlots:         /*[[#{js.batteryswap.slot.total}]]*/ '',
    refreshOff:         /*[[#{js.batteryswap.slot.refresh.off}]]*/ '',
    refreshLabel:       /*[[#{js.batteryswap.slot.refresh.label}]]*/ '',
    historyShort:       /*[[#{js.batteryswap.slot.history.short}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/charger/swapSlot/swapSlotStatusList.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{batteryswap.slot.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-7 m-b-xs">
                                    <select id="cpSelect"  class="input-sm form-control input-s-sm inline" style="width:32%;"></select>
                                    &nbsp;
                                    <select id="csSelect"  class="input-sm form-control input-s-sm inline" style="width:22%;"></select>
                                    &nbsp;
                                    <select id="slotState" class="input-sm form-control input-s-sm inline" style="width:25%;"></select>
                                    &nbsp;
                                    <select id="refresh"   class="input-sm form-control input-s-sm inline" style="width:15%;"></select>
                                </div>
                                <div class="col-sm-5">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="BAT_SN" selected><span th:text="#{batteryswap.slot.label.battery.sn}"></span></option>
                                                <option value="EVSE_ID"><span th:text="#{batteryswap.slot.label.evse.id}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 15px;">
                                <div class="col-sm-12">
                                    <label id="totalCount" style="margin-right: 12px;"></label>
                                    <span id="stateChips"></span>
                                </div>
                            </div>
                            <div class="table-responsive" style="padding-top: 8px;">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.id}"></th>
                                                <th th:text="#{batteryswap.point.label.cp.name}"></th>
                                                <th th:text="#{batteryswap.station.label.cs.id}"></th>
                                                <th th:text="#{batteryswap.slot.label.evse.id}"></th>
                                                <th th:text="#{batteryswap.slot.label.state}"></th>
                                                <th th:text="#{batteryswap.slot.label.ocpp.conn}"></th>
                                                <th th:text="#{batteryswap.slot.label.battery.sn}"></th>
                                                <th th:text="#{batteryswap.slot.label.soc}"></th>
                                                <th th:text="#{batteryswap.slot.label.soh}"></th>
                                                <th th:text="#{batteryswap.slot.label.charging.start}"></th>
                                                <th th:text="#{batteryswap.slot.label.estimated.ready}"></th>
                                                <th th:text="#{batteryswap.slot.label.last.event}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 슬롯 상세 모달 -->
<div class="modal inmodal fade" id="Popup_SlotStatus" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title">
                    <span th:text="#{batteryswap.slot.popup.title}"></span>
                    <small id="popupSlotKey" style="margin-left:10px;"></small>
                </h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-sm-6">
                        <fieldset>
                            <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.ident}"></legend>
                            <table class="table table-bordered" style="background-color: white;">
                                <tr><th style="width:35%;" th:text="#{batteryswap.point.label.cp.id}"></th><td id="pp_cpId"></td></tr>
                                <tr><th th:text="#{batteryswap.station.label.cs.id}"></th><td id="pp_csId"></td></tr>
                                <tr><th th:text="#{batteryswap.slot.label.evse.id}"></th><td id="pp_evseId"></td></tr>
                            </table>
                        </fieldset>
                    </div>
                    <div class="col-sm-6">
                        <fieldset>
                            <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.summary}"></legend>
                            <table class="table table-bordered" style="background-color: white;">
                                <tr><th style="width:35%;" th:text="#{batteryswap.slot.label.state}"></th><td id="pp_slotState"></td></tr>
                                <tr><th th:text="#{batteryswap.slot.label.ocpp.conn}"></th><td id="pp_ocpp"></td></tr>
                                <tr><th th:text="#{batteryswap.slot.label.last.event}"></th><td id="pp_lastEvent"></td></tr>
                            </table>
                        </fieldset>
                    </div>
                </div>
                <fieldset>
                    <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.battery}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:18%;" th:text="#{batteryswap.slot.label.battery.sn}"></th>
                            <td style="width:32%;" id="pp_batterySn"></td>
                            <th style="width:18%;" th:text="#{batteryswap.slot.label.vendor}"></th>
                            <td style="width:32%;" id="pp_vendor"></td>
                        </tr>
                        <tr>
                            <th th:text="#{batteryswap.slot.label.soc}"></th>
                            <td id="pp_soc"></td>
                            <th th:text="#{batteryswap.slot.label.soh}"></th>
                            <td id="pp_soh"></td>
                        </tr>
                        <tr>
                            <th th:text="#{batteryswap.slot.label.production.date}"></th>
                            <td colspan="3" id="pp_prodDate"></td>
                        </tr>
                    </table>
                </fieldset>
                <div class="row">
                    <div class="col-sm-6">
                        <fieldset>
                            <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.charging}"></legend>
                            <table class="table table-bordered" style="background-color: white;">
                                <tr><th style="width:35%;" th:text="#{batteryswap.slot.label.charging.start}"></th><td id="pp_chStart"></td></tr>
                                <tr><th th:text="#{batteryswap.slot.label.estimated.ready}"></th><td id="pp_estReady"></td></tr>
                            </table>
                        </fieldset>
                    </div>
                    <div class="col-sm-6">
                        <fieldset>
                            <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.reservation}"></legend>
                            <table class="table table-bordered" style="background-color: white;">
                                <tr><th style="width:35%;" th:text="#{batteryswap.slot.label.reserved.req}"></th><td id="pp_reqId"></td></tr>
                                <tr><th th:text="#{batteryswap.slot.label.reserved.until}"></th><td id="pp_reserveUntil"></td></tr>
                            </table>
                        </fieldset>
                    </div>
                </div>
                <fieldset>
                    <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.fault}"></legend>
                    <table class="table table-bordered" style="background-color: white;">
                        <tr>
                            <th style="width:18%;" th:text="#{batteryswap.slot.label.fault.code}"></th>
                            <td style="width:32%;" id="pp_faultCode"></td>
                            <th style="width:18%;" th:text="#{batteryswap.slot.label.fault.since}"></th>
                            <td style="width:32%;" id="pp_faultSince"></td>
                        </tr>
                    </table>
                </fieldset>
                <fieldset>
                    <legend style="font-size:13px;" th:text="#{batteryswap.slot.legend.recent}"></legend>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" style="white-space:nowrap; text-align:center;">
                            <thead>
                            <tr>
                                <th th:text="#{batteryswap.slot.his.label.event.date}"></th>
                                <th th:text="#{batteryswap.slot.his.label.event.type}"></th>
                                <th th:text="#{batteryswap.slot.his.label.prev}"></th>
                                <th th:text="#{batteryswap.slot.his.label.next}"></th>
                                <th th:text="#{batteryswap.slot.label.battery.sn}"></th>
                                <th th:text="#{batteryswap.slot.label.soc}"></th>
                                <th th:text="#{batteryswap.slot.label.soh}"></th>
                            </tr>
                            </thead>
                            <tbody id="pp_recentBody"></tbody>
                        </table>
                    </div>
                </fieldset>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnViewAllHistory"><span th:text="#{batteryswap.slot.btn.view.all.history}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        swapSlotStatusListJs.init();
    });
</script>
</body>
</html>
