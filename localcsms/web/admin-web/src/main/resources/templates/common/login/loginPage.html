<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{layout.admin.title}">Local CSMS</title>

    <link th:href="@{/resources/lib/css/bootstrap.min.css(v=20230801001)}" rel="stylesheet">
    <link th:href="@{/resources/lib/font-awesome/css/font-awesome.css}" rel="stylesheet">
    <link th:href="@{/resources/lib/css/animate.css}" rel="stylesheet">
    <link th:href="@{/resources/lib/css/style.css(v=20230731001)}" rel="stylesheet">
    <!-- Sweet Alert -->
    <link th:href="@{/resources/lib/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
    <script th:src="@{/resources/lib/js/plugins/sweetalert/sweetalert.min.js}"></script>
    <script th:src="@{/resources/lib/js/jquery/jquery-3.7.0.min.js}"></script>
    <script th:src="@{/resources/lib/js/bootstrap/bootstrap.min.js(v=20230801001)}"></script>
</head>
<body class="gray-bg">

<div class="middle-box text-center loginscreen animated fadeInDown" style="width: 500px;">
    <div>
        <h1 class="logo-name">KEVIT</h1>
    </div>
    <h3 th:text="#{login.title}">EV Charging Management System</h3>
    <p th:text="#{login.description}">Sign in to management console</p>
</div>

<div class="middle-box text-center loginscreen animated fadeInDown" style="padding-top: 0">
    <div>
        <form id="loginform" class="m-t" role="form" th:action="@{/login}" method="POST">
            <div class="form-group">
                <input id="login-username" name="login-username" type="text" class="form-control"
                       th:placeholder="#{login.id.placeholder}" placeholder="ID" required="">
            </div>
            <div class="form-group">
                <input id="login-password" name="login-password" type="password" class="form-control"
                       th:placeholder="#{login.pw.placeholder}" placeholder="Password" required="">
            </div>
            <button type="submit" class="btn btn-primary block full-width m-b" th:text="#{common.btn.login}">Login</button>
        </form>
        <div class="m-t text-center">
            <a href="javascript:void(0)" onclick="changeLang('ko')" class="btn btn-xs btn-default">한국어</a>
            <a href="javascript:void(0)" onclick="changeLang('en')" class="btn btn-xs btn-default">English</a>
        </div>
        <p class="m-t"><small>KEVIT &copy; 2023 - 2025</small></p>
    </div>
</div>

<script>
    function changeLang(lang) {
        document.cookie = "lang=" + lang + "; path=/; max-age=31536000";
        location.href = location.pathname + "?lang=" + lang;
    }
    $(document).ready(function () {
        if (!(parent && parent.location && parent.location.href == this.location.href)) {
            parent.location.href = this.location.href;
            return;
        }
        var uri2 = parent.location.href;

        $("#loginform").submit(function (event) {
            event.preventDefault();
            var url = $(this).attr("action");
            var data = $(this).serialize();

            $.post(url, data)
                .done(function (data) {
                    let response = JSON.parse(data);
                    if (response.auth) {
                        location.href = location.origin + response.url;
                    } else {
                        alert(decodeURIComponent(response.authenException).replace(/\+/gi, " "));
                    }
                });
        });
    });
</script>
</body>
</html>
