<th:block th:fragment="popup">
    <div class="modal inmodal fade" id="Popup_ChargingPointInfo" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span
                            aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title"><span>충전소 정보</span></h4>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped">
                            <tr>
                                <th><span>충전소ID</span></th>
                                <td id="Popup_ChargingPointInfo_tbCpId"></td>
                                <th><span>충전소명</span></th>
                                <td id="Popup_ChargingPointInfo_tbCpName"></td>
                            </tr>
                            <tr>
                                <th><span>급속충전기 수</span></th>
                                <td id="Popup_ChargingPointInfo_highCsCount">
                                </td>
                                <th><span>완속충전기 수</span></th>
                                <td id="Popup_ChargingPointInfo_lowCsCount">
                            </tr>
                            <tr>
                                <th><span>충전소 위치</span></th>
                                <td colspan="3" id="Popup_ChargingPointInfo_cpLocation"></td>
                            </tr>
                            <tr>
                                <th><span>전력량</span></th>
                                <td id="Popup_ChargingPointInfo_electSupplyCapability"></td>
                                <th><span>충전소사용가능여부</span></th>
                                <td id="Popup_ChargingPointInfo_cpUseYn"></td>
                            </tr>
                            <tr>
                                <th><span>메모</span></th>
                                <td colspan="3" id="Popup_ChargingPointInfo_memo"></td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-white" data-dismiss="modal"><span
                           >닫기</span></button>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" th:src="@{/resources/js/popup/chargingPointPopup.js(v=20260810001)}"></script>

</th:block>
