<div class="modal inmodal fade" id="Popup_ChargePoint" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title"><span th:text="#{popup.charging.point.search.title}"></span></h4>
            </div>
            <div class="modal-body">
		 <div class="table-responsive">
		   <table class="table table-bordered table-striped" style="background-color: white;">
				<tr>
					<th width="10%;"><span th:text="#{common.label.region}"></span></th>
					<td align="left" style="padding:5px 0;">
						<select name="zipCodeSi" id="Popup_ChargePoint_zipCodeSi"></select>
                        <select name="zipCodeGu" id="Popup_ChargePoint_zipCodeGu"></select>
					</td>
					<th width="10%;"><span th:text="#{recharging.label.charging.point}"></span></th>
					<td align="left" style="padding:5px 0;">
						<input id="Popup_ChargePoint_searchKey" name="searchWord" type="text" style="width:150px;height:22px;"/>
						<button id="Popup_ChargePoint_btnSearch" type="button" class="btn btn-info btn-xs"><i class="fa fa-search" aria-hidden="true"></i> <span th:text="#{common.btn.search}"></span> </button>
					</td>
				</tr>
			</table>

			<table class="table table-bordered" style="width:96%;" align="center">
			  <thead>
			  <tr class="active">
			    	<th><span th:text="#{common.label.no}"></span></th>
			    	<th><span th:text="#{recharging.label.charging.point.id}"></span></th>
			    	<th><span th:text="#{recharging.label.charging.point}"></span></th>
			    	<th><span th:text="#{common.label.address}"></span></th>
			   </tr>
			   </thead>
			<tbody id="Popup_ChargePoint_tBodyList">
			    <tr style="text-align:center;cursor:pointer;">
					<td colspan="5"><span th:text="#{common.message.searching}"></span></td>
				</tr>
				</tbody>
			</table>
			<ul class="pagination pagination-sm" id="Popup_ChargePoint_pagingUl"></ul>
		</div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/resources/js/popup/constChargePointSearchPopup.js(v=20230731001)}"></script>
