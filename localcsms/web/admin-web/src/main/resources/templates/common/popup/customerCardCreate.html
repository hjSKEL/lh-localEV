<div class="modal inmodal fade" id="Popup_CustomerCardCreate" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title"><span th:text="#{popup.customer.card.create.title}"></span></h4>
            </div>
            <div class="modal-body">
		 <div class="table-responsive">
		   <table class="table table-bordered table-striped" style="background-color: white;">
			    <tr>
				    <th><span th:text="#{customer.label.card.number}"></span></th>
				    <td>
			    		<input type="text" id="popupCutCardNo" data-mask="9999-9999-9999-9999" class="form-control input-sm">
				    </td>
				</tr>
			</table>
		</div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-white pull-right" data-dismiss="modal"><span th:text="#{common.btn.cancel}"></span></button>
            	<button id="btnCustomerCardRegister" class="btn btn-success pull-right"><span th:text="#{common.btn.register}"></span></button>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
if (typeof _msg === 'undefined') { var _msg = {}; }
Object.assign(_msg, {
    checkCardNo: /*[[#{js.customer.card.checkNo}]]*/ '',
    customerCard: /*[[#{js.customer.card}]]*/ '',
    dupCardNo: /*[[#{js.customer.card.dupNo}]]*/ '',
    customerMgmt: /*[[#{js.customer.mgmt}]]*/ ''
});
</script>
