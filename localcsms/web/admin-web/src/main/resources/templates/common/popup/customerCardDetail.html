<th:block th:fragment="popup">
<!-- Popup: 카드정보 / 신규 카드 등록 (트리거: btnCardListAdd) -->
<div class="modal inmodal fade" id="Popup_CardInfo" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title"><span>카드정보</span></h4>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <colgroup>
                            <col width="15%">
                            <col width="35%">
                            <col width="15%">
                            <col width="35%">
                        </colgroup>
                        <tbody>
                        <tr>
                            <th><span>회원카드번호</span><span style="color:red;">*</span></th>
                            <td style="display:flex;">
                                <div class="input-group">
                                    <span class="input-group-addon" style="display:contents;">
                                        <input type="text" style="width:85px;" id="cutCardNo1" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
                                        <span class="input-group-addon" style="width:0px;" >-</span>
                                        <input type="text" style="width:85px;" id="cutCardNo2" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
                                        <span class="input-group-addon" style="width:0px;">-</span>
                                        <input type="text" style="width:85px;" id="cutCardNo3" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
                                        <span class="input-group-addon" style="width:0px;">-</span>
                                        <input type="text" style="width:85px;" id="cutCardNo4" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
                                    </span>
                                </div>
                                <div class="input-group">
                                    <button type="button" id="btnCardNoChecker" class="btn btn-primary"><span>중복확인</span></button>
                                </div>
                            </td>
                            <th><span>카드상태</span></th>
                            <td>
                                <select id="custStatCodeTd" class="input-sm form-control input-s-sm inline" name="sType">
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th><span>정지여부</span></th>
                            <td>
                                <div class="input-group">
                                    <select id="stopYn" class="form-control input-sm">
                                        <option value="N">N</option>
                                        <option value="Y">Y</option>
                                    </select>
                                    <span class="input-group-btn">
                                        <button type="button" id="btnStopYnChange" class="btn btn-sm btn-primary"><span>정지변경</span></button>
                                    </span>
                                </div>
                            </td>
                            <th><span>정지일</span></th>
                            <td>
                                <input type="text" id="stopDate" name="stopDate" readonly="readonly" class="form-control">
                            </td>
                        </tr>
                        <tr>
                            <th><span>분실여부</span></th>
                            <td>
                                <div class="input-group">
                                    <select id="lossYn" class="form-control input-sm">
                                        <option value="N">N</option>
                                        <option value="Y">Y</option>
                                    </select>
                                    <span class="input-group-btn">
                                        <button type="button" id="btnLossYnChange" class="btn btn-sm btn-primary"><span>분실변경</span></button>
                                    </span>
                                </div>
                            </td>
                            <th><span>분실일</span></th>
                            <td>
                                <input type="text" id="lossDate" name="lossDate" readonly="readonly" class="form-control">
                            </td>
                        </tr>
                        <tr>
                            <th><span>삭제여부</span></th>
                            <td>
                                <div class="input-group">
                                    <select id="delYn" class="form-control input-sm">
                                        <option value="N">N</option>
                                        <option value="Y">Y</option>
                                    </select>
                                    <span class="input-group-btn">
                                        <button type="button" id="btnDelYnChange" class="btn btn-sm btn-primary"><span>삭제변경</span></button>
                                    </span>
                                </div>
                            </td>
                            <th><span>삭제일</span></th>
                            <td>
                                <input type="text" id="delDate" name="delDate" readonly="readonly" class="form-control">
                            </td>
                        </tr>
                        <tr>
                            <th><span id="cardListFormLabel">신규 카드 등록</span></th>
                            <td colspan="3">
                                <div class="input-group">
                                    <input type="text" id="clfCutCardNo" class="form-control input-sm" maxlength="19" placeholder="0000-0000-0000-0000" onkeyup="this.value=this.value.replace(/[^0-9-]/g,'');">
                                    <select id="clfCustStatCode" class="form-control input-sm" style="display:none; max-width:150px;">
                                        <option value="MEML01">정상</option>
                                        <option value="MEML02">분실</option>
                                        <option value="MEML03">삭제/불량</option>
                                    </select>
                                    <span class="input-group-btn">
                                        <button id="btnCardListSave" class="btn btn-primary btn-sm"><span>저장</span></button>
                                        <button id="btnCardListCancel" class="btn btn-white btn-sm" style="display:none;"><span>취소</span></button>
                                    </span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span>닫기</span></button>
            </div>
        </div>
    </div>
</div>
</th:block>
