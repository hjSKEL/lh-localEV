<th:block th:fragment="popup">
<script type="text/javascript" th:src="@{/resources/js/popup/customerInfoPopup.js(v=20230731001)}"></script>

    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title"><span>고객 상세 정보</span></h4>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped" style="background-color: white;">
                        <tr>
                            <th><span>고객명</span></th>
                            <td id="Popup_CustomerInfo_customerName"></td>
                            <th><span>고객 ID</span></th>
                            <td id="Popup_CustomerInfo_customerId"></td>
                        </tr>

                            <th><span>차종</span></th>

                            <td id="Popup_CustomerInfo_carNumber"></td>
                        </tr>
                        <tr>
                            <th><span>직전 이용 충전소</span></th>
                            <td id="Popup_CustomerInfo_cpName"></td>
                            <th><span>직전 이용 충전기</span></th>
                            <td id="Popup_CustomerInfo_csUniqId"></td>
                        </tr>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span>닫기</span></button>
            </div>
        </div>
    </div>
</div>

</th:block>
