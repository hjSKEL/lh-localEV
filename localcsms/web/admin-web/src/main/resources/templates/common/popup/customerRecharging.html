<th:block th:fragment="popup">
<script th:inline="javascript">
if (typeof _msg === 'undefined') { var _msg = {}; }
Object.assign(_msg, {
    noHistory: /*[[#{js.charger.noHistory}]]*/ '',
    won: /*[[#{js.charger.won}]]*/ ''
});
</script>
<script type="text/javascript" th:src="@{/resources/js/popup/customerRechargingPopup.js(v=20230731001)}"></script>

<div class="modal inmodal fade" id="Popup_CustomerRecharging" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title"><span th:text="#{popup.customer.recharging.title}"></span></h4>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                        <tr class="active">
                            <th><span th:text="#{recharging.label.id}"></span></th>
                            <th><span th:text="#{recharging.label.start.time}"></span></th>
                            <th><span th:text="#{recharging.label.end.time}"></span></th>
                            <th><span th:text="#{recharging.label.charger.id}"></span></th>
                            <th><span th:text="#{recharging.label.status}"></span></th>
                            <th><span th:text="#{recharging.label.amount}"></span></th>
                            <th><span th:text="#{recharging.label.payment.amount}"></span></th>
                        </tr>
                        </thead>
                        <tbody id="Popup_ChargerRecharging_tBodyList">
                        <tr style="text-align:center;cursor:pointer;">
                            <td colspan="7"><span th:text="#{common.message.searching}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                    <ul class="pagination pagination-sm"  id="Popup_ChargerRecharging_pagingUl"></ul>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    let Popup_ChargerRecharging_pageInfoJs;

    jQuery(document).ready(function(){
        //
        Popup_ChargerRecharging_pageInfoJs = new PageInfoJs();
    });
</script>

</th:block>
