    noResult: /*[[#{js.customer.noResult}]]*/ '',
    checkCarModel: /*[[#{js.customer.checkCarModel}]]*/ '',
    checkGrade: /*[[#{js.customer.checkGrade}]]*/ '',
    checkUseGrade: /*[[#{js.customer.checkUseGrade}]]*/ '',
    checkDemotion: /*[[#{js.customer.checkDemotion}]]*/ '',
    checkSms: /*[[#{js.customer.checkSms}]]*/ '',
    checkEmail: /*[[#{js.customer.checkEmail}]]*/ '',

<script type="text/javascript" th:src="@{/resources/js/popup/customerUpdatePopup.js(v=20230731001)}"></script>

<div class="modal inmodal fade" id="Popup_CustomerUpdate" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title"><span th:text="#{popup.customer.update.title}"></span></h4>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <tr>
                            <th><span th:text="#{customer.label.id}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_customerId"></td>
                            <th><span th:text="#{customer.label.name}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_custName"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{common.label.login.id}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_loginId"></td>
                            <th><span th:text="#{common.label.mobile.phone}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_mblPhoneNo"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{customer.label.individual.corporate}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_companyName"></td>
                            <th><span th:text="#{common.label.department}"></span></th>
                            <td colspan="2" id="Popup_CustomerUpdate_corporateDept"></td>
                        </tr>
                        <tr>
                            <th><span th:text="#{customer.label.car.model}"></span></th>
                            <td colspan="2">
                                <div style="display: flex;">
                                    <select class="form-control input-sm" id="Popup_CustomerUpdate_carModelId"
                                            style="width: 100%"></select>
                                    <input class="form-control input-sm" type="text" id="Popup_CustomerUpdate_carName"
                                           style="width: 50%; display: none;">
                                </div>
                            </td>
                            <th><span th:text="#{customer.label.car.number}"></span></th>
                            <td colspan="2">
                                <input type="text" id="Popup_CustomerUpdate_carNumber" class="form-control input-sm">
                            </td>
                        </tr>
                        <tr>
                            <th><span th:text="#{popup.customer.label.grade}"></span></th>
                            <td>
                                <select class="form-control input-sm" id="Popup_CustomerUpdate_cutGrdCode"></select>
                            </td>
                            <th><span th:text="#{popup.customer.label.usage.grade}"></span></th>
                            <td>
                                <select class="form-control input-sm" id="Popup_CustomerUpdate_cutManageCode"></select>
                            </td>
                            <th><span th:text="#{popup.customer.label.demotion.yn}"></span></th>
                            <td>
                                <select class="form-control input-sm" id="Popup_CustomerUpdate_mgrDemYn">
                                    <option value="Y">Y</option>
                                    <option value="N">N</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th><span th:text="#{popup.customer.label.sms.receive.yn}"></span></th>
                            <td colspan="2">
                                <select class="form-control input-sm" id="Popup_CustomerUpdate_smsRctYn">
                                    <option value="Y"><span th:text="#{common.label.receive}"></span></option>
                                    <option value="N"><span th:text="#{common.label.not.receive}"></span></option>
                                </select>
                            </td>
                            <th><span th:text="#{popup.customer.label.email.receive.yn}"></span></th>
                            <td colspan="2">
                                <select class="form-control input-sm" id="Popup_CustomerUpdate_emailRctYn">
                                    <option value="Y"><span th:text="#{common.label.receive}"></span></option>
                                    <option value="N"><span th:text="#{common.label.not.receive}"></span></option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="Popup_CustomerUpdate_btnUpdate"><span th:text="#{common.btn.edit}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>
