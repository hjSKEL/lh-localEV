<div class="modal inmodal fade" id="Popup_PwReset" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title"><span th:text="#{popup.password.reset.title}"></span></h4>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <tbody>
                        <tr>
                            <td><span th:text="#{customer.label.id}"></span></td>
                            <td id="Popup_PwReset_customerId"></td>
                        </tr>
                        <tr>
                            <td><span th:text="#{customer.label.name}"></span></td>
                            <td id="Popup_PwReset_custName"></td>
                        </tr>
                        <tr>
                            <td><span th:text="#{popup.password.reset.label.new.password}"></span></td>
                            <td>
                                <input type="text" id="Popup_PwReset_newPw" th:placeholder="#{popup.password.reset.placeholder}"
                                       class="form-control input-sm">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="Popup_PwReset_btnReset"><span th:text="#{popup.password.reset.btn.reset}"></span></button>
                    <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
if (typeof _msg === 'undefined') { var _msg = {}; }
Object.assign(_msg, {
    pwReset: /*[[#{js.pw.reset}]]*/ '',
    pwEnter: /*[[#{js.pw.reset.enter}]]*/ '',
    pwLength: /*[[#{js.pw.reset.length}]]*/ '',
    pwConfirm: /*[[#{js.pw.reset.confirm}]]*/ '',
    customerMgmt: /*[[#{js.customer.mgmt}]]*/ '',
    modify: /*[[#{js.customer.modify}]]*/ '',
    cancel: /*[[#{js.customer.cancel}]]*/ ''
});
</script>
<script type="text/javascript" th:src="@{/resources/js/popup/pwResetPopup.js(v=20230731001)}"></script>
