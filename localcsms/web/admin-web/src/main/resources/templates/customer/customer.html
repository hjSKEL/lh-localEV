<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script>
var _msg = {
    customerMgmt: '고객관리',
    customerCardMgmt: '고객카드관리',
    memberCard: '회원카드',
    cardDigit16: '회원카드번호 16자리를 입력해주세요.',
    cardAvailable: '사용 가능한 카드번호 입니다.',
    cardDuplicate: '이미 등록된 카드번호 입니다. 다른 카드를 사용하세요.',
    cardDuplicateCheck: '카드번호 중복확인을 해주세요.',
    statusNew: '신규',
    statusNormal: '정상',
    statusLost: '분실',
    statusDeleteDefect: '삭제/불량',
    confirmLost: '분실처리 하시겠습니까?',
    confirmDeleteDefect: '삭제/불량처리 하시겠습니까?',
    confirmChangeCustomer: '고객정보를 변경하시겠습니까?',
    confirmChangeCard: '카드정보를 변경하시겠습니까?',
    confirmChangeGrade: '고객등급을 변경하시겠습니까?',
    selectGrade: '고객등급을 선택하세요.',
    confirmChangeStop: '정지여부를 변경하시겠습니까?',
    confirm: '확인',
    cancel: '취소',
    edit: '수정',
    validCustName: '올바른 고객명을 입력해 주세요.',
    validPhone: '휴대폰 번호를 입력해 주세요.',
    validPhoneFormat: '올바른 휴대폰 번호를 입력해 주세요.',
    validCardNo: '회원카드 번호를 입력하세요.',
    validCardNoInput: '카드번호를 입력해 주세요.',
    validEmailLength: '200자 이내의 이메일주소를 입력해 주세요.',

    selectPlease: '선택하세요'

<script type="text/javascript" th:src="@{/resources/js/customer/customer.js(v=20260616002)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/resources/lib/js/plugins/iCheck/icheck.min.js}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:if="${customerId == null or customerId == ''}">고객 등록</h5>
                            <h5 th:unless="${customerId == null or customerId == ''}">고객 상세</h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <tbody>
                                    <colgroup>
                                        <col width="15%">
                                        <col width="35%">
                                        <col width="15%">
                                        <col width="35%">
                                    </colgroup>
                                    <tr>
                                        <th th:if="${customerId != null and customerId != ''}"><span>고객 ID</span></th>
                                        <td th:if="${customerId != null and customerId != ''}" th:text="${customerId}"></td>
                                        <th><span>고객명</span><span style="color:red;">*</span></th>
                                        <td th:attr="colspan=${customerId == null or customerId == '' ? '3' : null}">
                                            <input type="text" name="custName" id="custName" maxlength="20"
                                                   class="form-control input-sm"
                                                   th:style="${customerId == null or customerId == '' ? 'width:40%;' : ''}"
                                                   readonly>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th><span>휴대폰번호</span><span style="color:red;">*</span></th>
                                        <td>
                                            <div class="input-group">
	                                        	<span class="input-group-addon" style="display:contents;">
		                                     		<select style="width:75px;" id="mblPhoneNo1" class="form-control">
			                                     			<option value="010" selected>010</option>
			                                     			<option value="011">011</option>
			                                     			<option value="016">016</option>
			                                     			<option value="016">017</option>
			                                     			<option value="018">018</option>
			                                     			<option value="018">019</option>
			                                     		</select>
		                                     		<span class="input-group-addon" style="width:0px;" >-</span>
		                                     		<input type="text" style="width:100px;" id="mblPhoneNo2" class="form-control" maxLength="4" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
		                                     		<span class="input-group-addon" style="width:0px;">-</span>
		                                     		<input type="text" style="width:100px;" id="mblPhoneNo3" class="form-control" maxLength="4" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
		                                     	</span>
	                                     	</div>
                                        </td>
                                        <th><span>이메일</span></th>
                                        <td>
                                            <input type="text" id="email" name="email" maxlength="100" class="form-control input-sm">
                                        </td>
                                    </tr>
									<tr>
										<th><span>차량모델</span></th>
										<td id="certDateTd" style="display: flex;">
											<select id="carModelId" class="form-control input-sm"></select>
											<input type="text" id="carName" class="form-control input-sm" readonly="readonly">
										</td>
										<th><span>차량번호</span></th>
										<td>
											<input type="text" id="carNumber" name="carNumber" class="form-control input-sm">
										</td>
									</tr>
                                    <tr>
                                        <th><span>V2X 가입</span></th>
                                        <td>
                                            <label class="checkbox-inline">
                                                <input type="checkbox" id="v2xContractYn" /> <span>V2X 서비스 가입</span>
                                            </label>
                                            <small class="text-muted">&nbsp; <span>ISO 15118-20 양방향 충전 (V2G/V2H) 계약 여부</span></small>
                                        </td>
                                        <th><span>허용 modes</span></th>
                                        <td>
                                            <div id="allowedEnergyTransferGroup" style="display:none;">
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="AC_single_phase"> AC_single_phase</label>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="AC_three_phase"> AC_three_phase</label>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="AC_BPT"> AC_BPT</label>
                                                <br/>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="DC"> DC</label>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="DC_BPT"> DC_BPT</label>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="AC_BPT_DER"> AC_BPT_DER</label>
                                                <label class="checkbox-inline"><input type="checkbox" class="allowedEnergyMode" value="WPT"> WPT</label>
                                            </div>
                                            <small id="allowedEnergyTransferHint" class="text-muted"><span>V2X 가입 체크 후 허용 modes 선택</span></small>
                                        </td>
                                    </tr>
                                    <tr>
									<th><span>등록일</span></th>
										<td id="regDate"></td>
										<th><span>수정일</span></th>
										<td id="updDate"></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="ibox-content">
                                    <button class="btn btn-white pull-right" id="btnList"><span>목록</span></button>
                                    <button th:if="${customerId == null or customerId == ''}" id="btnCustomerRegister" class="btn btn-success pull-right"><span>등록</span></button>
                                    <button th:unless="${customerId == null or customerId == ''}" id="btnCustomerUpdate" class="btn btn-warning pull-right"><span>수정</span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span>카드정보</span></h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped">
                                        <tbody>
                                        <colgroup>
                                            <col width="15%">
                                            <col width="35%">
                                            <col width="15%">
                                            <col width="35%">
                                        </colgroup>
                                        <tr>
                                            <th><span>회원카드번호</span><span style="color:red;">*</span></th>
                                            <td style="display:flex;">
	                                            <div class="input-group">
	                                                	<span class="input-group-addon" style="display:contents;">
				                                     		<input type="text" style="width:85px;" id="cutCardNo1" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
				                                     			<span class="input-group-addon" style="width:0px;" >-</span>
				                                     		<input type="text" style="width:85px;" id="cutCardNo2" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
				                                     			<span class="input-group-addon" style="width:0px;">-</span>
				                                     		<input type="text" style="width:85px;" id="cutCardNo3" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
				                                     			<span class="input-group-addon" style="width:0px;">-</span>
				                                     		<input type="text" style="width:85px;" id="cutCardNo4" class="form-control" maxLength="4" readonly="readonly" onKeyup="this.value=this.value.replace(/[^0-9]/g,'');">
		                                     			</span>
	                                            </div>
	                                            <div class="input-group">
	                                            	<button type="button" id="btnCardNoChecker" class="btn btn-primary"><span>중복확인</span></button>
	                                            </div>
                                            </td>
                                            <th><span>카드상태</span></th>
                                            <td>
												<select id="custStatCodeTd" class="input-sm form-control input-s-sm inline" name="sType">
												</select>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><span>태그유형</span></th>
                                            <td>
                                                <select id="tagType" class="input-sm form-control input-s-sm inline">
                                                    <option value="">선택</option>
                                                    <option value="TGTP01">ISO15693</option>
                                                    <option value="TGTP02">ISO14443</option>
                                                    <option value="TGTP03">KeyCode</option>
                                                </select>
                                            </td>
                                            <th><span>고객등급</span></th>
                                            <td>
                                                <div class="input-group">
                                                    <select id="cutGrdCode" class="form-control input-sm"></select>
                                                    <span class="input-group-btn">
                                                        <button type="button" id="btnGradeChange" class="btn btn-sm btn-primary"><span>등급변경</span></button>
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><span>정지여부</span></th>
                                            <td>
                                                <div class="input-group">
                                                    <select id="stopYn" class="form-control input-sm">
                                                        <option value="N">N</option>
                                                        <option value="Y">Y</option>
                                                    </select>
                                                    <span class="input-group-btn">
                                                        <button type="button" id="btnStopYnChange" class="btn btn-sm btn-primary"><span>정지변경</span></button>
                                                    </span>
                                                </div>
                                            </td>
                                            <th><span>정지일</span></th>
                                            <td>
                                                <input type="text" id="stopDate" name="stopDate" readonly="readonly" class="form-control">
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><span>분실처리자</span></th>
                                            <td>
                                                <input type="hidden" id="lossId">
                                                <input type="text" id="lossName" name="lossName" readonly="readonly" class="form-control">
                                            </td>
                                            <th><span>분실일</span></th>
                                            <td>
                                                <input type="text" id="lossDate" name="lossDate" readonly="readonly" class="form-control">
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><span>삭제자</span></th>
                                            <td>
                                                <input type="hidden" id="deleteId">
                                                <input type="text" id="deleteName" name="deleteName" readonly="readonly" class="form-control">
                                            </td>
                                            <th><span>삭제일</span></th>
                                            <td>
                                                <input type="text" id="delDate" name="delDate" readonly="readonly" class="form-control">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 보유 차량 (EVCCID) — TB_CUEV001 -->
                <div class="row" th:unless="${customerId == null or customerId == ''}">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5><span>보유 차량 (EVCCID)</span></h5>
                                <div class="ibox-tools">
                                    <button id="btnVehicleAdd" class="btn btn-success btn-xs"><span>차량 추가</span></button>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped">
                                        <colgroup>
                                            <col width="22%">
                                            <col width="14%">
                                            <col width="12%">
                                            <col width="10%">
                                            <col width="14%">
                                            <col width="6%">
                                            <col width="12%">
                                            <col width="10%">
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th>EVCCID</th>
                                                <th>차량명</th>
                                                <th>차량번호</th>
                                                <th>모델</th>
                                                <th>VIN</th>
                                                <th>V2X</th>
                                                <th>등록일</th>
                                                <th>관리</th>
                                            </tr>
                                        </thead>
                                        <tbody id="vehicleTbody"></tbody>
                                    </table>
                                </div>
                                <!-- 인라인 추가/수정 폼 (기본 hidden) -->
                                <div id="vehicleFormArea" style="display:none; border-top:1px solid #e7eaec; padding-top:10px;">
                                    <table class="table table-bordered">
                                        <colgroup>
                                            <col width="15%"><col width="35%"><col width="15%"><col width="35%">
                                        </colgroup>
                                        <tbody>
                                        <tr>
                                            <th><span>EVCCID</span><span style="color:red;">*</span></th>
                                            <td><input type="text" id="vfEvccId" class="form-control input-sm" placeholder="1A:2B:3C:4D:5E:6F"/></td>
                                            <th>차량명</th>
                                            <td><input type="text" id="vfCarName" class="form-control input-sm"/></td>
                                        </tr>
                                        <tr>
                                            <th>차량번호</th>
                                            <td><input type="text" id="vfCarNo" class="form-control input-sm" placeholder="12가3456"/></td>
                                            <th>모델</th>
                                            <td><input type="text" id="vfCarModelId" class="form-control input-sm" placeholder="CARM01"/></td>
                                        </tr>
                                        <tr>
                                            <th>VIN</th>
                                            <td><input type="text" id="vfVinNo" class="form-control input-sm" maxlength="17"/></td>
                                            <th>V2X</th>
                                            <td>
                                                <select id="vfV2xYn" class="form-control input-sm">
                                                    <option value="N" selected>N</option>
                                                    <option value="Y">Y</option>
                                                </select>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                    <div style="text-align:right;">
                                        <button id="btnVehicleSave" class="btn btn-primary btn-sm"><span>저장</span></button>
                                        <button id="btnVehicleCancel" class="btn btn-white btn-sm"><span>취소</span></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

        </div>
    </div>
</div>
<!-- Popup fragments included inline in Thymeleaf via fragments if needed -->
<script type="text/javascript" th:src="@{/resources/js/customer/customerVehicle.js(v=20260603001)}"></script>
<script th:inline="javascript">
    var customerId = /*[[${customerId}]]*/ '';
    jQuery(document).ready(function () {
        //
        customerJs.init();
        if (customerId && customerId !== '') {
            customerVehicleJs.init(customerId);
        }
    });
</script>
</body>
