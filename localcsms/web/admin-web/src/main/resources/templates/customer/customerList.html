<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    phoneDigit11: /*[[#{js.customer.phone.digit11}]]*/ '',
    phoneNumber: /*[[#{js.customer.phone.number}]]*/ '',
    cardDigit16: /*[[#{js.customer.card.digit16}]]*/ '',
    cardNumber: /*[[#{js.customer.card.number}]]*/ '',
    resident: /*[[#{js.customer.resident}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/customer/customerList.js(v=20230803001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:text="#{customer.list.title}"></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-8 m-b-xs">
                                    <div class="input-group" style="width: 100%;">
                                        <select name="order" id="order" class="form-control input-sm"
                                                style="max-width: 150px;">
                                            <option selected value="" th:text="#{common.label.all}"></option>
                                            <option value="01"><span th:text="#{common.label.signup.date}"></span> ↓</option>
                                            <option value="00"><span th:text="#{common.label.signup.date}"></span> ↑</option>
                                            <option value="11"><span th:text="#{customer.label.name}"></span> ↓</option>
                                            <option value="10"><span th:text="#{customer.label.name}"></span> ↑</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-sm-4 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select class="form-control input-sm" id="searchType" name="searchType">
                                                <option value="A" th:text="#{customer.label.id}"></option>
                                                <option value="B" selected th:text="#{customer.label.name}"></option>
                                                <option value="C" th:text="#{common.label.phone}"></option>
                                                <option value="D" th:text="#{customer.label.card.number}"></option>
                                            </select>
                                        </span>
                                        <input type="text" id=sWord th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch"
                                                    class="btn btn-sm btn-primary" th:text="#{common.btn.search}"></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset"
                                                    class="btn btn-sm btn-warning" th:text="#{common.btn.reset}"></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <!-- <a class="btn btn-default buttons-copy buttons-html5" id="saveExcelcs" tabindex="0" aria-controls="DataTables_Table_0"><span>엑셀다운로드</span></a> -->
                                    <a class="btn btn-default buttons-copy buttons-html5" id="btnForm" tabindex="0" aria-controls="DataTables_Table_0"><span th:text="#{common.btn.register}"></span></a>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x: auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{customer.label.name}"></th>
                                                <th th:text="#{customer.label.id}"></th>
                                                <th th:text="#{customer.label.card.number}"></th>
                                                <th th:text="#{customer.label.manage.code}"></th>
                                                <th th:text="#{customer.label.grade.code}"></th>
                                                <th th:text="#{customer.label.card.stop.yn}"></th>
                                                <th th:text="#{customer.label.card.tag.type}"></th>
                                                <th th:text="#{customer.label.parent.card.no}"></th>
                                                <th th:text="#{customer.label.delete.yn}"></th>
                                                <th th:text="#{common.label.phone}"></th>
                                                <th th:text="#{customer.label.car.info}"></th>
                                                <th th:text="#{customer.label.signup.type}"></th>
                                                <th th:text="#{common.label.signup.date}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList">
                                            </tbody>
                                            <tfoot>
                                            </tfoot>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers"
                                         id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        customerListJs.init();
    });
</script>
</html>
