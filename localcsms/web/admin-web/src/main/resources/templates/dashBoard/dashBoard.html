<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{common/header :: head}"></head>

<body class="pace-done mini-navbar">
	<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
	<script type="text/javascript" th:src="@{/resources/lib/js/plugins/monthpicker/monthpicker.js}"></script>
	<script>
		var _msg = {
			months: ( '1월,2월,3월,4월,5월,6월,7월,8월,9월,10월,11월,12월' ).split(','),
			dateRange30: '30일 이하 범위에서 날짜를 선택해주세요.',
			dateRangeReselect: '원하는 날짜 범위를 다시 입력해주세요.',
			dateAfter2020: '2020년 9월 이후 날짜를 선택해주세요.',
			dateAfter202008: '2020년 8월 이후 날짜를 선택해주세요.',
			dailyTotalChart: '일별 총 충전량/금액',
			monthlyTotalChart: '월별 총 충전량/금액',
			chAmountKwh: '충전량(kWh)',
			chCostWon: '충전금액(원)',
			totalChAmount: '총 충전량 (kWh)',
			totalChCost: '총 충전금액 (원)',
			won: '원',
			wonBracket: '(원)',
			kwhBracket: '(kWh)',
			casesBracket: '(건)'
		};
	</script>
	<script type="text/javascript" th:src="@{/resources/js/dashBoard/dashBoard.js(v=20260804001)}"></script>
	<!-- ChartJS-->
	<script type="text/javascript" th:src="@{/resources/lib/js/highcharts.js}"></script>
	<script type="text/javascript" th:src="@{/resources/lib/js/highcharts-3d.js}"></script>
	<script type="text/javascript" th:src="@{/resources/lib/js/exporting.js}"></script>

	<div id="wrapper">
		<div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
			<div class="wrapper wrapper-content">
				<div class="wrapper wrapper-content">
					<div class="row" style="margin-bottom: 25px;">
						<div class="col-lg-12">
							<div class="ibox float-e-margins">
								<div class="ibox-title">
									<h5><span>일별 총 충전량/금액</span></h5>
								</div>
								<div class="ibox-content">
									<div class="row">
										<div class="col-sm-3 m-b-xs">
											<div class="form-group">
												<div class="input-group date">
													<span class="input-group-addon"
														style="border: 0px;padding-left: 0px;font-weight: 700;"><span
															>범위</span> : &nbsp; </span>
													<div class="input-daterange input-group" id="datepicker">
														<input type="text" class="input-sm form-control" id="dayDate1"
															name="start" readonly>
														<span class="input-group-addon">to</span>
														<input type="text" class="input-sm form-control" id="dayDate2"
															name="end" readonly>
													</div>
													<span class="input-group-btn">
														<button type="button" id="btnDaySearch"
															class="btn btn-sm btn-primary"> <span
																>검색</span></button>
													</span>
												</div>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-lg-9">
											<div id="chart"></div>
										</div>
										<div class="col-lg-3">
											<ul class="stat-list">
												<li>
													<h2 class="no-margins" id="sumDayUseElecAmount"></h2>
													<small><span
															>기간 내 총 충전량</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%;" class="progress-bar"></div>
													</div>
												</li>
												<li>
													<h2 class="no-margins" id="sumDayPayCost"></h2>
													<small><span
															>기간 내 총 충전금액</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%;" class="progress-bar"></div>
													</div>
												</li>
												<li>
													<h2 class="no-margins " id="sumDayUseCount"></h2>
													<small><span
															>기간 내 총 충전횟수</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%;" class="progress-bar"></div>
													</div>
												</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="row">
						<div class="col-lg-12">
							<div class="ibox float-e-margins">
								<div class="ibox-title">
									<h5><span>월별 총 충전량/금액</span></h5>
								</div>
								<div class="ibox-content">
									<div class="row">
										<div class="col-sm-3 m-b-xs">
											<div class="form-group">
												<div class="input-group date">
													<span class="input-group-addon"
														style="border: 0px;padding-left: 0px;font-weight: 700;"><span
															>범위</span> : &nbsp; </span>
													<div class="input-daterange input-group" id="monthpicker">
														<input type="text" class="input-sm form-control" id="monthDate1"
															name="start" readonly>
														<span class="input-group-addon">to</span>
														<input type="text" class="input-sm form-control" id="monthDate2"
															name="end" readonly>
													</div>
													<span class="input-group-btn">
														<button type="button" id="btnMonthSearch"
															class="btn btn-sm btn-primary"> <span
																>검색</span></button>
													</span>
												</div>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-lg-9">
											<div id="chart2"></div>
										</div>
										<div class="col-lg-3">
											<ul class="stat-list">
												<li>
													<h2 class="no-margins" id="sumMonthUseElecAmount"></h2>
													<small><span
															>기간 내 총 충전량</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%; background-color: #6a5acd"
															class="progress-bar"></div>
													</div>
												</li>
												<li>
													<h2 class="no-margins" id="sumMonthPayCost"></h2>
													<small><span
															>기간 내 총 충전금액</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%; background-color: #6a5acd"
															class="progress-bar"></div>
													</div>
												</li>
												<li>
													<h2 class="no-margins " id="sumMonthUseCount"></h2>
													<small><span
															>기간 내 총 충전횟수</span></small>
													<div class="progress progress-mini">
														<div style="width: 100%; background-color: #6a5acd"
															class="progress-bar"></div>
													</div>
												</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>
	</div>
</body>
<script type="text/javascript">
	jQuery(document).ready(function () {
		//
		dashBoardJs.init();
	});
</script>

</html>
