<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    eventMgmt:   /*[[#{js.der.event.mgmt}]]*/ '',
    startedAll:  /*[[#{js.der.event.started.all}]]*/ '',
    startedY:    /*[[#{js.der.event.started.y}]]*/ '',
    startedN:    /*[[#{js.der.event.started.n}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/derctrl/derStartStopList.js(v=20260526001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{der.event.list.title}"></span></h5>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2"><input type="text" id="fCpId" class="form-control input-sm" placeholder="cpId"></div>
                                <div class="col-sm-2"><input type="text" id="fCsId" class="form-control input-sm" placeholder="csId"></div>
                                <div class="col-sm-3"><input type="text" id="fControlId" class="form-control input-sm" placeholder="controlId"></div>
                                <div class="col-sm-2"><select class="input-sm form-control input-s-sm inline" id="startedYn"></select></div>
                                <div class="col-sm-3" style="text-align:right;">
                                    <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                    <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                </div>
                            </div>
                            <div style="padding-top:15px;"><label id="totalCount"></label></div>
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered" style="text-align:center; white-space:nowrap;">
                                    <thead>
                                    <tr>
                                        <th th:text="#{common.label.no}"></th>
                                        <th>SEQ</th>
                                        <th>CP/CS</th>
                                        <th>controlId</th>
                                        <th>started</th>
                                        <th>timestamp</th>
                                        <th>receivedDt</th>
                                    </tr>
                                    </thead>
                                    <tbody id="tBodyList"></tbody>
                                </table>
                                <div class="dataTables_paginate paging_simple_numbers">
                                    <ul class="pagination" id="pagingUl"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        derStartStopListJs.init();
    });
</script>
</body>
</html>
