<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _msg = {
    ocppLog: /*[[#{js.ocpp.log}]]*/ '',
    enterSearch: /*[[#{js.ocpp.enterSearch}]]*/ '',
    idFormat: /*[[#{js.ocpp.idFormat}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/ocpp/ocppLog.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{ocpp.log.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"> <i class="fa fa-chevron-up"></i></a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#"></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{system.access.log.date.label}"></span></span>
                                        <div class="input-daterange input-group" id="datepicker">
                                            <input type="text" class="input-sm form-control" id="date1"
                                                   name="start" style="max-width: 150px;" readonly>
                                        </div>
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{common.label.area}"></span></span>
                                        <div class="input-daterange input-group">
                                            <select name="regionId" id="regionId" class="form-control input-sm">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{common.label.content.count}"></span></span>
                                        <span class="input-group-btn" style="width: 70px;">
											<select class="input-sm form-control input-s-sm inline" id="pagingNum"
                                                    name="pagingNum">
												<option value="20" selected>20</option>
												<option value="30">30</option>
												<option value="40">40</option>
											</select>
										</span>
                                        <span class="input-group-btn" style="width: 120px;">
											<select class="input-sm form-control input-s-sm inline" id="searchType"
                                                    name="sType">
												<option value="CHAID"><span th:text="#{charger.station.charger.id}"></span></option>
											</select>
										</span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm"
                                               style="width: calc(100% - 80px);">
                                        <select class="input-sm form-control input-s-sm inline" id="csCableChn" style="width: 80px;">
                                            <option value=""><span th:text="#{common.label.all}"></span></option>
                                            <option value="CH1">CH1</option>
                                            <option value="CH2">CH2</option>
                                        </select>
                                        <span class="input-group-btn">
											<button type="button" id="btnSearch"
                                                    class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
										</span>
                                        <span class="input-group-btn">
											<button type="button" id="btnReset"
                                                    class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
										</span>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
                                        <thead>
                                        <tr>
                                            <th><span th:text="#{common.label.no}"></span></th>
                                            <th><span th:text="#{ocpp.label.message.id}"></span></th>
                                            <th><span th:text="#{charger.station.id}"></span></th>
                                            <th><span th:text="#{charger.station.charger.id}"></span></th>
                                            <th><span th:text="#{charger.status.info.channel}"></span></th>
                                            <th><span th:text="#{ocpp.label.communication.direction}"></span></th>
                                            <th><span th:text="#{ocpp.label.message.type}"></span></th>
                                            <th><span th:text="#{ocpp.label.version}"></span></th>
                                            <th><span th:text="#{ocpp.label.action}"></span></th>
                                            <th><span th:text="#{ocpp.label.payload}"></span></th>
                                            <th><span th:text="#{ocpp.label.receive.time}"></span></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList">
                                        <tr style="text-align:center;">
                                            <td colspan="10"><span th:text="#{ocpp.message.search.instruction}"></span></td>
                                        </tr>
                                        </tbody>
                                        <tfoot>
                                        </tfoot>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers"
                                         id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    var pageInfo2Js;
    jQuery(document).ready(function () {
        //
        pageInfo2Js = new PageInfo2Js();
        ocppLogJs.init();
    });
</script>
</html>
