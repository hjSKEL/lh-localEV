<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/js/organization/employee/employeeList.js(v=20230802001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:text="#{org.employee.list.title}"></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-8 m-b-xs">
                                </div>
                                <div class="col-sm-4 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select class="form-control input-sm" id="searchType" name="sType">
                                                <option value="EMPLOYEE_NAME" selected="" th:text="#{org.employee.label.name}"></option>
                                                <option value="COMPANY_NAME" th:text="#{org.employee.label.company}"></option>
                                            </select>
                                        </span>
                                        <input type="text" id=sWord th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch"
                                                    class="btn btn-sm btn-primary" th:text="#{common.btn.search}"></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset"
                                                    class="btn btn-sm btn-warning" th:text="#{common.btn.reset}"></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <a class="btn btn-default buttons-copy buttons-html5" id="btnForm" tabindex="0"
                                       aria-controls="DataTables_Table_0"><span th:text="#{common.btn.register}"></span></a>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x: auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th th:text="#{common.label.no}"></th>
                                                <th th:text="#{org.employee.label.name}"></th>
                                                <th th:text="#{org.employee.label.company}"></th>
                                                <th th:text="#{common.label.login.id}"></th>
                                                <th th:text="#{common.label.phone}"></th>
                                                <th th:text="#{org.employee.label.main.role}"></th>
                                                <th th:text="#{org.employee.label.status}"></th>
                                                <th th:text="#{common.label.signup.date}"></th>
                                                <th th:text="#{org.employee.label.last.login.date}"></th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList">
                                            </tbody>
                                            <tfoot>
                                            </tfoot>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers"
                                         id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script th:inline="javascript">
var _msg = {
    statusNormal: /*[[#{js.employeeList.statusNormal}]]*/ '',
    statusLocked: /*[[#{js.employeeList.statusLocked}]]*/ '',
    statusResigned: /*[[#{js.employeeList.statusResigned}]]*/ ''
};
</script>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        employeeListJs.init();
    });
</script>
</html>
