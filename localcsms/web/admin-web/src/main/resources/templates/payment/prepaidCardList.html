<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _msg = {
    prepaidCardMgmt:     /*[[#{js.prepaid.card.mgmt}]]*/ '',
    cardNumber:          /*[[#{js.prepaid.card.number}]]*/ '',
    cardStatusAll:       /*[[#{js.prepaid.card.status.all}]]*/ '',
    cardStatActive:      /*[[#{js.prepaid.card.stat.active}]]*/ '',
    cardStatStopped:     /*[[#{js.prepaid.card.stat.stopped}]]*/ '',
    cardStatExpired:     /*[[#{js.prepaid.card.stat.expired}]]*/ '',
    typeIssue:           /*[[#{js.prepaid.card.type.issue}]]*/ '',
    typeUse:             /*[[#{js.prepaid.card.type.use}]]*/ '',
    inputCardNo:         /*[[#{js.prepaid.card.input.cardno}]]*/ '',
    inputBalance:        /*[[#{js.prepaid.card.input.balance}]]*/ '',
    inputCustomer:       /*[[#{js.prepaid.card.input.customer}]]*/ '',
    confirmIssue:        /*[[#{js.prepaid.card.confirm.issue}]]*/ '',
    confirmStop:         /*[[#{js.prepaid.card.confirm.stop}]]*/ '',
    confirmResume:       /*[[#{js.prepaid.card.confirm.resume}]]*/ '',
    successIssue:        /*[[#{js.prepaid.card.success.issue}]]*/ '',
    failIssue:           /*[[#{js.prepaid.card.fail.issue}]]*/ '',
    duplicateCardNo:     /*[[#{js.prepaid.card.duplicate.cardno}]]*/ '',
    btnTopUp:            /*[[#{js.prepaid.card.btn.topup}]]*/ '',
    inputTopUpAmount:    /*[[#{js.prepaid.card.input.topup.amount}]]*/ '',
    confirmTopUp:        /*[[#{js.prepaid.card.confirm.topup}]]*/ '',
    successTopUp:        /*[[#{js.prepaid.card.success.topup}]]*/ '',
    failTopUp:           /*[[#{js.prepaid.card.fail.topup}]]*/ '',
    topUpNotActive:      /*[[#{js.prepaid.card.topup.not.active}]]*/ '',
    btnCancel:           /*[[#{js.prepaid.card.btn.cancel}]]*/ '',
    confirmCancel:       /*[[#{js.prepaid.card.confirm.cancel}]]*/ '',
    successCancel:       /*[[#{js.prepaid.card.success.cancel}]]*/ '',
    failCancel:          /*[[#{js.prepaid.card.fail.cancel}]]*/ '',
    confirm:             /*[[#{common.btn.confirm}]]*/ '',
    cancel:              /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/prepaidCardList.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{prepaid.card.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" style="width:30%" id="status"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:20%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="CARDNO" selected><span th:text="#{prepaid.card.label.card.no}"></span></option>
                                                <option value="CUSTOMER_ID"><span th:text="#{customer.label.id}"></span></option>
                                                <option value="CUSTOMER_NAME"><span th:text="#{customer.label.name}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnIssueCard" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span th:text="#{prepaid.card.btn.issue}"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{prepaid.card.label.card.no}"></th>
                                            <th th:text="#{customer.label.id}"></th>
                                            <th th:text="#{customer.label.name}"></th>
                                            <th th:text="#{prepaid.card.label.card.status}"></th>
                                            <th th:text="#{prepaid.card.label.balance}"></th>
                                            <th th:text="#{prepaid.card.label.expire.date}"></th>
                                            <th th:text="#{prepaid.card.label.register.date}"></th>
                                            <th th:text="#{prepaid.card.label.action}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 발급 모달 -->
<div class="modal inmodal fade" id="Popup_PrepaidCard_Issue" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{prepaid.card.popup.issue.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:30%;"><span th:text="#{prepaid.card.label.card.no}"></span> *</th>
                        <td><input type="text" id="issue_cardNo" class="form-control input-sm" maxlength="20"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{customer.label.name}"></span> *</th>
                        <td>
                            <div class="input-group">
                                <input type="text" id="issue_customerName" class="form-control input-sm" readonly>
                                <input type="hidden" id="issue_customerId">
                                <span class="input-group-btn">
                                    <button type="button" id="btnSelectCustomer" class="btn btn-sm btn-primary"><span th:text="#{common.btn.select}"></span></button>
                                </span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th><span th:text="#{prepaid.card.label.expire.date}"></span></th>
                        <td><input type="text" id="issue_expireDate" class="form-control input-sm" readonly></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{prepaid.card.label.init.balance}"></span></th>
                        <td><input type="number" id="issue_balance" class="form-control input-sm" min="0" value="0"></td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnIssueSave"><span th:text="#{common.btn.register}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<!-- 충전 모달 -->
<div class="modal inmodal fade" id="Popup_PrepaidCard_TopUp" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{prepaid.card.popup.topup.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:35%;"><span th:text="#{prepaid.card.label.card.no}"></span></th>
                        <td><input type="text" id="topup_cardNo" class="form-control input-sm" readonly></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{customer.label.name}"></span></th>
                        <td><input type="text" id="topup_customerName" class="form-control input-sm" readonly></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{prepaid.card.label.current.balance}"></span></th>
                        <td><input type="text" id="topup_currentBalance" class="form-control input-sm" readonly style="text-align:right;"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{prepaid.card.label.topup.amount}"></span> *</th>
                        <td>
                            <input type="number" id="topup_amount" class="form-control input-sm" min="1" step="100" value="0" style="text-align:right;">
                            <div style="padding-top:6px;">
                                <button type="button" class="btn btn-xs btn-white topup-quick" data-amt="10000">+1만</button>
                                <button type="button" class="btn btn-xs btn-white topup-quick" data-amt="30000">+3만</button>
                                <button type="button" class="btn btn-xs btn-white topup-quick" data-amt="50000">+5만</button>
                                <button type="button" class="btn btn-xs btn-white topup-quick" data-amt="100000">+10만</button>
                                <button type="button" class="btn btn-xs btn-default" id="btnTopUpReset">초기화</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th><span th:text="#{prepaid.card.label.after.balance}"></span></th>
                        <td><input type="text" id="topup_afterBalance" class="form-control input-sm" readonly style="text-align:right;"></td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnTopUpSave"><span th:text="#{prepaid.card.btn.topup}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/popup/customer :: popup}"></div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        prepaidCardListJs.init();
    });
</script>
</body>
</html>
