<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    pspMgmt:           /*[[#{js.psp.mgmt}]]*/ '',
    pspRefLabel:       /*[[#{js.psp.ref}]]*/ '',
    statusAll:         /*[[#{js.psp.status.all}]]*/ '',
    statusAuthorized:  /*[[#{js.psp.status.authorized}]]*/ '',
    statusStarted:     /*[[#{js.psp.status.started}]]*/ '',
    statusSettled:     /*[[#{js.psp.status.settled}]]*/ '',
    statusCanceled:    /*[[#{js.psp.status.canceled}]]*/ '',
    providerAll:       /*[[#{js.psp.provider.all}]]*/ '',
    inputAuthAmount:   /*[[#{js.psp.input.authAmount}]]*/ '',
    inputCpCs:         /*[[#{js.psp.input.cpcs}]]*/ '',
    inputSettledAmount:/*[[#{js.psp.input.settledAmount}]]*/ '',
    confirmRegister:   /*[[#{js.psp.confirm.register}]]*/ '',
    confirmSettle:     /*[[#{js.psp.confirm.settle}]]*/ '',
    confirmCancel:     /*[[#{js.psp.confirm.cancel}]]*/ '',
    successRegister:   /*[[#{js.psp.success.register}]]*/ '',
    successSettle:     /*[[#{js.psp.success.settle}]]*/ '',
    successCancel:     /*[[#{js.psp.success.cancel}]]*/ '',
    failRegister:      /*[[#{js.psp.fail.register}]]*/ '',
    failSettle:        /*[[#{js.psp.fail.settle}]]*/ '',
    failCancel:        /*[[#{js.psp.fail.cancel}]]*/ '',
    btnView:           /*[[#{js.psp.btn.view}]]*/ '',
    btnSettle:         /*[[#{js.psp.btn.settle}]]*/ '',
    btnCancel:         /*[[#{js.psp.btn.cancel}]]*/ '',
    btnHistory:        /*[[#{js.psp.btn.history}]]*/ '',
    confirm:           /*[[#{common.btn.confirm}]]*/ '',
    cancel:            /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/pspPaymentList.js(v=20260525001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{psp.list.title}"></span></h5>
                            <div class="ibox-tools"><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="statusCd"></select>
                                </div>
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="pspProvider"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:25%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="PSP_REF" selected><span th:text="#{psp.label.ref}"></span></option>
                                                <option value="RC_ID"><span th:text="#{psp.label.rc.id}"></span></option>
                                                <option value="CARD_LAST4"><span th:text="#{psp.label.card.last4}"></span></option>
                                                <option value="CS_ID"><span th:text="#{psp.label.cs.id}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 8px;">
                                <div class="col-sm-3"><input type="text" id="fromDate" class="form-control input-sm" placeholder="From (yyyy-MM-dd)"></div>
                                <div class="col-sm-3"><input type="text" id="toDate"   class="form-control input-sm" placeholder="To (yyyy-MM-dd)"></div>
                                <div class="col-sm-6"></div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnRegister" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span th:text="#{psp.btn.register}"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{psp.label.ref}"></th>
                                            <th th:text="#{psp.label.status}"></th>
                                            <th th:text="#{psp.label.provider}"></th>
                                            <th th:text="#{psp.label.cp.id}"></th>
                                            <th th:text="#{psp.label.cs.id}"></th>
                                            <th th:text="#{psp.label.card.last4}"></th>
                                            <th th:text="#{psp.label.auth.amount}"></th>
                                            <th th:text="#{psp.label.settled.amount}"></th>
                                            <th th:text="#{psp.label.auth.date}"></th>
                                            <th th:text="#{psp.label.rc.id}"></th>
                                            <th th:text="#{psp.label.action}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 등록 모달 -->
<div class="modal inmodal fade" id="Popup_Psp_Register" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{psp.register.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:20%;"><span th:text="#{psp.label.ref}"></span></th>
                        <td><input type="text" id="form_pspRef" class="form-control input-sm" maxlength="36" placeholder="(자동 생성)" readonly></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.provider}"></span></th>
                        <td>
                            <select id="form_pspProvider" class="form-control input-sm">
                                <option value="TOSS">TOSS</option>
                                <option value="NICE">NICE</option>
                                <option value="KICC">KICC</option>
                                <option value="INICIS">INICIS</option>
                                <option value="KCP">KCP</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.cp.id}"></span> *</th>
                        <td><input type="text" id="form_cpId" class="form-control input-sm" maxlength="20"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.cs.id}"></span> *</th>
                        <td><input type="text" id="form_csId" class="form-control input-sm" maxlength="20"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.evse.id}"></span></th>
                        <td><input type="number" id="form_evseId" class="form-control input-sm" min="1"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.card.bin}"></span></th>
                        <td><input type="text" id="form_cardBin" class="form-control input-sm" maxlength="20"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.card.last4}"></span></th>
                        <td><input type="text" id="form_cardLast4" class="form-control input-sm" maxlength="4"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.cardholder}"></span></th>
                        <td><input type="text" id="form_cardholderNm" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.auth.amount}"></span> *</th>
                        <td><input type="number" id="form_authAmount" class="form-control input-sm" step="0.01" min="0"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.max.cost}"></span></th>
                        <td>
                            <input type="number" id="form_maxCost" class="form-control input-sm" step="0.01" min="0">
                            <small class="text-muted">카드 결제(C18/C24) 시 금액 한도. 비워두면 미설정.</small>
                        </td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.max.energy}"></span></th>
                        <td>
                            <input type="number" id="form_maxEnergy" class="form-control input-sm" step="0.001" min="0"
                                   placeholder="Wh (예: 20000 = 20 kWh)">
                            <small class="text-muted">QR 결제(C25) 시 에너지 한도. 비워두면 미설정.</small>
                        </td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.currency}"></span></th>
                        <td><input type="text" id="form_currency" class="form-control input-sm" maxlength="3" value="KRW"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.extra.info}"></span></th>
                        <td><textarea id="form_extraInfo" class="form-control input-sm" rows="2" placeholder='{"key":"value"}'></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSave"><span th:text="#{common.btn.save}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<!-- 정산 모달 -->
<div class="modal inmodal fade" id="Popup_Psp_Settle" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{psp.settle.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr><th style="width:30%;"><span th:text="#{psp.label.ref}"></span></th><td id="settle_pspRef"></td></tr>
                    <tr><th><span th:text="#{psp.label.auth.amount}"></span></th><td id="settle_authAmount"></td></tr>
                    <tr>
                        <th><span th:text="#{psp.label.settled.amount}"></span> *</th>
                        <td><input type="number" id="settle_settledAmount" class="form-control input-sm" step="0.01" min="0"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.receipt.url}"></span></th>
                        <td><input type="text" id="settle_receiptUrl" class="form-control input-sm" maxlength="500"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.receipt.id}"></span></th>
                        <td><input type="text" id="settle_receiptId" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSettleSave"><span th:text="#{common.btn.confirm}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<!-- 취소 모달 -->
<div class="modal inmodal fade" id="Popup_Psp_Cancel" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{psp.cancel.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr><th style="width:30%;"><span th:text="#{psp.label.ref}"></span></th><td id="cancel_pspRef"></td></tr>
                    <tr>
                        <th><span th:text="#{psp.label.reason.cd}"></span></th>
                        <td><input type="text" id="cancel_reasonCd" class="form-control input-sm" maxlength="20" placeholder="USER_REQUEST"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{psp.label.remark}"></span></th>
                        <td><textarea id="cancel_remark" class="form-control input-sm" rows="2"></textarea></td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="btnCancelSave"><span th:text="#{common.btn.confirm}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<!-- 상세 + 이력 모달 -->
<div class="modal inmodal fade" id="Popup_Psp_Detail" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{psp.detail.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tbody id="detailBody"></tbody>
                </table>
                <h4 style="margin-top:14px;"><span th:text="#{psp.label.history}"></span></h4>
                <div class="table-responsive">
                    <table class="table table-bordered" style="background-color: white; text-align:center;">
                        <thead>
                        <tr>
                            <th th:text="#{psp.his.label.occurred}"></th>
                            <th th:text="#{psp.his.label.pre}"></th>
                            <th th:text="#{psp.his.label.post}"></th>
                            <th th:text="#{psp.his.label.amount}"></th>
                            <th th:text="#{psp.his.label.reason}"></th>
                            <th th:text="#{psp.his.label.remark}"></th>
                            <th th:text="#{psp.his.label.oper}"></th>
                        </tr>
                        </thead>
                        <tbody id="hisBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        pspPaymentListJs.init();
    });
</script>
</body>
</html>
