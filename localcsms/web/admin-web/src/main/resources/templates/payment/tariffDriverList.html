<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script>
var _msg = {
    driverMgmt:        '운전자 요금 매핑',
    statusAll:         '상태 전체',
    statusActive:      'ACTIVE',
    statusReplaced:    'REPLACED',
    statusCleared:     'CLEARED',
    inputCustomerId:   'customerId 를 입력해주세요.',
    inputTariffId:     'tariffId 를 입력해주세요.',
    confirmAssign:     '입력한 customerId 에 매핑하시겠습니까?',
    confirmClear:      '이 운전자의 매핑을 해제하시겠습니까?',
    successAssign:     '운전자 매핑이 등록되었습니다.',
    successClear:      '운전자 매핑이 해제되었습니다.',
    failAssign:        '운전자 매핑 등록에 실패하였습니다.',
    failClear:         '운전자 매핑 해제에 실패하였습니다.',
    btnClear:          '해제',
    confirm:           '확인',
    cancel:            '취소'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/tariffDriverList.js(v=20260525001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>운전자 요금 매핑</span></h5>
                            <div class="ibox-tools"><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="statusCd"></select>
                                </div>
                                <div class="col-sm-9">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:25%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="CUSTOMER_ID" selected>customerId</option>
                                                <option value="TARIFF_ID">tariffId</option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span>검색</span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span>초기화</span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnAssign" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span>운전자 매핑</span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th>번호</th>
                                            <th>SEQ</th>
                                            <th>customerId</th>
                                            <th>tariffId</th>
                                            <th>통화</th>
                                            <th>유효 시작</th>
                                            <th>상태</th>
                                            <th>관리</th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 매핑 등록 모달 -->
<div class="modal inmodal fade" id="Popup_Driver_Assign" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span>운전자 요금 매핑 등록</span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:30%;"><span>customerId</span> *</th>
                        <td><input type="text" id="form_customerId" class="form-control input-sm" maxlength="9" placeholder="예: C00010041 (TB_CUCU001.CUT_ID)"></td>
                    </tr>
                    <tr>
                        <th><span>tariffId</span> *</th>
                        <td>
                            <input type="text" id="form_tariffId" class="form-control input-sm" maxlength="60" placeholder="T-DRIVER-... (자동완성)">
                            <small class="text-muted">DRIVER 또는 ADHOC 종류의 ACTIVE Tariff 만 가능</small>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSave"><span>저장</span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span>닫기</span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        tariffDriverListJs.init();
    });
</script>
</body>
</html>
