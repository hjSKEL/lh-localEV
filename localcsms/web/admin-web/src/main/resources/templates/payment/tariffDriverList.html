<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    driverMgmt:        /*[[#{js.tariff.driver.mgmt}]]*/ '',
    statusAll:         /*[[#{js.tariff.status.all}]]*/ '',
    statusActive:      /*[[#{js.tariff.status.active}]]*/ '',
    statusReplaced:    /*[[#{js.tariff.status.replaced}]]*/ '',
    statusCleared:     /*[[#{js.tariff.status.cleared}]]*/ '',
    inputCustomerId:   /*[[#{js.tariff.driver.input.customerId}]]*/ '',
    inputTariffId:     /*[[#{js.tariff.driver.input.tariffId}]]*/ '',
    confirmAssign:     /*[[#{js.tariff.driver.confirm.assign}]]*/ '',
    confirmClear:      /*[[#{js.tariff.driver.confirm.clear}]]*/ '',
    successAssign:     /*[[#{js.tariff.driver.success.assign}]]*/ '',
    successClear:      /*[[#{js.tariff.driver.success.clear}]]*/ '',
    failAssign:        /*[[#{js.tariff.driver.fail.assign}]]*/ '',
    failClear:         /*[[#{js.tariff.driver.fail.clear}]]*/ '',
    btnClear:          /*[[#{js.tariff.driver.btn.clear}]]*/ '',
    confirm:           /*[[#{common.btn.confirm}]]*/ '',
    cancel:            /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/tariffDriverList.js(v=20260525001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{tariff.driver.list.title}"></span></h5>
                            <div class="ibox-tools"><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="statusCd"></select>
                                </div>
                                <div class="col-sm-9">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:25%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="CUSTOMER_ID" selected>customerId</option>
                                                <option value="TARIFF_ID">tariffId</option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnAssign" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span th:text="#{tariff.driver.btn.assign}"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{tariff.driver.label.seq}"></th>
                                            <th th:text="#{tariff.driver.label.customerId}"></th>
                                            <th th:text="#{tariff.driver.label.tariffId}"></th>
                                            <th th:text="#{tariff.label.currency}"></th>
                                            <th th:text="#{tariff.driver.label.validFrom}"></th>
                                            <th th:text="#{tariff.driver.label.status}"></th>
                                            <th th:text="#{tariff.label.action}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 매핑 등록 모달 -->
<div class="modal inmodal fade" id="Popup_Driver_Assign" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span th:text="#{tariff.driver.assign.title}"></span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:30%;"><span th:text="#{tariff.driver.label.customerId}"></span> *</th>
                        <td><input type="text" id="form_customerId" class="form-control input-sm" maxlength="9" placeholder="예: C00010041 (TB_CUCU001.CUT_ID)"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{tariff.driver.label.tariffId}"></span> *</th>
                        <td>
                            <input type="text" id="form_tariffId" class="form-control input-sm" maxlength="60" placeholder="T-DRIVER-... (자동완성)">
                            <small class="text-muted">DRIVER 또는 ADHOC 종류의 ACTIVE Tariff 만 가능</small>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSave"><span th:text="#{common.btn.save}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        tariffDriverListJs.init();
    });
</script>
</body>
</html>
