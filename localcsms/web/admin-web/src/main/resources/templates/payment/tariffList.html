<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script>
var _msg = {
    tariffMgmt:        '요금표 관리',
    kindAll:           '종류 전체',
    kindDefault:       'DEFAULT',
    kindDriver:        'DRIVER',
    kindAdhoc:         'ADHOC',
    statusAll:         '상태 전체',
    statusActive:      'ACTIVE',
    statusReplaced:    'REPLACED',
    statusCleared:     'CLEARED',
    statusExpired:     'EXPIRED',
    inputCurrency:     '통화(currency) 를 입력해주세요.',
    inputJson:         'Tariff JSON 을 입력해주세요.',
    invalidJson:       'JSON 형식 오류',
    confirmDeprecate:  '선택한 요금표를 폐기(REPLACED) 하시겠습니까?',
    successRegister:   '요금표가 등록되었습니다.',
    successDeprecate:  '요금표가 폐기되었습니다.',
    failRegister:      '요금표 등록에 실패하였습니다.',
    failDeprecate:     '요금표 폐기에 실패하였습니다.',
    btnView:           '상세',
    btnDeprecate:      '폐기',
    confirm:           '확인',
    cancel:            '취소'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/tariffList.js(v=20260525001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>요금표 목록</span></h5>
                            <div class="ibox-tools"><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="tariffKind"></select>
                                </div>
                                <div class="col-sm-3 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" id="statusCd"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <input type="text" id="sWord" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span>검색</span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span>초기화</span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnRegister" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span>요금표 등록</span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th>번호</th>
                                            <th>tariffId</th>
                                            <th>종류</th>
                                            <th>통화</th>
                                            <th>유효 시작</th>
                                            <th>상태</th>
                                            <th>활성 매핑</th>
                                            <th>설명</th>
                                            <th>관리</th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 등록 모달 -->
<div class="modal inmodal fade" id="Popup_Tariff_Register" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span>요금표 등록</span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:20%;"><span>tariffId</span></th>
                        <td><input type="text" id="form_tariffId" class="form-control input-sm" maxlength="60" placeholder="(자동 생성)" readonly></td>
                    </tr>
                    <tr>
                        <th><span>종류</span> *</th>
                        <td>
                            <select id="form_tariffKind" class="form-control input-sm">
                                <option value="DEFAULT">DEFAULT (EVSE 기본 요금)</option>
                                <option value="DRIVER">DRIVER (운전자별 요금)</option>
                                <option value="ADHOC">ADHOC (1회성)</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th><span>통화</span> *</th>
                        <td><input type="text" id="form_currency" class="form-control input-sm" maxlength="3" value="EUR"></td>
                    </tr>
                    <tr>
                        <th><span>유효 시작</span></th>
                        <td><input type="text" id="form_validFrom" class="form-control input-sm" placeholder="yyyy-MM-ddTHH:mm:ssZ (비우면 즉시)"></td>
                    </tr>
                    <tr>
                        <th><span>설명</span></th>
                        <td><input type="text" id="form_description" class="form-control input-sm" maxlength="500"></td>
                    </tr>
                    <tr>
                        <th><span>Tariff JSON</span> *</th>
                        <td>
                            <textarea id="form_tariffJson" class="form-control input-sm" rows="12"
                                placeholder='{"energy":{"prices":[{"priceKwh":0.25}],"taxRates":[{"type":"VAT","tax":20}]}, "idleTime":{"prices":[{"priceMinute":0.10}],"taxRates":[{"type":"VAT","tax":20}]}, "fixedFee":{"prices":[{"priceFixed":0.50}],"taxRates":[{"type":"VAT","tax":20}]}}'></textarea>
                            <small class="text-muted">OCPP TariffType 의 가격/세금 구조 (tariffId / currency / validFrom 제외). 샘플 버튼 참고.</small>
                            <div style="padding-top: 6px;">
                                <button type="button" class="btn btn-xs btn-white" id="btnSample1">샘플: Driver (energy+idle+fixed)</button>
                                <button type="button" class="btn btn-xs btn-white" id="btnSample2">샘플: Default Full (VAT 20%)</button>
                                <button type="button" class="btn btn-xs btn-white" id="btnValidate">JSON 검증</button>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSave"><span>저장</span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span>닫기</span></button>
            </div>
        </div>
    </div>
</div>

<!-- 상세 모달 -->
<div class="modal inmodal fade" id="Popup_Tariff_Detail" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title"><span>요금표 상세</span></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tbody id="detailBody"></tbody>
                </table>
                <h4 style="margin-top:14px;"><span>Tariff JSON</span></h4>
                <pre id="detailJson" style="max-height:300px; overflow:auto; background:#f5f5f5; padding:10px; border-radius:4px;"></pre>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span>닫기</span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        tariffListJs.init();
    });
</script>
</body>
</html>
