<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _msg = {
    vatMgmt:           /*[[#{js.vat.mgmt}]]*/ '',
    vatNoLabel:        /*[[#{js.vat.no}]]*/ '',
    companyLabel:      /*[[#{js.vat.company}]]*/ '',
    useAll:            /*[[#{js.vat.use.all}]]*/ '',
    useY:              /*[[#{js.vat.use.y}]]*/ '',
    useN:              /*[[#{js.vat.use.n}]]*/ '',
    inputVatNo:        /*[[#{js.vat.input.vatno}]]*/ '',
    inputCompany:      /*[[#{js.vat.input.company}]]*/ '',
    inputAddr1:        /*[[#{js.vat.input.addr1}]]*/ '',
    inputCity:         /*[[#{js.vat.input.city}]]*/ '',
    confirmRegister:   /*[[#{js.vat.confirm.register}]]*/ '',
    confirmModify:     /*[[#{js.vat.confirm.modify}]]*/ '',
    confirmActivate:   /*[[#{js.vat.confirm.activate}]]*/ '',
    confirmDeactivate: /*[[#{js.vat.confirm.deactivate}]]*/ '',
    successRegister:   /*[[#{js.vat.success.register}]]*/ '',
    successModify:     /*[[#{js.vat.success.modify}]]*/ '',
    successChange:     /*[[#{js.vat.success.change}]]*/ '',
    failRegister:      /*[[#{js.vat.fail.register}]]*/ '',
    failModify:        /*[[#{js.vat.fail.modify}]]*/ '',
    failChange:        /*[[#{js.vat.fail.change}]]*/ '',
    duplicateVatNo:    /*[[#{js.vat.duplicate.vatno}]]*/ '',
    btnEdit:           /*[[#{js.vat.btn.edit}]]*/ '',
    confirm:           /*[[#{common.btn.confirm}]]*/ '',
    cancel:            /*[[#{common.btn.cancel}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/payment/vatList.js(v=20260524001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{vat.list.title}"></span></h5>
                            <div class="ibox-tools"><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <select class="input-sm form-control input-s-sm inline" style="width:30%" id="useYn"></select>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:20%">
                                            <select class="input-sm form-control input-s-sm inline" id="searchType">
                                                <option value="VATNO" selected><span th:text="#{vat.label.vat.no}"></span></option>
                                                <option value="COMPANY"><span th:text="#{vat.label.company}"></span></option>
                                            </select>
                                        </span>
                                        <input type="text" id="sWord" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align: right;">
                                    <button type="button" id="btnRegister" class="btn btn-sm btn-primary">
                                        <i class="fa fa-plus"></i> <span th:text="#{vat.btn.register}"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{vat.label.vat.no}"></th>
                                            <th th:text="#{vat.label.company}"></th>
                                            <th th:text="#{vat.label.rep}"></th>
                                            <th th:text="#{vat.label.address}"></th>
                                            <th th:text="#{vat.label.country}"></th>
                                            <th th:text="#{vat.label.use}"></th>
                                            <th th:text="#{vat.label.register.date}"></th>
                                            <th th:text="#{vat.label.action}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList"></tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal inmodal fade" id="Popup_Vat_Edit" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="popupTitle"></h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="background-color: white;">
                    <tr>
                        <th style="width:20%;"><span th:text="#{vat.label.vat.no}"></span> *</th>
                        <td><input type="text" id="form_vatNo" class="form-control input-sm" maxlength="20" placeholder="000-00-00000"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.company}"></span> *</th>
                        <td><input type="text" id="form_companyNm" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.rep}"></span></th>
                        <td><input type="text" id="form_repNm" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.address1}"></span> *</th>
                        <td><input type="text" id="form_addr1" class="form-control input-sm" maxlength="100"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.address2}"></span></th>
                        <td><input type="text" id="form_addr2" class="form-control input-sm" maxlength="100"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.city}"></span> *</th>
                        <td><input type="text" id="form_city" class="form-control input-sm" maxlength="100"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.postal.code}"></span></th>
                        <td><input type="text" id="form_postalCd" class="form-control input-sm" maxlength="20"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.country}"></span></th>
                        <td><input type="text" id="form_country" class="form-control input-sm" maxlength="50" value="KR"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.biz.type}"></span></th>
                        <td><input type="text" id="form_bizType" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.biz.item}"></span></th>
                        <td><input type="text" id="form_bizItem" class="form-control input-sm" maxlength="50"></td>
                    </tr>
                    <tr>
                        <th><span th:text="#{vat.label.use}"></span></th>
                        <td>
                            <select id="form_useYn" class="form-control input-sm">
                                <option value="Y">Y</option>
                                <option value="N">N</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSave"><span th:text="#{common.btn.save}"></span></button>
                <button type="button" class="btn btn-white" data-dismiss="modal"><span th:text="#{common.btn.close}"></span></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        vatListJs.init();
    });
</script>
</body>
</html>
