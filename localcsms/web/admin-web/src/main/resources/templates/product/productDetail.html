<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script type="text/javascript" th:src="@{/resources/js/product/productDetail.js(v=20230803005)}"></script>
	<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
	                <div class="ibox float-e-margins">
	                    <div class="ibox-title">
	                         <h5><span th:text="#{product.label.title}"></span></h5>
	                    </div>
	                    <div class="ibox-content">
	                         <div class="table-responsive">
	                             <table class="table table-bordered table-striped">
	                              <tbody>
		                               <colgroup>
						                <col width="15%">
						                <col width="35%">
						                <col width="15%">
						                <col width="35%">
					              </colgroup>
	                                  <tr>
	                                     <th><span th:text="#{product.label.id}"></span><span style="color:red;">*</span></th>
	                                     <td>
	                                     	<div class="input-group">
	                                     		<span th:if="${productId == null or productId == ''}" class="input-group-addon">
	                                     			<input type="text" style="width:50px;" class="form-control" value="PO" readOnly>
	                                     		</span>
	                                     		<span th:if="${productId == null or productId == ''}" class="input-group-addon">
	                                     			<input type="text" data-check="false" style="width:200px;" th:placeholder="#{product.placeholder.id.format}" id="tdProductId" class="form-control" maxLength="4" onKeyup="this.value=this.value.replace(/[^A-Z0-9]/g,'');">
	                                     		</span>
	                                     		<input th:unless="${productId == null or productId == ''}" type="text" data-check="false" style="width:200px;" placeholder="ex)PDLO01" id="tdProductId" class="form-control" maxLength="6" readonly>
                                                <span class="input-group-btn">
                                                	<button type="button" id="btnProdIdChecker" class="btn btn-primary" style="display: none;"><span th:text="#{customer.btn.card.duplicate.check}"></span></button>
                                                </span>
                                                <label id="prodIdCheckLabel" class="col-sm-2 control-label"
                                                           style="width:100%; margin-top: 15px;"></label>
                                            </div>
	                                     </td>
	                                     <th><span th:text="#{product.label.name}"></span><span style="color:red;">*</span></th>
	                                     <td><input type="text" th:placeholder="#{product.placeholder.name.format}" id="tdProductName" class="form-control" maxLength="15" readonly></td>
	                                  </tr>
	                                  <tr>
	                                     <th><span th:text="#{common.label.register.id}"></span></th>
	                                     <td id="tdRegId"></td>
	                                     <th><span th:text="#{common.label.registration.date}"></span></th>
	                                     <td id="tdRegDate"></td>
	                                  </tr>
	                                  <tr>
	                                     <th><span th:text="#{common.label.updater.id}"></span></th>
	                                     <td id="tdUpdId"></td>
	                                     <th><span th:text="#{common.label.update.date}"></span></th>
	                                     <td id="tdUpdDate"></td>
	                                  </tr>
	                              </tbody>
	                             </table>
	                             <div class="ibox-content">
                                    <button class="btn btn-white pull-right" id="btnList"><span th:text="#{common.btn.list}"></span></button>
                                    <!-- Register/Update buttons are commented out as in original -->
                                </div>
	                         </div>
	                    </div>
	                </div>
	            </div>
	        </div>
	        <div class="row">
	        	<div class="col-lg-12">
	            	<div class="ibox float-e-margins">
	                	<div class="ibox-title">
	                    	<h5><span th:text="#{product.label.unit.price}"></span></h5>
	                        <div class="ibox-tools">
	                        	<a class="collapse-link">
	                            	<i class="fa fa-chevron-up"></i>
	                            </a>
	                            <a class="dropdown-toggle" data-toggle="dropdown" href="#">
	                            </a>
	                        </div>
	                    </div>
	                    <div class="ibox-content">
	                    	<div class="table-responsive">
		                    	<div class="ibox-tools">
		                    		<span style="color:red;">* <span th:text="#{product.message.price.change}"></span></span>
		                            <button id="btnAdd" style="display:none;" class="btn btn-green pull-right"><span th:text="#{common.btn.add}"></span></button>
		                            <button id="btnNewPrice" class="btn btn-success pull-right"><span th:text="#{common.btn.save}"></span></button>
		                        </div>
	                    	</div>
	                    	<div class="table-responsive">
	                        	<div class="dataTables_wrapper form-inline dt-bootstrap">
			                    	<table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
			                    		<colgroup>
			                    			<col style="width:15%">
			                    			<col style="width:8%">
			                    			<col style="width:15%">
			                    			<col style="width:15%">
			                    			<col style="width:15%">
			                    			<col style="width:15%">
			                    			<col style="width:17%">
			                    		</colgroup>
			                    		<thead>
							  			<tr>
											<th><span th:text="#{product.label.id}"></span></th>
											<th><span th:text="#{common.label.no}"></span></th>
											<th><span th:text="#{common.label.start.date}"></span></th>
											<th><span th:text="#{common.label.end.date}"></span></th>
											<th><span th:text="#{product.label.unit.price}"></span></th>
											<th><span th:text="#{product.label.discharge.price}"></span></th>
											<th><span th:text="#{common.label.remarks}"></span></th>
										</tr>
									</thead>
									<tbody id="tBodyList">
									</tbody>
			                        </table>
		                    	</div>
	                        </div>
	                	</div>
	            	</div>
	        	</div>
	        </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
var _msg = {
    productMgmt: /*[[#{js.product.productMgmt}]]*/ '',
    duplicateCheckRequired: /*[[#{js.product.duplicateCheckRequired}]]*/ '',
    productIdFrontFormat: /*[[#{js.product.productIdFrontFormat}]]*/ '',
    productIdBackFormat: /*[[#{js.product.productIdBackFormat}]]*/ '',
    checkProductIdDuplicate: /*[[#{js.product.checkProductIdDuplicate}]]*/ '',
    productIdInUse: /*[[#{js.product.productIdInUse}]]*/ '',
    idAlreadyExists: /*[[#{js.product.idAlreadyExists}]]*/ '',
    productIdAvailable: /*[[#{js.product.productIdAvailable}]]*/ '',
    idAvailable: /*[[#{js.product.idAvailable}]]*/ '',
    btnDelete: /*[[#{js.product.btnDelete}]]*/ '',
    btnCancel: /*[[#{js.product.btnCancel}]]*/ '',
    confirmDeletePrice: /*[[#{js.product.confirmDeletePrice}]]*/ '',
    enterProductId: /*[[#{js.product.enterProductId}]]*/ '',
    selectStartDate: /*[[#{js.product.selectStartDate}]]*/ '',
    startDateAfterPrevious: /*[[#{js.product.startDateAfterPrevious}]]*/ '',
    enterValidPrice: /*[[#{js.product.enterValidPrice}]]*/ '',
    confirmRegisterProduct: /*[[#{js.product.confirmRegisterProduct}]]*/ '',
    btnRegister: /*[[#{js.product.btnRegister}]]*/ '',
    btnConfirm: /*[[#{js.product.btnConfirm}]]*/ '',
    confirmChangeProduct: /*[[#{js.product.confirmChangeProduct}]]*/ '',
    btnChange: /*[[#{js.product.btnChange}]]*/ ''
};
</script>
<script th:inline="javascript">
var productId = /*[[${productId == null or productId == '' ? 'null' : productId}]]*/ 'null';
jQuery(document).ready(function(){
	//
	productDetailJs.init();
});
</script>
</body>
</html>
