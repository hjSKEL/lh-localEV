<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script>
var _msg = {
    searchGuide: '검색 조건을 설정한 후 검색 버튼을 클릭해주세요.'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/adjustmentList.js(v=20260901001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>충전이력 조정내역</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-12 m-b-xs">
                                    <label style="padding-top: 5px;"><span>조정일시</span> : &nbsp;</label>
                                    <div class="input-daterange input-group" style="display:inline-flex; width:auto;">
                                        <input type="text" class="input-sm form-control" id="date1" style="max-width:150px; background-color:#FFFFFF;">
                                        <span class="input-group-addon" style="background-color:#FFFFFF; border:0;">~</span>
                                        <input type="text" class="input-sm form-control" id="date2" style="max-width:150px; background-color:#FFFFFF;">
                                    </div>
                                    &nbsp;&nbsp;
                                    <label><span>충전ID</span> : &nbsp;</label>
                                    <input type="text" id="rechargingId" placeholder="충전ID를 입력해주세요" class="form-control input-sm" style="display:inline-block; width:220px;">
                                    <button type="button" id="btnSearch" class="btn btn-sm btn-primary">검색</button>
                                    <button type="button" id="btnReset" class="btn btn-sm btn-warning">초기화</button>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-12" style="padding-top: 11px;">
                                    <label id="totalCount"></label>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                            <tr>
                                                <th>번호</th>
                                                <th>조정일시</th>
                                                <th>충전ID</th>
                                                <th>단지</th>
                                                <th>동</th>
                                                <th>호</th>
                                                <th>고객명</th>
                                                <th>회원카드번호</th>
                                                <th>충전시작시간</th>
                                                <th>충전종료시간</th>
                                                <th>조정금액(원)</th>
                                                <th>조정사유</th>
                                                <th>조정자</th>
                                            </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                            <tfoot></tfoot>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        adjustmentListJs.init();
    });
</script>
</body>
</html>
