<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _requestId = /*[[${requestId}]]*/ '';
var _msg = {
    recordMgmt: '배터리 교체 기록'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/batterySwapRecord/batterySwapRecord.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5>
                                <span>배터리 교체 기록 상세</span>
                                <small>&nbsp; REQ #<span id="hdr_requestId"></span></small>
                            </h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- Cycle 요약 -->
                            <fieldset>
                                <legend style="font-size:14px;">Cycle 요약</legend>
                                <table class="table table-bordered" style="background-color: white;">
                                    <tr>
                                        <th style="width:15%;"><span>requestId</span></th>
                                        <td style="width:35%;" id="cell_requestId">-</td>
                                        <th style="width:15%;"><span>상태</span></th>
                                        <td style="width:35%;" id="cell_status">-</td>
                                    </tr>
                                    <tr>
                                        <th><span>충전소ID</span></th>
                                        <td id="cell_cp">-</td>
                                        <th><span>충전기ID</span></th>
                                        <td id="cell_cs">-</td>
                                    </tr>
                                    <tr>
                                        <th><span>소요시간</span></th>
                                        <td colspan="3" id="cell_duration">-</td>
                                    </tr>
                                </table>
                            </fieldset>

                            <!-- IN / OUT -->
                            <div class="row">
                                <div class="col-sm-6">
                                    <fieldset>
                                        <legend style="font-size:14px;">BatteryIn</legend>
                                        <table class="table table-bordered" style="background-color: white;">
                                            <tr><th style="width:35%;"><span>IN 시각</span></th><td id="cell_inDt">-</td></tr>
                                            <tr><th><span>IN 고객</span></th><td id="cell_inCustomer">-</td></tr>
                                            <tr><th><span>IN 개수</span></th><td id="cell_inCnt">-</td></tr>
                                        </table>
                                    </fieldset>
                                </div>
                                <div class="col-sm-6">
                                    <fieldset>
                                        <legend style="font-size:14px;">BatteryOut</legend>
                                        <table class="table table-bordered" style="background-color: white;">
                                            <tr><th style="width:35%;"><span>OUT 시각</span></th><td id="cell_outDt">-</td></tr>
                                            <tr><th><span>OUT 고객</span></th><td id="cell_outCustomer">-</td></tr>
                                            <tr><th><span>OUT 개수</span></th><td id="cell_outCnt">-</td></tr>
                                        </table>
                                    </fieldset>
                                </div>
                            </div>

                            <!-- 디테일 (배터리별, 페이징 없음) -->
                            <fieldset>
                                <legend style="font-size:14px;">ëíì¼ (ë°°í°ë¦¬ë³)</legend>
                                <div class="table-responsive">
                                    <table class="table table-striped table-bordered table-hover"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th>번호</th>
                                            <th>유형</th>
                                            <th>슬롯번호</th>
                                            <th>배터리 시리얼</th>
                                            <th>SoC(%)</th>
                                            <th>SoH(%)</th>
                                            <th>생산일</th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyDetails">
                                        <tr style="text-align:center;"><td colspan="7"><span>검색 중입니다.</span></td></tr>
                                        </tbody>
                                        <tfoot>
                                        <tr>
                                            <td colspan="4" style="text-align:right; font-weight:bold;"><span>평균 (IN)</span></td>
                                            <td style="text-align:right;" id="avg_in_soc">-</td>
                                            <td style="text-align:right;" id="avg_in_soh">-</td>
                                            <td>-</td>
                                        </tr>
                                        <tr>
                                            <td colspan="4" style="text-align:right; font-weight:bold;"><span>평균 (OUT)</span></td>
                                            <td style="text-align:right;" id="avg_out_soc">-</td>
                                            <td style="text-align:right;" id="avg_out_soh">-</td>
                                            <td>-</td>
                                        </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </fieldset>

                            <div class="row" style="padding-top:10px; text-align:right;">
                                <div class="col-sm-12">
                                    <button type="button" id="btnSlotHistory" class="btn btn-sm btn-info">
                                        <span>관련 슬롯 이력 보기</span>
                                    </button>
                                    <button type="button" id="btnList" class="btn btn-sm btn-white">
                                        <span>목록</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    jQuery(document).ready(function () {
        batterySwapRecordJs.init(_requestId);
    });
</script>
</body>
</html>
