<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script th:inline="javascript">
var _requestId = /*[[${requestId}]]*/ '';
var _msg = {
    recordMgmt: /*[[#{js.batteryswap.record.mgmt}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/batterySwapRecord/batterySwapRecord.js(v=20260513001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5>
                                <span th:text="#{batteryswap.record.detail.title}"></span>
                                <small>&nbsp; REQ #<span id="hdr_requestId"></span></small>
                            </h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- Cycle 요약 -->
                            <fieldset>
                                <legend style="font-size:14px;" th:text="#{batteryswap.record.legend.summary}"></legend>
                                <table class="table table-bordered" style="background-color: white;">
                                    <tr>
                                        <th style="width:15%;"><span th:text="#{batteryswap.record.label.request.id}"></span></th>
                                        <td style="width:35%;" id="cell_requestId">-</td>
                                        <th style="width:15%;"><span th:text="#{batteryswap.record.label.status}"></span></th>
                                        <td style="width:35%;" id="cell_status">-</td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.point.label.cp.id}"></span></th>
                                        <td id="cell_cp">-</td>
                                        <th><span th:text="#{batteryswap.station.label.cs.id}"></span></th>
                                        <td id="cell_cs">-</td>
                                    </tr>
                                    <tr>
                                        <th><span th:text="#{batteryswap.record.label.duration}"></span></th>
                                        <td colspan="3" id="cell_duration">-</td>
                                    </tr>
                                </table>
                            </fieldset>

                            <!-- IN / OUT -->
                            <div class="row">
                                <div class="col-sm-6">
                                    <fieldset>
                                        <legend style="font-size:14px;" th:text="#{batteryswap.record.legend.in}"></legend>
                                        <table class="table table-bordered" style="background-color: white;">
                                            <tr><th style="width:35%;"><span th:text="#{batteryswap.record.label.in.dt}"></span></th><td id="cell_inDt">-</td></tr>
                                            <tr><th><span th:text="#{batteryswap.record.label.in.customer}"></span></th><td id="cell_inCustomer">-</td></tr>
                                            <tr><th><span th:text="#{batteryswap.record.label.in.cnt}"></span></th><td id="cell_inCnt">-</td></tr>
                                        </table>
                                    </fieldset>
                                </div>
                                <div class="col-sm-6">
                                    <fieldset>
                                        <legend style="font-size:14px;" th:text="#{batteryswap.record.legend.out}"></legend>
                                        <table class="table table-bordered" style="background-color: white;">
                                            <tr><th style="width:35%;"><span th:text="#{batteryswap.record.label.out.dt}"></span></th><td id="cell_outDt">-</td></tr>
                                            <tr><th><span th:text="#{batteryswap.record.label.out.customer}"></span></th><td id="cell_outCustomer">-</td></tr>
                                            <tr><th><span th:text="#{batteryswap.record.label.out.cnt}"></span></th><td id="cell_outCnt">-</td></tr>
                                        </table>
                                    </fieldset>
                                </div>
                            </div>

                            <!-- 디테일 (배터리별, 페이징 없음) -->
                            <fieldset>
                                <legend style="font-size:14px;" th:text="#{batteryswap.record.legend.details}"></legend>
                                <div class="table-responsive">
                                    <table class="table table-striped table-bordered table-hover"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.no}"></th>
                                            <th th:text="#{batteryswap.record.detail.label.type}"></th>
                                            <th th:text="#{batteryswap.slot.label.evse.id}"></th>
                                            <th th:text="#{batteryswap.record.detail.label.serial}"></th>
                                            <th th:text="#{batteryswap.slot.label.soc}"></th>
                                            <th th:text="#{batteryswap.slot.label.soh}"></th>
                                            <th th:text="#{batteryswap.slot.label.production.date}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyDetails">
                                        <tr style="text-align:center;"><td colspan="7"><span th:text="#{js.searching}"></span></td></tr>
                                        </tbody>
                                        <tfoot>
                                        <tr>
                                            <td colspan="4" style="text-align:right; font-weight:bold;"><span th:text="#{batteryswap.record.detail.avg.in}"></span></td>
                                            <td style="text-align:right;" id="avg_in_soc">-</td>
                                            <td style="text-align:right;" id="avg_in_soh">-</td>
                                            <td>-</td>
                                        </tr>
                                        <tr>
                                            <td colspan="4" style="text-align:right; font-weight:bold;"><span th:text="#{batteryswap.record.detail.avg.out}"></span></td>
                                            <td style="text-align:right;" id="avg_out_soc">-</td>
                                            <td style="text-align:right;" id="avg_out_soh">-</td>
                                            <td>-</td>
                                        </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </fieldset>

                            <div class="row" style="padding-top:10px; text-align:right;">
                                <div class="col-sm-12">
                                    <button type="button" id="btnSlotHistory" class="btn btn-sm btn-info">
                                        <span th:text="#{batteryswap.record.btn.slot.history}"></span>
                                    </button>
                                    <button type="button" id="btnList" class="btn btn-sm btn-white">
                                        <span th:text="#{common.btn.list}"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    jQuery(document).ready(function () {
        batterySwapRecordJs.init(_requestId);
    });
</script>
</body>
</html>
