<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{common/header :: head}"></head>

<body class="pace-done mini-navbar">

    <script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
    <script>
        var _msg = {
            chargerIdDigit8: '충전기 ID 8자리를 입력해주세요.',
            chargerId: '충전기 ID'
        };
    </script>
    <script type="text/javascript" th:src="@{/resources/js/recharging/customer/rechargingAuthList.js(v=20260828001)}"></script>
    <div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
            <div class="wrapper wrapper-content">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5>인증이력</h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-8 m-b-xs">
                                        <div class="input-group" style="display: flex;">
                                            <label style="padding-top: 5px;"><span>기간</span> : &nbsp;</label>
                                            <div class="input-daterange input-group">
                                                <input type="text" class="input-sm form-control" id="date1" style="display: inline-block; max-width: 150px; background-color: #FFFFFF;" >
                                                <span class="input-group-addon" style="background-color:#FFFFFF; border: 0;">~</span>
                                                <input type=" text" class="input-sm form-control" id="date2" style="display: inline-block; max-width: 150px; background-color: #FFFFFF;" >
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-4 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-btn" style="width:30%">
                                                <select class="input-sm form-control input-sm inline" id="sType" name="sType">
                                                    <option value="">전체</option>
                                                    <option value="CHARGE_POINT">충전소명</option>
                                                    <option value="CHARGING_STATION">충전기ID</option>
                                                    <option value="CUST_NM">고객명</option>
                                                    <option value="CUT_CRD_NO">회원카드번호</option>
                                                </select>
                                            </span>
                                            <input type="text" id="searchKey" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary">검색</button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning">초기화</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x: auto;">
                                            <table
                                                class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                style="white-space:nowrap; text-align:center;">
                                                <thead>
                                                    <tr>
                                                        <th>번호</th>
                                                        <th>인증시간</th>
                                                        <th>인증결과</th>
                                                        <th>충전소명</th>
                                                        <th>충전기ID</th>
                                                        <th>회원카드번호</th>
                                                        <th>고객명</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot>
                                                </tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers"
                                            id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl">
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var pageInfoJs;
        jQuery(document).ready(function () {
            //
            pageInfoJs = new PageInfoJs();
            rechargingAuthListJs.init();
        });
    </script>

</html>
