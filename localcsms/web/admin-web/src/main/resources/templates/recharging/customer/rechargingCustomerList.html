<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{common/header :: head}"></head>

<body class="pace-done mini-navbar">

    <script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
    <script>
        var _msg = {
            chargerIdDigit8: '충전기 ID 8자리를 입력해주세요.',
            chargerId: '충전기 ID',
            cardDigit16: '회원카드번호 16자리를 입력해주세요.',
            cardNumber: '회원카드번호',
            pleaseWait: '잠시만 기다려 주세요.',
            excelDownload: '엑셀 다운로드',
            exceptionMgmt: '충전장애관리',
            day: '일',
            hour: '시간',
            minute: '분',
            second: '초'
        };
    </script>
    <script type="text/javascript"
        th:src="@{/resources/js/recharging/customer/rechargingCustomer.js(v=20230801001)}"></script>
    <div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
            <div class="wrapper wrapper-content">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox float-e-margins">
                            <div class="ibox-title">
                                <h5>고객 충전이력</h5>
                                <div class="ibox-tools">
                                    <a class="collapse-link">
                                        <i class="fa fa-chevron-up"></i>
                                    </a>
                                    <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                    </a>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <div class="row">
                                    <div class="col-sm-8 m-b-xs">
                                        <div class="input-group" style="display: flex;">
                                            <select id="dateType" class="form-control input-sm" style="width: 110px;">
                                                <option value="S" selected>충전시작</option>
                                                <option value="E">충전종료</option>
                                            </select>
                                            <div class="input-daterange input-group">
                                                <input type="text" class="input-sm form-control" id="date1" style="max-width: 150px; background-color: #FFFFFF;" >
                                                <span class="input-group-addon" style="background-color:#FFFFFF;">~</span>
                                                <input type=" text" class="input-sm form-control" id="date2" style="max-width: 150px; background-color: #FFFFFF;" >
                                            </div>
                                            <div id="dateOrder" style="display: flex; align-items: center; white-space: nowrap; margin-left: 10px;">
                                                <label><input type="radio" name="dateOrder" value="A" style="font-weight: bold">&nbsp;&nbsp;<span>충전시작</span>
                                                    ↑&nbsp;&nbsp;</label>
                                                <label><input type="radio" name="dateOrder" value="B"   style="font-weight: bold;" checked>&nbsp;&nbsp;<span>충전시작</span>
                                                    ↓&nbsp;&nbsp;</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-4 m-b-xs">
                                        <div class="input-group">
                                            <span class="input-group-btn" style="width:30%">
                                                <select class="input-sm form-control input-s-sm inline" id="sType">
                                                    <option value="CUT_CARD_NO">회원카드번호</option>
                                                    <option value="CSUNIQID">충전기ID</option>
                                                    <option value="CUSTOMER">세대주명</option>
                                                </select>
                                            </span>
                                            <input type="text" id="searchKey" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                            <span class="input-group-btn">
                                                <button type="button" id="btnSearch" class="btn btn-sm btn-primary">검색</button>
                                            </span>
                                            <span class="input-group-btn">
                                                <button type="button" id="btnReset" class="btn btn-sm btn-warning">초기화</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-6" style="padding-top: 11px;">
                                        <label id="totalCount"></label>
                                    </div>
                                    <div class="col-sm-6" style="text-align: right;">
                                        <button type="button" id="saveExcelcs" class="btn btn-sm btn-info">엑셀다운로드</button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <div class="dataTables_wrapper form-inline dt-bootstrap">
                                        <div style="overflow-x:auto;">
                                            <table
                                                class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                                style="white-space:nowrap;text-align:center;">
                                                <thead>
                                                    <tr>
                                                        <th>번호</th>
                                                        <th>충전소명</th>
                                                        <th>충전ID</th>
                                                        <th>충전기ID</th>
                                                        <th>동</th>
                                                        <th>호</th>
                                                        <th>고객명</th>
                                                        <th>회원카드번호</th>
                                                        <th>휴대폰번호</th>
                                                        <th>충전시작시간</th>
                                                        <th>충전종료시간</th>
                                                        <th>충전소요시간</th>
                                                        <th>충전상태</th>
                                                        <th>충전량(kWh)</th>
                                                        <th>충전단가(원)</th>
                                                        <th>사용금액(원)</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="tBodyList">
                                                </tbody>
                                                <tfoot>
                                                </tfoot>
                                            </table>
                                        </div>
                                        <div class="dataTables_paginate paging_simple_numbers"
                                            id="DataTables_Table_0_paginate">
                                            <ul class="pagination" id="pagingUl"></ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common/popup/company :: popup}"></div>
    <div th:replace="~{common/popup/customer :: popup}"></div>
    <div th:replace="~{common/popup/chargingPointInfo :: popup}"></div>
    <script type="text/javascript">
        var pageInfoJs;
        jQuery(document).ready(function () {
            //
            pageInfoJs = new PageInfoJs();
            rechargingCustomerJs.init();
        });
    </script>
</body>

</html>
