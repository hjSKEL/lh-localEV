<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<div th:replace="~{common/popup/customerInfo :: popup}"></div>
<div th:replace="~{common/popup/breakdownList :: popup}"></div>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _msg = {
    exceptionMgmt: /*[[#{js.recharging.exception.mgmt}]]*/ '',
    exceptionProcess: /*[[#{js.recharging.exception.process}]]*/ '',
    rechargingHistory: /*[[#{js.recharging.history}]]*/ '',
    rechargingHistoryBtn: /*[[#{js.recharging.history.btn}]]*/ '',
    breakdownHistory: /*[[#{js.recharging.breakdown.history}]]*/ '',
    inputRechargingId: /*[[#{js.recharging.input.id}]]*/ '',
    noRechargingInfo: /*[[#{js.recharging.no.info}]]*/ '',
    onlyStartOrChargingEditable: /*[[#{js.recharging.only.start.charging.editable}]]*/ '',
    searchRechargingFirst: /*[[#{js.recharging.search.first}]]*/ '',
    statusMustBeStartOrCharging: /*[[#{js.recharging.status.must.start.charging}]]*/ '',
    invalidEndDateFormat: /*[[#{js.recharging.invalid.end.date.format}]]*/ '',
    invalidChargeAmount: /*[[#{js.recharging.invalid.charge.amount}]]*/ '',
    invalidUnitPrice: /*[[#{js.recharging.invalid.unit.price}]]*/ '',
    invalidChargePrice: /*[[#{js.recharging.invalid.charge.price}]]*/ '',
    invalidPaymentAmount: /*[[#{js.recharging.invalid.payment.amount}]]*/ '',
    endBeforeStart: /*[[#{js.recharging.end.before.start}]]*/ '',
    selectOrInputErrorType: /*[[#{js.recharging.select.or.input.error.type}]]*/ '',
    errorContentMax125: /*[[#{js.recharging.error.content.max125}]]*/ '',
    confirmEndCharging: /*[[#{js.recharging.confirm.end.charging}]]*/ '',
    endChargingProcess: /*[[#{js.recharging.end.charging.process}]]*/ '',
    chargingEnded: /*[[#{js.recharging.charging.ended}]]*/ '',
    cancel: /*[[#{common.btn.cancel}]]*/ '',
    selectLabel: /*[[#{js.common.select}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/exception/excepView.js(v=20230808001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:text="#{recharging.exception.manage.title}"></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-4">
                                    <div class="input-group">
                                        <span class="input-group-btn">
                                            <label style="font-size: 12px;"><span th:text="#{recharging.label.id}"></span>&nbsp;:&nbsp;</label>
                                        </span>
                                        <input type="text" id="rechargingId" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"
                                                    style="float:right;" th:text="#{common.btn.search}"></button>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-sm-8">
                                    <div style="display: flex; width: 100%; justify-content: end; align-items: center;">
                                        <select id="errorType" style="width: 150px;" class="form-control input-sm">
                                            <option value="선택" selected th:text="#{recharging.exception.label.type.select}"></option>
                                            <option value="신호오류" th:text="#{recharging.exception.type.signal.error}"></option>
                                            <option value="충전시작시간=충전종료시간" th:text="#{recharging.exception.type.same.time}"></option>
                                            <option value="차단기트립" th:text="#{recharging.exception.type.breaker.trip}"></option>
                                            <option value="" th:text="#{recharging.exception.type.manual}"></option>
                                        </select>
                                        <input type="text" id="etc" class="form-control input-sm" style="width:250px;" disabled>
                                        <button type="btnForm" id="btnForm" class="btn btn-sm btn-primary" th:text="#{recharging.exception.btn.apply}"></button>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
                                        <tr>
                                            <th th:text="#{charger.station.name}"></th>
                                            <td id="cpName"></td>
                                            <th th:text="#{recharging.label.charger.id}"></th>
                                            <td id="cpId"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{customer.label.name}"></th>
                                            <td id="customerName"></td>
                                            <th th:text="#{recharging.label.status}"></th>
                                            <td id="chStatCode"></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{recharging.label.start}"></th>
                                            <td id="chStartDate"></td>
                                            <th th:text="#{recharging.label.end}"></th>
                                            <td><input type="text" style="width:225px;" placeholder="YYYY-MM-DD HH:MM:SS(KST)" id="chEndDate" class="form-control input-sm"/></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{recharging.label.amount}"></th>
                                            <td><input type="number" step="0.01" min="0" id="chUseAmount" class="form-control input-sm"/></td>
                                            <th th:text="#{recharging.label.unit.price}"></th>
                                            <td>
                                                <input type="number" step="0.01" min="0" max="99999" id="chUseUnitCost" class="form-control input-sm"/>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{recharging.label.amount.price}"></th>
                                            <td><input type="number" step="0.01" min="0" max="99999" id="chUseCost" class="form-control input-sm"/></td>
                                            <th th:text="#{recharging.label.payment.amount}"></th>
                                            <td><input type="number" min="0" max="99999" id="paySum" class="form-control input-sm"/></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{recharging.label.discharge.amount}"></th>
                                            <td><input type="number" step="0.01" min="0" id="dchUseAmount" class="form-control input-sm"/></td>
                                            <th th:text="#{recharging.label.discharge.unit.price}"></th>
                                            <td><input type="number" step="0.01" min="0" max="99999" id="dchUseUnitCost" class="form-control input-sm"/></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{recharging.label.discharge.amount.price}"></th>
                                            <td><input type="number" step="0.01" min="0" max="99999" id="dchUseCost" class="form-control input-sm"/></td>
                                            <th></th>
                                            <td></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5 th:text="#{charger.status.log.title}"></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;" th:text="#{charger.status.log.queryDate}"></span>
                                        <div class="input-daterange input-group" id="datepicker">
                                            <input type="text" class="input-sm form-control" id="date1"
                                                   name="start" style="max-width: 150px;" readonly>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div style="display: flex; float: right;">
                                        <span class="input-group-addon" style="border: 0;padding-left: 0;font-weight: 700;width: 70px;" th:text="#{common.label.content.count}"></span>
                                        <span class="input-group-btn" style="width: 70px;">
                                            <select class="input-sm form-control input-s-sm inline" id="pagingNum" name="pagingNum">
                                                <option value="20" selected="">20</option>
                                                <option value="30">30</option>
                                                <option value="40">40</option>
                                            </select>
                                        </span>
                                        <select class="input-sm form-control input-s-sm inline" id="csCableChn" style="width: 80px;">
                                            <option selected value="0" th:text="#{common.label.all}"></option>
                                            <option value="1" th:text="#{charger.status.log.channel.ch1}"></option>
                                            <option value="2" th:text="#{charger.status.log.channel.ch2}"></option>
                                        </select>
                                        <button type="button" id="btnLogSearch" class="btn btn-sm btn-primary" th:text="#{common.btn.search}"></button>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th th:text="#{common.label.seq}"></th>
                                            <th th:text="#{charger.status.log.serverCollectionTime}"></th>
                                            <th th:text="#{charger.status.log.terminalCollectionTime}"></th>
                                            <th th:text="#{recharging.label.id}"></th>
                                            <th th:text="#{charger.status.log.chargerId}"></th>
                                            <th th:text="#{recharging.label.channel}"></th>
                                            <th th:text="#{charger.status.log.chargerStatus}"></th>
                                            <th th:text="#{charger.status.log.cableStatus}"></th>
                                            <th th:text="#{charger.status.log.abnormalStatus}"></th>
                                            <th th:text="#{charger.status.log.usedPower}"></th>
                                            <th th:text="#{charger.status.log.meterPower}"></th>
                                            <th th:text="#{charger.status.log.instantPower}"></th>
                                            <th th:text="#{charger.status.log.instantAmount}"></th>
                                            <th th:text="#{charger.status.log.totalAmount}"></th>
                                            <th th:text="#{charger.status.log.startTime}"></th>
                                            <th th:text="#{charger.status.log.lastTime}"></th>
                                            <th th:text="#{charger.status.log.eventCode}"></th>
                                            <th th:text="#{charger.status.log.tagCardNumber}"></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList">
                                        </tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<div th:replace="~{common/popup/customerRecharging :: popup}"></div>
<script type="text/javascript">
    var pageInfo2Js;
    jQuery(document).ready(function () {
        //
        pageInfo2Js = new PageInfo2Js();
        excepViewJs.init();
    });
</script>
</html>
