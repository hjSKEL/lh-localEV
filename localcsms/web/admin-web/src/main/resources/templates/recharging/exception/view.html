<div th:replace="~{common/popup/breakdownList :: popup}"></div>

<script type="text/javascript" th:src="@{/resources/js/recharging/exception/excepView.js(v=20230808001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/pageInfo2.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5>충전장애관리</h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-4">
                                    <div class="input-group">
                                        <span class="input-group-btn">
                                            <label style="font-size: 12px;"><span>충전ID</span>&nbsp;:&nbsp;</label>
                                        </span>
                                        <input type="text" id="rechargingId" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"
                                                    style="float:right;">검색</button>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-sm-8">
                                    <div style="display: flex; width: 100%; justify-content: end; align-items: center;">
                                        <select id="errorType" style="width: 150px;" class="form-control input-sm">
                                            <option value="선택" selected>처리구분 선택</option>
                                            <option value="신호오류">신호오류</option>
                                            <option value="충전시작시간=충전종료시간">충전시작시간=충전종료시간</option>
                                            <option value="차단기트립">차단기트립</option>
                                            <option value="">직접입력</option>
                                        </select>
                                        <input type="text" id="etc" class="form-control input-sm" style="width:250px;" disabled>
                                        <button type="btnForm" id="btnForm" class="btn btn-sm btn-primary">반영</button>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
                                        <tr>
                                            <th>충전소명</th>
                                            <td id="cpName"></td>
                                            <th>충전기ID</th>
                                            <td id="cpId"></td>
                                        </tr>
                                        <tr>
                                            <th>세대주명</th>
                                            <td id="customerName"></td>
                                            <th>충전상태</th>
                                            <td id="chStatCode"></td>
                                        </tr>
                                        <tr>
                                            <th>충전시작</th>
                                            <td id="chStartDate"></td>
                                            <th>충전종료</th>
                                            <td><input type="text" style="width:225px;" placeholder="YYYY-MM-DD HH:MM:SS(KST)" id="chEndDate" class="form-control input-sm"/></td>
                                        </tr>
                                        <tr>
                                            <th>충전량(kWh)</th>
                                            <td><input type="number" step="0.01" min="0" id="chUseAmount" class="form-control input-sm"/></td>
                                            <th>충전단가(원)</th>
                                            <td>
                                                <input type="number" step="0.01" min="0" max="99999" id="chUseUnitCost" class="form-control input-sm"/>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th>충전금액(원)</th>
                                            <td><input type="number" step="0.01" min="0" max="99999" id="chUseCost" class="form-control input-sm"/></td>
                                            <th>결제금액(원)</th>
                                            <td><input type="number" min="0" max="99999" id="paySum" class="form-control input-sm"/></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5>충전기 로그</h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-addon"
                                              style="border: 0px;padding-left: 0px;font-weight: 700;">조회일자</span>
                                        <div class="input-daterange input-group" id="datepicker">
                                            <input type="text" class="input-sm form-control" id="date1"
                                                   name="start" style="max-width: 150px;" readonly>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div style="display: flex; float: right;">
                                        <span class="input-group-addon" style="border: 0;padding-left: 0;font-weight: 700;width: 70px;">컨텐츠 수</span>
                                        <span class="input-group-btn" style="width: 70px;">
                                            <select class="input-sm form-control input-s-sm inline" id="pagingNum" name="pagingNum">
                                                <option value="20" selected="">20</option>
                                                <option value="30">30</option>
                                                <option value="40">40</option>
                                            </select>
                                        </span>
                                        <select class="input-sm form-control input-s-sm inline" id="csCableChn" style="width: 80px;">
                                            <option selected value="0">전체</option>
                                            <option value="1">CH1</option>
                                            <option value="2">CH2</option>
                                        </select>
                                        <button type="button" id="btnLogSearch" class="btn btn-sm btn-primary">검색</button>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                           style="white-space:nowrap; text-align:center;">
                                        <thead>
                                        <tr>
                                            <th>순번</th>
                                            <th>서버수집시간</th>
                                            <th>단말수집시간</th>
                                            <th>충전ID</th>
                                            <th>충전기ID</th>
                                            <th>채널</th>
                                            <th>충전기상태</th>
                                            <th>케이블상태</th>
                                            <th>충전이상상태</th>
                                            <th>사용전력량(kWh)</th>
                                            <th>계량기전력량(kWh)</th>
                                            <th>순간충전량(kWh)</th>
                                            <th>순간충전금액(원)</th>
                                            <th>충전금액(원)</th>
                                            <th>충전시작시간</th>
                                            <th>마지막충전시간</th>
                                            <th>이벤트코드</th>
                                            <th>태깅카드번호</th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList">
                                        </tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUl">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<div th:replace="~{common/popup/customerRecharging :: popup}"></div>

    var pageInfo2Js;
    jQuery(document).ready(function () {
        //
        pageInfo2Js = new PageInfo2Js();
        excepViewJs.init();
    });
</script>
</html>
