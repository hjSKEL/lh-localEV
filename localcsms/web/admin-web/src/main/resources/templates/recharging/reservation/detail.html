<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script>
var _msg = {
    confirmCancelReservation: '예약을 취소하시겠습니까?',
    reservationCancelled: '예약이 취소되었습니다.',
    reservationCancelFail: '예약 취소에 실패하였습니다.',
    cpIdDigit6: '충전소ID 6자리를 입력해주세요.',
    csIdDigit2: '충전기ID 2자리를 입력해주세요.',
    inputExpiredDate: '만료일시를 입력해주세요.',
    inputCardNo: '카드번호를 입력해주세요.',
    processing: '처리 중...',
    reserveRegister: '예약 등록',
    reservationRegistered: '예약이 등록되었습니다.',
    reservationRegisterComplete: '예약 등록 완료',
    reservationRegisterSuccess: '예약이 성공적으로 등록되었습니다.',
    reservationRegisterFail: '예약 등록 실패',
    reservationRegisterFailRetry: '예약 등록에 실패하였습니다. 다시 시도해주세요.',
    error: '오류',
    noReservationHistory: '예약 이력이 없습니다.',
    statusReserved: '예약',
    statusCancelled: '예약취소'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/reservation/reservationDetail.js(v=20260309001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">

            <!-- 예약 상세 정보 (rsvId가 있을 때만 표시) -->
            <div class="row" id="sectionDetail" style="display:none;">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>예약 상세 정보</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered" style="text-align:left;">
                                    <colgroup>
                                        <col style="width:15%">
                                        <col style="width:35%">
                                        <col style="width:15%">
                                        <col style="width:35%">
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th>예약ID</th>
                                            <td><span id="detailRsvId" style="font-family:monospace;"></span></td>
                                            <th>상태</th>
                                            <td><span id="detailStatus"></span></td>
                                        </tr>
                                        <tr>
                                            <th>충전소ID</th>
                                            <td><span id="detailCpId"></span></td>
                                            <th>충전기ID</th>
                                            <td><span id="detailCsId"></span></td>
                                        </tr>
                                        <tr>
                                            <th>카드번호</th>
                                            <td><span id="detailCutCardNo"></span></td>
                                            <th>부모카드번호</th>
                                            <td><span id="detailParentCardNo"></span></td>
                                        </tr>
                                        <tr>
                                            <th>만료일시</th>
                                            <td><span id="detailExpiredDate"></span></td>
                                            <th>등록일시</th>
                                            <td><span id="detailRegDate"></span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="row" style="margin-top:10px;">
                                <div class="col-sm-12" style="text-align:right;">
                                    <button type="button" id="btnList" class="btn btn-white btn-sm"><span>목록</span></button>
                                    <button type="button" id="btnCancel" class="btn btn-danger btn-sm" style="display:none;">예약 취소</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 예약 등록 (Reserve Now) -->
            <div class="row" id="sectionRegister">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>예약 등록</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div id="alertRegister" class="alert" style="display:none;">
                                <strong id="alertTitle"></strong>
                                <span id="alertMessage" style="margin-left:8px;"></span>
                            </div>
                            <form id="registerForm">
                                <div class="table-responsive">
                                    <table class="table table-bordered" style="text-align:left;">
                                        <colgroup>
                                            <col style="width:15%">
                                            <col style="width:35%">
                                            <col style="width:15%">
                                            <col style="width:35%">
                                        </colgroup>
                                        <tbody>
                                            <tr>
                                                <th><span>충전소ID</span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCpId" class="form-control input-sm" maxlength="6" placeholder="충전소ID 6자리">
                                                </td>
                                                <th><span>충전기ID</span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCsId" class="form-control input-sm" maxlength="2" placeholder="충전기ID 2자리">
                                                </td>
                                            </tr>
                                            <tr>
                                                <th><span>만료일시</span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="datetime-local" id="regExpiredDate" class="form-control input-sm" required>
                                                </td>
                                                <th></th>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <th><span>카드번호</span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCutCardNo" class="form-control input-sm" maxlength="16" placeholder="카드번호 16자리" required>
                                                </td>
                                                <th>부모카드번호</th>
                                                <td>
                                                    <input type="text" id="regParentCardNo" class="form-control input-sm" maxlength="16" placeholder="선택 입력">
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div style="text-align:right; margin-top:10px;">
                                    <button type="button" id="btnListFromRegister" class="btn btn-white btn-sm"><span>목록</span></button>
                                    <button type="submit" id="btnReserve" class="btn btn-primary btn-sm">예약 등록</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 예약 이력 -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>예약 이력</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-12" style="padding-top:5px; padding-bottom:5px;">
                                    <label id="historyTotalCount"></label>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                                <tr>
                                                    <th><span>번호</span></th>
                                                    <th>예약ID</th>
                                                    <th>충전소ID</th>
                                                    <th>충전기ID</th>
                                                    <th>카드번호</th>
                                                    <th>부모카드번호</th>
                                                    <th>만료일시</th>
                                                    <th>상태</th>
                                                    <th>등록일시</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tBodyHistory"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUlHistory"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoHistoryJs;
    jQuery(document).ready(function () {
        pageInfoHistoryJs = new PageInfoJs();
        reservationDetailJs.init();
    });
</script>
</body>
</html>
