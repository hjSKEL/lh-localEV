<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script th:inline="javascript">
var _msg = {
    confirmCancelReservation: /*[[#{js.reservation.confirm.cancel}]]*/ '',
    reservationCancelled: /*[[#{js.reservation.cancelled}]]*/ '',
    reservationCancelFail: /*[[#{js.reservation.cancel.fail}]]*/ '',
    cpIdDigit6: /*[[#{js.reservation.cpid.digit6}]]*/ '',
    csIdDigit2: /*[[#{js.reservation.csid.digit2}]]*/ '',
    inputExpiredDate: /*[[#{js.reservation.input.expired.date}]]*/ '',
    inputCardNo: /*[[#{js.reservation.input.card.no}]]*/ '',
    processing: /*[[#{js.common.processing}]]*/ '',
    reserveRegister: /*[[#{js.reservation.register}]]*/ '',
    reservationRegistered: /*[[#{js.reservation.registered}]]*/ '',
    reservationRegisterComplete: /*[[#{js.reservation.register.complete}]]*/ '',
    reservationRegisterSuccess: /*[[#{js.reservation.register.success}]]*/ '',
    reservationRegisterFail: /*[[#{js.reservation.register.fail}]]*/ '',
    reservationRegisterFailRetry: /*[[#{js.reservation.register.fail.retry}]]*/ '',
    error: /*[[#{js.common.error}]]*/ '',
    noReservationHistory: /*[[#{js.reservation.no.history}]]*/ '',
    statusReserved: /*[[#{js.reservation.status.reserved}]]*/ '',
    statusCancelled: /*[[#{js.reservation.status.cancelled}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/reservation/reservationDetail.js(v=20260309001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">

            <!-- 예약 상세 정보 (rsvId가 있을 때만 표시) -->
            <div class="row" id="sectionDetail" style="display:none;">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{reservation.detail.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-bordered" style="text-align:left;">
                                    <colgroup>
                                        <col style="width:15%">
                                        <col style="width:35%">
                                        <col style="width:15%">
                                        <col style="width:35%">
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th th:text="#{reservation.label.reservationId}"></th>
                                            <td><span id="detailRsvId" style="font-family:monospace;"></span></td>
                                            <th th:text="#{common.label.status}"></th>
                                            <td><span id="detailStatus"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{reservation.label.cpId}"></th>
                                            <td><span id="detailCpId"></span></td>
                                            <th th:text="#{reservation.label.csId}"></th>
                                            <td><span id="detailCsId"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{reservation.label.cardNo}"></th>
                                            <td><span id="detailCutCardNo"></span></td>
                                            <th th:text="#{reservation.label.parentCardNo}"></th>
                                            <td><span id="detailParentCardNo"></span></td>
                                        </tr>
                                        <tr>
                                            <th th:text="#{reservation.label.expiryDate}"></th>
                                            <td><span id="detailExpiredDate"></span></td>
                                            <th th:text="#{reservation.label.regDate}"></th>
                                            <td><span id="detailRegDate"></span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="row" style="margin-top:10px;">
                                <div class="col-sm-12" style="text-align:right;">
                                    <button type="button" id="btnList" class="btn btn-white btn-sm"><span th:text="#{common.btn.list}"></span></button>
                                    <button type="button" id="btnCancel" class="btn btn-danger btn-sm" style="display:none;" th:text="#{reservation.btn.cancel}"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 예약 등록 (Reserve Now) -->
            <div class="row" id="sectionRegister">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{reservation.register.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div id="alertRegister" class="alert" style="display:none;">
                                <strong id="alertTitle"></strong>
                                <span id="alertMessage" style="margin-left:8px;"></span>
                            </div>
                            <form id="registerForm">
                                <div class="table-responsive">
                                    <table class="table table-bordered" style="text-align:left;">
                                        <colgroup>
                                            <col style="width:15%">
                                            <col style="width:35%">
                                            <col style="width:15%">
                                            <col style="width:35%">
                                        </colgroup>
                                        <tbody>
                                            <tr>
                                                <th><span th:text="#{reservation.label.cpId}"></span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCpId" class="form-control input-sm" maxlength="6" th:placeholder="#{reservation.placeholder.cpId}">
                                                </td>
                                                <th><span th:text="#{reservation.label.csId}"></span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCsId" class="form-control input-sm" maxlength="2" th:placeholder="#{reservation.placeholder.csId}">
                                                </td>
                                            </tr>
                                            <tr>
                                                <th><span th:text="#{reservation.label.expiryDate}"></span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="datetime-local" id="regExpiredDate" class="form-control input-sm" required>
                                                </td>
                                                <th></th>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <th><span th:text="#{reservation.label.cardNo}"></span> <span class="text-danger">*</span></th>
                                                <td>
                                                    <input type="text" id="regCutCardNo" class="form-control input-sm" maxlength="16" th:placeholder="#{reservation.placeholder.cardNo}" required>
                                                </td>
                                                <th th:text="#{reservation.label.parentCardNo}"></th>
                                                <td>
                                                    <input type="text" id="regParentCardNo" class="form-control input-sm" maxlength="16" th:placeholder="#{reservation.placeholder.optional}">
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div style="text-align:right; margin-top:10px;">
                                    <button type="button" id="btnListFromRegister" class="btn btn-white btn-sm"><span th:text="#{common.btn.list}"></span></button>
                                    <button type="submit" id="btnReserve" class="btn btn-primary btn-sm" th:text="#{reservation.btn.register}"></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 예약 이력 -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{reservation.history.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-12" style="padding-top:5px; padding-bottom:5px;">
                                    <label id="historyTotalCount"></label>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                                <tr>
                                                    <th><span th:text="#{common.label.no}"></span></th>
                                                    <th th:text="#{reservation.label.reservationId}"></th>
                                                    <th th:text="#{reservation.label.cpId}"></th>
                                                    <th th:text="#{reservation.label.csId}"></th>
                                                    <th th:text="#{reservation.label.cardNo}"></th>
                                                    <th th:text="#{reservation.label.parentCardNo}"></th>
                                                    <th th:text="#{reservation.label.expiryDate}"></th>
                                                    <th th:text="#{common.label.status}"></th>
                                                    <th th:text="#{reservation.label.regDate}"></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tBodyHistory"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination" id="pagingUlHistory"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoHistoryJs;
    jQuery(document).ready(function () {
        pageInfoHistoryJs = new PageInfoJs();
        reservationDetailJs.init();
    });
</script>
</body>
</html>
