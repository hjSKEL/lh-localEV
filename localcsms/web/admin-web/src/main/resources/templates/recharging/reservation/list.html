<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script th:inline="javascript">
var _msg = {
    chargerIdDigit8: /*[[#{js.recharging.charger.id.digit8}]]*/ '',
    chargerId: /*[[#{js.recharging.charger.id}]]*/ '',
    statusReserved: /*[[#{js.reservation.status.reserved}]]*/ '',
    statusCancelled: /*[[#{js.reservation.status.cancelled}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/reservation/reservation.js(v=20260309001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{reservation.list.title}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 검색 -->
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group" style="display:flex; align-items:center; gap:8px;">
                                        <span style="font-weight:700; white-space:nowrap;" th:text="#{common.label.status}+' '"></span>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="" checked>&nbsp;<span><span th:text="#{common.label.all}"></span></span></label>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="RSVT01">&nbsp;<span th:text="#{reservation.label.status.reserved}"></span></label>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="RSVT02">&nbsp;<span th:text="#{reservation.label.status.cancelled}"></span></label>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select id="sType" class="input-sm form-control">
                                                <option value="CHARGER_ID" th:text="#{reservation.label.searchType.chargerId}"></option>
                                                <option value="CARD_NO" th:text="#{reservation.label.searchType.cardNo}"></option>
                                            </select>
                                        </span>
                                        <input type="text" id="searchKey" th:placeholder="#{common.placeholder.search.input}" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span th:text="#{common.btn.reset}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6" style="padding-top:11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align:right;">
                                    <button type="button" id="btnGoRegister" class="btn btn-sm btn-primary"><span th:text="#{reservation.btn.register}"></span></button>
                                </div>
                            </div>
                            <!-- 목록 테이블 -->
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                                <tr>
                                                    <th><span th:text="#{common.label.no}"></span></th>
                                                    <th><span th:text="#{reservation.label.reservationId}"></span></th>
                                                    <th><span th:text="#{reservation.label.cpId}"></span></th>
                                                    <th><span th:text="#{reservation.label.csId}"></span></th>
                                                    <th><span th:text="#{reservation.label.cardNo}"></span></th>
                                                    <th><span th:text="#{reservation.label.parentCardNo}"></span></th>
                                                    <th><span th:text="#{reservation.label.expiryDate}"></span></th>
                                                    <th><span th:text="#{common.label.status}"></span></th>
                                                    <th><span th:text="#{reservation.label.regDate}"></span></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        reservationJs.init();
    });
</script>
</body>
</html>
