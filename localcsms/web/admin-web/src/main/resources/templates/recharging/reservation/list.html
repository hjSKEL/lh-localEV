<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">

<script>
var _msg = {
    chargerIdDigit8: '충전기 ID 8자리를 입력해주세요.',
    chargerId: '충전기 ID',
    statusReserved: '예약',
    statusCancelled: '예약취소'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/recharging/reservation/reservation.js(v=20260309001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>예약 관리</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <!-- 검색 -->
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group" style="display:flex; align-items:center; gap:8px;">
                                        <span style="font-weight:700; white-space:nowrap;"상태 </span>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="" checked>&nbsp;<span><span>전체</span></span></label>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="RSVT01">&nbsp;<span>예약</span></label>
                                        <label style="margin:0;"><input type="radio" name="rsvStatus" value="RSVT02">&nbsp;<span>예약취소</span></label>
                                    </div>
                                </div>
                                <div class="col-sm-6 m-b-xs">
                                    <div class="input-group">
                                        <span class="input-group-btn" style="width:30%">
                                            <select id="sType" class="input-sm form-control">
                                                <option value="CHARGER_ID">충전기ID(8자리)</option>
                                                <option value="CARD_NO">카드번호</option>
                                            </select>
                                        </span>
                                        <input type="text" id="searchKey" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"><span>검색</span></button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning"><span>초기화</span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6" style="padding-top:11px;">
                                    <label id="totalCount"></label>
                                </div>
                                <div class="col-sm-6" style="text-align:right;">
                                    <button type="button" id="btnGoRegister" class="btn btn-sm btn-primary"><span>예약 등록</span></button>
                                </div>
                            </div>
                            <!-- 목록 테이블 -->
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <div style="overflow-x:auto;">
                                        <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline"
                                               style="white-space:nowrap; text-align:center;">
                                            <thead>
                                                <tr>
                                                    <th><span>번호</span></th>
                                                    <th><span>예약ID</span></th>
                                                    <th><span>충전소ID</span></th>
                                                    <th><span>충전기ID</span></th>
                                                    <th><span>카드번호</span></th>
                                                    <th><span>부모카드번호</span></th>
                                                    <th><span>만료일시</span></th>
                                                    <th><span>상태</span></th>
                                                    <th><span>등록일시</span></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tBodyList"></tbody>
                                        </table>
                                    </div>
                                    <div class="dataTables_paginate paging_simple_numbers" id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        pageInfoJs = new PageInfoJs();
        reservationJs.init();
    });
</script>
</body>
</html>
