<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script th:inline="javascript">
var _msg = {
    date: /*[[#{js.stats.date}]]*/ '',
    region: /*[[#{js.stats.region}]]*/ '',
    area: /*[[#{js.stats.area}]]*/ '',
    dateRange30: /*[[#{js.dashboard.dateRange30}]]*/ '',
    noDataReselect: /*[[#{js.stats.noDataReselect}]]*/ '',
    dateChAmountCost: /*[[#{js.stats.dateChAmountCost}]]*/ '',
    regionChAmountCost: /*[[#{js.stats.regionChAmountCost}]]*/ '',
    areaChAmountCost: /*[[#{js.stats.areaChAmountCost}]]*/ '',
    chAmountKwh: /*[[#{js.dashboard.chAmountKwh}]]*/ '',
    chCostWon: /*[[#{js.dashboard.chCostWon}]]*/ '',
    totalChAmount: /*[[#{js.dashboard.totalChAmount}]]*/ '',
    totalChCost: /*[[#{js.dashboard.totalChCost}]]*/ '',
    won: /*[[#{js.unit.won}]]*/ '',
    wonBracket: /*[[#{js.unit.wonBracket}]]*/ '',
    kwhBracket: /*[[#{js.unit.kwhBracket}]]*/ '',
    casesBracket: /*[[#{js.unit.casesBracket}]]*/ ''
};
</script>
<script type="text/javascript" th:src="@{/resources/js/statistics/chargerDailyStatistics.js(v=20230731001)}"></script>
<!-- ChartJS-->
<script type="text/javascript" th:src="@{/resources/lib/js/highcharts.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/highcharts-3d.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/exporting.js}"></script>

<div id="wrapper">
       <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
            	<div class="col-md-12">
                	<div class="ibox ">
                        <div class="ibox-title">
                            <h5><span th:text="#{statistics.daily.title}"></span></h5>
                        </div>
                        <div class="ibox-content">
	                        <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="form-group">
                                        <div class="input-group date">
                                            <span class="input-group-addon" style="border: 0px;padding-left: 0px;font-weight: 700;"><span th:text="#{statistics.label.request.date}"></span> : &nbsp; </span>
                                            <div class="input-daterange input-group" id="datepicker">
                                                <input type="text" class="input-sm form-control" id="date1" name="start" readonly>
                                                <span class="input-group-addon">to</span>
                                                <input type="text" class="input-sm form-control" id="date2" name="end" readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                    <input type='radio'
                                           name='option'
                                           value='DATE'
                                           checked/><span th:text="#{statistics.label.by.date}"></span>
                                    <input type='radio'
                                           name='option'
                                           value='SIDO'/><span th:text="#{statistics.label.by.region}"></span>
                                    <input type='radio'
                                           name='option'
                                           value='REGION'/><span th:text="#{statistics.label.by.area}"></span>
                                    <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary"> <span th:text="#{common.btn.search}"></span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
		<div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{statistics.label.graph}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                        	<div class="row">
                                <div class="col-lg-9">
                                     <div id="chart"></div>
                                </div>
                                <div class="col-lg-3">
                                    <ul class="stat-list">
                                        <li>
                                            <h2 class="no-margins" id="sumDayUseElecAmount"></h2>
                                            <small><span th:text="#{statistics.label.total.charge.amount}"></span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                        <li>
                                            <h2 class="no-margins" id="sumDayPayCost"></h2>
                                            <small><span th:text="#{statistics.label.total.charge.price}"></span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                        <li>
                                            <h2 class="no-margins " id="sumDayUseCount"></h2>
                                            <small><span th:text="#{statistics.label.total.charge.count}"></span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                       </ul>
                                   </div>
                               </div>
                        </div>
                    </div>
                </div>
            </div>
		<div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span th:text="#{statistics.label.list}"></span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                        	<div class="table-responsive">
                        		<div class="dataTables_wrapper form-inline dt-bootstrap">
		                            <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
		                                <thead>
		                                <tr>
										<th id="result"><span th:text="#{common.label.date}"></span></th>
										<th><span th:text="#{statistics.label.use.count}"></span></th>
										<th><span th:text="#{statistics.label.use.amount}"></span></th>
										<th><span th:text="#{recharging.label.amount.price}"></span></th>
		                                </tr>
		                                </thead>
		                                <tbody id="tBodyList">
		                                </tbody>
		                            </table>
	                            </div>
						</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
   	</div>
</div>
</body>
<script type="text/javascript">
var pageInfoJs;
jQuery(document).ready(function(){
	//
	chargerDailyStatisticsJs.init();
});
</script>
</html>
