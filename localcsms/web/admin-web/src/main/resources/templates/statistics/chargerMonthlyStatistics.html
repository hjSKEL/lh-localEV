<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body class="pace-done mini-navbar">
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/monthpicker/monthpicker.js}"></script>
<script>
var _msg = {
    yearMonth: '년월',
    region: '지역',
    area: '권역',
    dateRange1yr: '1년 이하 범위에서 날짜를 선택해주세요.',
    noDataReselect: '데이터가 없습니다. 날짜를 다시 선택해주세요.',
    dateChAmountCost: '날짜별 충전량/충전금액',
    regionChAmountCost: '지역별 충전량/충전금액',
    areaChAmountCost: '권역별 충전량/충전금액',
    chAmountKwh: '충전량(kWh)',
    chCostWon: '충전금액(원)',
    totalChAmount: '총 충전량 (kWh)',
    totalChCost: '총 충전금액 (원)',
    won: '원',
    wonBracket: '(원)',
    kwhBracket: '(kWh)',
    casesBracket: '(건)'
};
</script>
<script type="text/javascript" th:src="@{/resources/js/statistics/chargerMonthlyStatistics.js(v=20230731001)}"></script>
<!-- ChartJS-->
<script type="text/javascript" th:src="@{/resources/lib/js/highcharts.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/highcharts-3d.js}"></script>
<script type="text/javascript" th:src="@{/resources/lib/js/exporting.js}"></script>

<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-md-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5><span>충전기 월별 통계</span></h5>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="form-group">
                                        <div class="input-group date">
                                            <span class="input-group-addon"
                                                  style="border: 0px;padding-left: 0px;font-weight: 700;"><span>요청일자</span> : &nbsp; </span>
                                            <div class="input-daterange input-group" id="monthpicker">
                                                <input type="text" class="input-sm form-control" id="date1" name="start"
                                                       readonly>
                                                <span class="input-group-addon">to</span>
                                                <input type="text" class="input-sm form-control" id="date2" name="end"
                                                       readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                        <input type='radio'
                                               name='option'
                                               value='DATE'
                                               checked/><span>날짜별</span>
                                        <input type='radio'
                                               name='option'
                                               value='SIDO'/><span>지역별</span>
                                        <input type='radio'
                                               name='option'
                                               value='REGION'/><span>권역별</span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch"
                                                    class="btn btn-sm btn-primary"> <span>검색</span></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>그래프</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-lg-9">
                                    <div id="chart"></div>
                                </div>
                                <div class="col-lg-3">
                                    <ul class="stat-list">
                                        <li>
                                            <h2 class="no-margins" id="sumDayUseElecAmount"></h2>
                                            <small><span>기간 내 총 충전량</span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                        <li>
                                            <h2 class="no-margins" id="sumDayPayCost"></h2>
                                            <small><span>기간 내 총 충전금액</span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                        <li>
                                            <h2 class="no-margins " id="sumDayUseCount"></h2>
                                            <small><span>기간 내 총 충전횟수</span></small>
                                            <div class="progress progress-mini">
                                                <div style="width: 100%;" class="progress-bar"></div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>리스트</span></h5>
                            <div class="ibox-tools">
                                <a class="collapse-link">
                                    <i class="fa fa-chevron-up"></i>
                                </a>
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
                                        <thead>
                                        <tr>
                                            <th id="result"><span>년월</span></th>
                                            <th><span>이용횟수</span></th>
                                            <th><span>이용량(kWh)</span></th>
                                            <th><span>충전금액(원)</span></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    jQuery(document).ready(function () {
        //
        chargerMonthlyStatisticsJs.init();
    });
</script>
</html>
