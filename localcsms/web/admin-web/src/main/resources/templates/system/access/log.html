<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/lib/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script type="text/javascript" th:src="@{/resources/js/system/access/log.js(v=20230731001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5><span>접근 로그</span></h5>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-6 m-b-xs">
                                    <div class="form-group">
                                        <div class="input-group date">
                                            <span class="input-group-addon" style="border: 0px;padding-left: 0px;font-weight: 700;"><span>조회일자</span> : </span>
                                            <div class="input-daterange input-group" id="datepicker">
                                                <input type="text" class="input-sm form-control" id="fromDate" readonly>
                                                <span class="input-group-addon">to</span>
                                                <input type="text" class="input-sm form-control" id="toDate" readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="input-group">
                                		<span class="input-group-btn" style="width:20%">
                                			<select id="sType" class="input-sm form-control input-s-sm inline">
												<option value="A"><span>접근아이디</span></option>
												<option value="B"><span>접근 URL</span></option>
											</select>
										</span>
                                        <input type="text" id="searchKey" placeholder="검색어를 입력해주세요" class="form-control input-sm">
                                        <span class="input-group-btn">
											<button type="button" id="btnSearch" class="btn btn-sm btn-primary" style="float:right;"><span>검색</span></button>
										</span>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-top: 20px;">
                                <div class="col-sm-6">
                                    <label id="totalCount"></label>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <div class="dataTables_wrapper form-inline dt-bootstrap">
                                    <table class="table table-striped table-bordered table-hover dataTables-example dataTable dtr-inline">
                                        <thead>
                                        <tr>
                                            <th><span>번호</span></th>
                                            <th><span>접근아이디</span></th>
                                            <th><span>접근 IP</span></th>
                                            <th><span>접근 URL</span></th>
                                            <th><span>접근시간</span></th>
                                            <th><span>접근경로</span></th>
                                        </tr>
                                        </thead>
                                        <tbody id="tBodyList">
                                        </tbody>
                                    </table>
                                    <div class="dataTables_paginate paging_simple_numbers"
                                         id="DataTables_Table_0_paginate">
                                        <ul class="pagination" id="pagingUl"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    var pageInfoJs;
    jQuery(document).ready(function () {
        //
        pageInfoJs = new PageInfoJs();
        logJs.init();
    });
</script>
</html>
