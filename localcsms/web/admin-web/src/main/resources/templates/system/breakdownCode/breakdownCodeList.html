<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">

		        <div class="row">

	                        </div>
	                        <div class="ibox-content">
	                        	<div class="table-responsive">
		                             <table class="table table-bordered table-striped">
		                              <tbody>
			                               <colgroup>
							                <col width="15%">
							                <col width="35%">
							                <col width="15%">
							                <col width="35%">
						              </colgroup>
		                                  <tr>

											  <td id="breakdownCodeId"></td>

		                                      <td>
		                                    	  <input type="text" name="majorCategoryName" id="majorCategoryName" class="form-control input-sm">

		                                  </tr>
		                                  <tr>

		                                      <td>

		                                      <td>

		                                  </tr>
		                                  <tr>

		                                      <td>
		                                       		<input type="text" name="minorDetailCategoryName" id="minorDetailCategoryName" class="form-control input-sm">

		                                      <td>
		                                    	  <select name="deleteYn" id="deleteYn" class="form-control">

		                                    	  	<option value="Y"><span>예</span></option>
		                                    	  </select>
		                                      </td>
		                                  </tr>
		                                  <tr>
		                                      <th><span>LEVEL</span></th>
		                                      <td>
		                                       		<input type="number" name="level" id="level" value="1" class="form-control input-sm" readonly>
		                                      </td>
		                                      <th></th>
		                                      <td></td>
		                                  </tr>
		                              </tbody>
		                             </table>
		                             <div class="ibox-content">
			                              	<button id="btnBreakDownCodeRegister" class="btn btn-success pull-right"> <span>등록</span></button>

			                              	<button id="btnBreakDownCodeUpdate" class="btn btn-warning pull-right"> <span>수정</span></button>
			                        </div>
		                         </div>
	                        </div>
	                    </div>
	                	 <div class="ibox ">
