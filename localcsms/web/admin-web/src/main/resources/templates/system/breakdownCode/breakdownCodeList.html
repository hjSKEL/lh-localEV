<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<!-- Nestable List -->
<script th:src="@{/resources/lib/js/plugins/nestable/jquery.nestable.js}"></script>
<script type="text/javascript" th:src="@{/resources/js/system/breakdownCode/breakdownCode.js(v=20230731001)}"></script>
<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
	        <div class="wrapper wrapper-content">
		        <div class="row">
	                <div class="col-lg-12">
	                	 <div class="ibox ">
	                        <div class="ibox-title">
	                            <h5><span th:text="#{system.breakdown.code.info.title}"></span></h5>
	                        </div>
	                        <div class="ibox-content">
	                        	<div class="table-responsive">
		                             <table class="table table-bordered table-striped">
		                              <tbody>
			                               <colgroup>
							                <col width="15%">
							                <col width="35%">
							                <col width="15%">
							                <col width="35%">
						              </colgroup>
		                                  <tr>
											  <th><span th:text="#{system.breakdown.code.id}"></span></th>
											  <td id="breakdownCodeId"></td>
		                                      <th><span th:text="#{system.breakdown.code.majorCategory}"></span></th>
		                                      <td>
		                                    	  <input type="text" name="majorCategoryName" id="majorCategoryName" class="form-control input-sm">
		                                      </td>
		                                  </tr>
		                                  <tr>
		                                      <th><span th:text="#{system.breakdown.code.middleCategory}"></span></th>
		                                      <td>
		                                       		<input type="text" name="middleCategoryName" id="middleCategoryName" class="form-control input-sm">
		                                      </td>
		                                      <th><span th:text="#{system.breakdown.code.minorCategory}"></span></th>
		                                      <td>
		                                    	  <input type="text" name="minorCategoryName" id="minorCategoryName" class="form-control input-sm">
		                                      </td>
		                                  </tr>
		                                  <tr>
		                                      <th><span th:text="#{system.breakdown.code.detailCategory}"></span></th>
		                                      <td>
		                                       		<input type="text" name="minorDetailCategoryName" id="minorDetailCategoryName" class="form-control input-sm">
		                                      </td>
		                                      <th><span th:text="#{system.breakdown.code.deleteYn.label}"></span></th>
		                                      <td>
		                                    	  <select name="deleteYn" id="deleteYn" class="form-control">
		                                    	  	<option value="N"><span th:text="#{system.breakdown.code.deleteYn.no}"></span></option>
		                                    	  	<option value="Y"><span th:text="#{system.breakdown.code.deleteYn.yes}"></span></option>
		                                    	  </select>
		                                      </td>
		                                  </tr>
		                                  <tr>
		                                      <th><span th:text="#{system.breakdown.code.level}"></span></th>
		                                      <td>
		                                       		<input type="number" name="level" id="level" value="1" class="form-control input-sm" readonly>
		                                      </td>
		                                      <th></th>
		                                      <td></td>
		                                  </tr>
		                              </tbody>
		                             </table>
		                             <div class="ibox-content">
			                              	<button id="btnBreakDownCodeRegister" class="btn btn-success pull-right"> <span th:text="#{system.breakdown.code.register.btn}"></span></button>
			                              	<button id="btnBreakDownCodeSubRegister" class="btn btn-success pull-right"> <span th:text="#{system.breakdown.code.subRegister.btn}"></span></button>
			                              	<button id="btnBreakDownCodeUpdate" class="btn btn-warning pull-right"> <span th:text="#{system.breakdown.code.update.btn}"></span></button>
			                        </div>
		                         </div>
	                        </div>
	                    </div>
	                	 <div class="ibox ">
	                        <div class="ibox-title">
	                            <h5><span th:text="#{system.breakdown.code.tree.title}"></span></h5>
	                        </div>
	                        <div class="ibox-content">
	                            <div class="dd" id="nestable2">
	                                <ol id="breakDownCodeRoot" class="dd-list">
	                                </ol>
	                            </div>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </div>
    	</div>
	</div>
</body>
<script th:inline="javascript">
var _msg = {
    breakdownCodeMgmt: /*[[#{js.breakdownCode.breakdownCodeMgmt}]]*/ '',
    confirmChangeBreakdownCode: /*[[#{js.breakdownCode.confirmChangeBreakdownCode}]]*/ '',
    btnModify: /*[[#{js.breakdownCode.btnModify}]]*/ '',
    btnCancel: /*[[#{js.breakdownCode.btnCancel}]]*/ ''
};
</script>
<script type="text/javascript">
var pageInfoJs;
jQuery(document).ready(function(){
	 //
	 pageInfoJs = new PageInfoJs();
	 systemBreakdownCodeJs.init();
});
</script>
</html>
