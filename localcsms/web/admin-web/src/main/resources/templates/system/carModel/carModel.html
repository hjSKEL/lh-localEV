<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/js/system/carModel/carModel.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
	<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
	                <div class="ibox float-e-margins">
	                    <div class="ibox-title">
	                        <h5 th:if="${carModelId == null or carModelId == ''}" th:text="#{system.carmodel.register.title}"></h5>
	                        <h5 th:unless="${carModelId == null or carModelId == ''}" th:text="#{system.carmodel.detail.title}"></h5>
	                        <div class="ibox-tools">
	                            <a class="collapse-link">
	                                <i class="fa fa-chevron-up"></i>
	                            </a>
	                            <a class="dropdown-toggle" data-toggle="dropdown" href="#">
	                            </a>
	                        </div>
	                    </div>
	                    <div class="ibox-content">
	                         <div class="table-responsive">
	                             <table class="table table-bordered table-striped">
	                              <tbody>
		                               <colgroup>
					                <col width="15%">
					                <col width="35%">
					                <col width="15%">
					                <col width="35%">
				              </colgroup>
	                                  <tr>
	                                     <th th:if="${carModelId != null and carModelId != ''}"><span th:text="#{system.carmodel.id}"></span></th>
	                                     <td th:if="${carModelId != null and carModelId != ''}" colspan="3" th:text="${carModelId}"></td>
	                                  </tr>
	                                  <tr>
	                                      <th><span th:text="#{system.carmodel.name}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                    	  <input type="text" name="carName" id="carName" class="form-control input-sm">
	                                      </td>
	                                      <th><span th:text="#{system.carmodel.maker}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                    	  <select name="carMaker" id="carMaker" class="form-control input-sm" th:disabled="${carModelId != null and carModelId != ''}"></select>
	                                      </td>
	                                  </tr>
	                                  <tr>
	                                      <th><span th:text="#{system.carmodel.connector}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                       		<select name="linkCode" id="linkCode" class="form-control input-sm"></select>
	                                      </td>
	                                      <th><span th:text="#{system.carmodel.batteryCapacity}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                    	  <input type="number" name="batteryCapacity" id="batteryCapacity" class="form-control input-sm">
	                                      </td>
	                                  </tr>
	                                  <tr>
	                                      <th><span th:text="#{system.carmodel.range}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                       		<input type="number" name="drivingDistance" id="drivingDistance" class="form-control input-sm">
	                                      </td>
	                                      <th><span th:text="#{system.carmodel.efficiency}"></span><span style ="color:red;">*</span></th>
	                                      <td>
	                                    	  <input type="number" name="kmKwh" id="kmKwh" class="form-control input-sm">
	                                      </td>
	                                  </tr>
	                              </tbody>
	                             </table>
	                             <div class="ibox-content">
	                              	<button class="btn btn-white pull-right" id="btnList"> <span th:text="#{common.btn.list}"></span></button>
	                              	<button th:if="${carModelId == null or carModelId == ''}" id="btnCarModelRegister" class="btn btn-success pull-right"> <span th:text="#{common.btn.register}"></span></button>
	                              	<button th:unless="${carModelId == null or carModelId == ''}" id="btnCarModelUpdate" class="btn btn-warning pull-right"> <span th:text="#{common.btn.edit}"></span></button>
		                        </div>
	                         </div>
	                    </div>
	                </div>
	            </div>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
var _msg = {
    carModelMgmt: /*[[#{js.carModel.carModelMgmt}]]*/ '',
    enterCarName: /*[[#{js.carModel.enterCarName}]]*/ '',
    enterBatteryCapacity: /*[[#{js.carModel.enterBatteryCapacity}]]*/ '',
    enterDrivingDistance: /*[[#{js.carModel.enterDrivingDistance}]]*/ '',
    enterKmKwh: /*[[#{js.carModel.enterKmKwh}]]*/ '',
    confirmModifyCarModel: /*[[#{js.carModel.confirmModifyCarModel}]]*/ '',
    btnModify: /*[[#{js.carModel.btnModify}]]*/ '',
    btnCancel: /*[[#{js.carModel.btnCancel}]]*/ '',
    registering: /*[[#{js.carModel.registering}]]*/ '',
    modifying: /*[[#{js.carModel.modifying}]]*/ ''
};
</script>
<script th:inline="javascript">
var carModelId = /*[[${carModelId}]]*/ '';
jQuery(document).ready(function(){
	 //
	 carModelJs.init();
});
</script>
</body>
</html>
