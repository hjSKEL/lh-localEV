<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/js/system/menu/systemMenuDetail.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5><span>메뉴 등록</span></h5>
                        <div class="ibox-tools">
                            <a class="collapse-link">
                                <i class="fa fa-chevron-up"></i>
                            </a>
                            <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                            </a>
                        </div>
                    </div>
                    <div class="ibox-content">
                         <div class="table-responsive">
                             <table class="table table-bordered table-striped">
                              <tbody>
                                  <tr>
                                      <th style="width:15%;"><span>메뉴 아이디</span></th>
                                      <td style="width:35%;">
                                      		<input type="text" id="menuId" name="menuId" class="form-control">
                                      </td>
                                      <th style="width:15%;"><span>상위메뉴 아이디</span></th>
                                      <td style="width:35%;">
                                      		<input type="text" id="highMenuId" name="highMenuId" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span>메뉴명</span></th>
                                      <td>
                                      		<input type="text" id="menuName" name="menuName" class="form-control">
                                      </td>
                                      <th><span>메뉴명(영문)</span></th>
                                      <td>
                                      		<input type="text" id="menuNameEn" name="menuNameEn" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span>순서</span></th>
									  <td colspan="3">
											<input type="number" id="ordPriority" name="ordPriority" class="form-control">
									  </td>
                                  </tr>
                                  <tr>
                                      <th><span>URL</span></th>
                                      <td colspan="3">
                                      		<input type="text" id="menuUrl" name="menuUrl" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span>Link 유형</span></th>
                                      <td colspan="3">
                                      		<input type="text" id="linkType" name="linkType" value="N/A" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span>설명</span></th>
                                      <td colspan="3">
                                      		<textarea class="form-control" id="menuDesc" rows="5"></textarea>
                                      </td>
                                  </tr>
                              </tbody>
                             </table>
                             <div class="ibox-content">
	                            <button class="btn btn-white pull-right" id="btnList"> <span>목록</span></button>
                              	<button id="btnUpdate" class="btn btn-warning pull-right"> <span>수정</span></button>
	                            <button id="btnDelete" class="btn btn-danger pull-right"> <span>삭제</span></button>
	                        </div>
                         </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
var _msg = {
    dataError: '조회된 내용이 이상합니다. 다시 목록에서 다시 시도 바랍니다.'
};
</script>
<script type="text/javascript">
var menuId = [[${menuId}]];

jQuery(document).ready(function(){
	 //
	 systemMenuDetailJs.init();
});
</script>
</html>
