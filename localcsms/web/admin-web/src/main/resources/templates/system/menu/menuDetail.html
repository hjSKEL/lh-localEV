<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script type="text/javascript" th:src="@{/resources/js/system/menu/systemMenuDetail.js(v=20230731001)}"></script>
<script type="text/javascript" th:src="@{/resources/js/util/validate.js}"></script>
<div id="wrapper">
        <div id="page-wrapper" class="gray-bg" style="margin: 0; padding: 0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5><span th:text="#{system.menu.register.title}"></span></h5>
                        <div class="ibox-tools">
                            <a class="collapse-link">
                                <i class="fa fa-chevron-up"></i>
                            </a>
                            <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                            </a>
                        </div>
                    </div>
                    <div class="ibox-content">
                         <div class="table-responsive">
                             <table class="table table-bordered table-striped">
                              <tbody>
                                  <tr>
                                      <th style="width:15%;"><span th:text="#{system.menu.id.label}"></span></th>
                                      <td style="width:35%;">
                                      		<input type="text" id="menuId" name="menuId" class="form-control">
                                      </td>
                                      <th style="width:15%;"><span th:text="#{system.menu.parentId.label}"></span></th>
                                      <td style="width:35%;">
                                      		<input type="text" id="highMenuId" name="highMenuId" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span th:text="#{system.menu.name}"></span></th>
                                      <td>
                                      		<input type="text" id="menuName" name="menuName" class="form-control">
                                      </td>
                                      <th><span th:text="#{system.menu.nameEn}"></span></th>
                                      <td>
                                      		<input type="text" id="menuNameEn" name="menuNameEn" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span th:text="#{system.menu.order}"></span></th>
									  <td colspan="3">
											<input type="number" id="ordPriority" name="ordPriority" class="form-control">
									  </td>
                                  </tr>
                                  <tr>
                                      <th><span th:text="#{system.menu.url}"></span></th>
                                      <td colspan="3">
                                      		<input type="text" id="menuUrl" name="menuUrl" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span th:text="#{system.menu.linkType.label}"></span></th>
                                      <td colspan="3">
                                      		<input type="text" id="linkType" name="linkType" value="N/A" class="form-control">
                                      </td>
                                  </tr>
                                  <tr>
                                      <th><span th:text="#{system.menu.description}"></span></th>
                                      <td colspan="3">
                                      		<textarea class="form-control" id="menuDesc" rows="5"></textarea>
                                      </td>
                                  </tr>
                              </tbody>
                             </table>
                             <div class="ibox-content">
	                            <button class="btn btn-white pull-right" id="btnList"> <span th:text="#{common.btn.list}"></span></button>
                              	<button id="btnUpdate" class="btn btn-warning pull-right"> <span th:text="#{common.btn.edit}"></span></button>
	                            <button id="btnDelete" class="btn btn-danger pull-right"> <span th:text="#{common.btn.delete}"></span></button>
	                        </div>
                         </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
</body>
<script th:inline="javascript">
var _msg = {
    dataError: /*[[#{js.menuDetail.dataError}]]*/ ''
};
</script>
<script type="text/javascript">
var menuId = [[${menuId}]];

jQuery(document).ready(function(){
	 //
	 systemMenuDetailJs.init();
});
</script>
</html>
