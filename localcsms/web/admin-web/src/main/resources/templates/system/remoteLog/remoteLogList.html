<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/header :: head}"></head>
<body>
<script>
    var _msg = {
        title:        '원격명령 로그',
        uuid:         'UUID',
        actionName:   'Action명',
        status:       '상태',
        reqPayload:   'Request Payload',
        resPayload:   'Response Payload',
        regDt:        '등록일시',
        statusReq:    '요청',
        statusRes:    '전송완료',
        statusFail:   '실패',
        detail:       '원격명령 상세',
        placeholder:  'Action명 검색'
    };
</script>
<script type="text/javascript" th:src="@{/resources/js/system/remoteLog/remoteLogList.js(v=20260327001)}"></script>
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg" style="margin:0; padding:0;">
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox float-e-margins">
                        <div class="ibox-title">
                            <h5>원격명령 로그</h5>
                        </div>
                        <div class="ibox-content">
                            <!-- 검색 조건 -->
                            <div class="row m-b-sm">
                                <div class="col-sm-12">
                                    <div class="input-group">
                                        <span class="input-group-addon">Action명</span>
                                        <input type="text" id="actionName" class="form-control input-sm" placeholder="Action명 검색" style="max-width:220px;" />
                                        <span class="input-group-addon">OCPP</span>
                                        <select id="ocppVersion" class="form-control input-sm" style="max-width:120px;">
                                            <option value="">전체</option>
                                            <option value="1.6">1.6</option>
                                            <option value="2.0.1">2.0.1</option>
                                        </select>
                                        <span class="input-group-addon">상태</span>
                                        <select id="status" class="form-control input-sm" style="max-width:140px;">
                                            <option value="">전체</option>
                                            <option value="RMST01">요청</option>
                                            <option value="RMST02">전송완료</option>
                                            <option value="RMST03">실패</option>
                                        </select>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnSearch" class="btn btn-sm btn-primary">검색</button>
                                        </span>
                                        <span class="input-group-btn">
                                            <button type="button" id="btnReset" class="btn btn-sm btn-warning">초기화</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <!-- 건수 -->
                            <div class="row m-b-xs">
                                <div class="col-sm-12">
                                    <label id="totalCount"></label>
                                </div>
                            </div>
                            <!-- 목록 테이블 -->
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover"
                                       style="white-space:nowrap; text-align:center; font-size:12px;">
                                    <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>UUID</th>
                                        <th>OCPP</th>
                                        <th>Action명</th>
                                        <th>상태</th>
                                        <th>등록일시</th>
                                    </tr>
                                    </thead>
                                    <tbody id="tBodyList">
                                    </tbody>
                                </table>
                            </div>
                            <!-- 페이징 -->
                            <div class="row">
                                <div class="col-sm-12 text-center">
                                    <ul class="pagination pagination-sm" id="pagination"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 상세 레이어 팝업 -->
<div class="modal fade" id="detailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">원격명령 상세</h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered" style="text-align:left;">
                    <colgroup>
                        <col style="width:20%">
                        <col style="width:80%">
                    </colgroup>
                    <tbody>
                        <tr>
                            <th>UUID</th>
                            <td id="detailUuid" style="word-break:break-all;"></td>
                        </tr>
                        <tr>
                            <th>OCPP</th>
                            <td id="detailOcppVersion"></td>
                        </tr>
                        <tr>
                            <th>Action명</th>
                            <td id="detailActionName"></td>
                        </tr>
                        <tr>
                            <th>상태</th>
                            <td id="detailStatus"></td>
                        </tr>
                        <tr>
                            <th>등록일시</th>
                            <td id="detailRegDt"></td>
                        </tr>
                        <tr>
                            <th>Request Payload</th>
                            <td><pre id="detailReqPayload" style="max-height:200px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; margin:0;"></pre></td>
                        </tr>
                        <tr>
                            <th>Response Payload</th>
                            <td><pre id="detailResPayload" style="max-height:200px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; margin:0;"></pre></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" id="btnDelete" class="btn btn-danger btn-sm">삭제</button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
